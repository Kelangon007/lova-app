<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bass Jazz (Static Frame Speakers)</title>
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.5/fix-webm-duration.js"></script>
  <style>
    body { margin: 0; background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%); background-size: 20px 20px; background-color: #333; font-family: 'Segoe UI', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; touch-action: pan-y; }
    #canvas-wrapper { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.3); background: transparent; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8); cursor: grab; overflow: hidden; }
    #canvas-wrapper:active { cursor: grabbing; }
    canvas { width: 100%; height: 100%; display: block; }
    #controls { width: 90%; max-width: 600px; background: #1a1a1a; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); }
    .btn-group, .play-group { display: flex; gap: 8px; }
    .file-label { flex: 1; background: #2b2b2b; color: #ccc; padding: 12px 5px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; border: 1px solid #444; transition: 0.2s; white-space: nowrap; }
    .file-label:hover { background: #3b3b3b; color: white; }
    #playBtn { flex: 2; padding: 15px; background: #333; color: #888; border: 1px solid #222; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    #playBtn.ready { background: linear-gradient(135deg, #d4af37, #f39c12); color: #111; border: none; }
    #nextBtn { flex: 1; padding: 15px; background: #444; color: #aaa; border: 1px solid #333; border-radius: 8px; font-weight: bold; cursor: not-allowed; transition: 0.3s; }
    #nextBtn.ready { background: #2a2a2a; color: white; border: 1px solid #555; cursor: pointer; }
    .progress-container { display: flex; align-items: center; gap: 10px; background: #222; padding: 8px; border-radius: 6px; border: 1px solid #333; }
    .time-text { font-size: 11px; font-family: monospace; color: #d4af37; min-width: 40px; text-align: center; }
    #progressBar { flex: 1; height: 5px; -webkit-appearance: none; background: #444; border-radius: 5px; cursor: pointer; }
    #progressBar::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; background: #f39c12; border-radius: 50%; cursor: pointer; }
    .btn-record { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff4444, #d32f2f); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #stopOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(220, 20, 60, 0.95); color: white; padding: 15px 30px; border-radius: 50px; z-index: 100; font-weight: bold; border: 3px solid white; cursor: pointer; }
    #countdownOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: bold; color: white; text-shadow: 0 0 20px rgba(0, 0, 0, 0.8); z-index: 100; }
    #statusBox { font-size: 12px; text-align: center; color: #d4af37; margin-bottom: 5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; align-items: center; gap: 10px; }
    label { font-size: 11px; width: 80px; color: #ccc; font-weight: 600; }
    input[type="range"], select { flex: 1; height: 36px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 6px; }
    input[type="file"] { display: none; }
    optgroup { background: #111; color: #d4af37; font-weight: bold; }
  </style>
</head>

<body>

  <div id="canvas-wrapper">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="countdownOverlay">3</div>
    <div id="stopOverlay" onclick="stopRecording()">⏹ STOP & SIMPAN</div>
  </div>

  <div id="controls">
    <div id="statusBox">Siap. Bass Jazz (50 Vis + Realist Cone Speakers).</div>
    <div class="btn-group">
      <label for="bgInput" class="file-label" style="border-bottom: 3px solid #d4af37">1. FOTO LATAR</label>
      <label for="audioInput" class="file-label" style="border-bottom: 3px solid #00bcd4">2. MUSIK (BANYAK)</label>
    </div>

    <div class="play-group">
      <button id="playBtn" onclick="togglePlay()">⚠ PUTAR MUSIK</button>
      <button id="nextBtn" onclick="playRandomSong(false)">⏭ NEXT</button>
    </div>

    <div class="progress-container">
      <span id="currTime" class="time-text">00:00</span>
      <input type="range" id="progressBar" value="0" min="0" step="0.1">
      <span id="durTime" class="time-text">00:00</span>
    </div>

    <input type="file" id="bgInput" accept="image/*">
    <input type="file" id="audioInput" accept="audio/*" multiple>

    <hr style="border: 0; border-top: 1px solid #333; width: 100%; margin: 5px 0;">

    <div class="row">
      <label style="color:#d4af37;">VISUALIZER</label>
      <select id="visType">
        <optgroup label="=== SOLID & CLASSIC BARS (1-10) ===">
            <option value="vintage_bars">📊 1. Vintage Solid Bars</option>
            <option value="winamp_classic">📻 2. Winamp Classic Peaks</option>
            <option value="classic_eq">🎙️ 3. Classic Green-Yellow-Red EQ</option>
            <option value="step_eq">🧱 4. Step Block EQ</option>
            <option value="thin_eq">📏 5. Thin Minimalist EQ</option>
            <option value="thick_bars">⬛ 6. Bold Heavy Solid Bars</option>
            <option value="hollow_bars">🔲 7. Hollow Outline Bars</option>
            <option value="rounded_bars">💊 8. Smooth Rounded Tip Bars</option>
            <option value="split_eq">⏸️ 9. Split Center EQ Bars</option>
            <option value="double_mirror">🪞 10. Dual Mirror Bars</option>
        </optgroup>
        <optgroup label="=== PEAKS, DOTS & VU METERS (11-20) ===">
            <option value="dotted_eq">⏺️ 11. Dotted Peak EQ</option>
            <option value="led_matrix">🚥 12. LED Dot Matrix</option>
            <option value="analog_vu">🎛️ 13. Analog VU Meter (Amber)</option>
            <option value="retro_oscilloscope">📺 14. CRT Oscilloscope Line</option>
            <option value="peak_line">〰️ 15. Floating Peak Line Only</option>
            <option value="peak_dots_only">⚪ 16. Floating Dots Peak Only</option>
            <option value="dash_bars">➖ 17. Dashed Segment Bars</option>
            <option value="meter_blocks">📶 18. Segmented Meter Blocks</option>
            <option value="soft_glow_bars">🌟 19. Soft Glowing Ambient Bars</option>
            <option value="white_caps">🧢 20. Solid Bars with White Cap</option>
        </optgroup>
        <optgroup label="=== MODERN & GRADIENT BARS (21-30) ===">
            <option value="liquid_bar">💧 21. Liquid Glowing Cyan Bars</option>
            <option value="cyber_pulse">⚡ 22. Neon Pulse Bars</option>
            <option value="mirror_bars">🪞 23. Mirrored Glass Bars</option>
            <option value="gradient_blocks">🎛️ 24. Cyan-Blue Gradient</option>
            <option value="sunset_bars">🌅 25. Warm Sunset Gradient</option>
            <option value="emerald_bars">💎 26. Emerald Green Gradient</option>
            <option value="purple_haze">🟣 27. Purple-Pink Soft Bars</option>
            <option value="gold_classic">👑 28. Golden Elegant EQ Bars</option>
            <option value="monochrome_fade">🎞️ 29. Grayscale Fading Bars</option>
            <option value="dual_tone">🌗 30. Dual Tone Top-Bottom Bars</option>
        </optgroup>
        <optgroup label="=== SMOOTH WAVES & LINES (31-40) ===">
            <option value="modern_wave">🌊 31. Modern Smooth Wave</option>
            <option value="filled_wave">🌊 32. Filled Ambient Waveform</option>
            <option value="double_wave">〰️ 33. Double Layer Wave</option>
            <option value="thin_wave">✒️ 34. Ultra Thin Crisp Line</option>
            <option value="shadow_wave">🌒 35. Wave with Soft Shadow</option>
            <option value="stereo_lines">⏸️ 36. Dual Parallel Lines</option>
            <option value="smooth_curve">🔔 37. Symmetric Bell Curve Wave</option>
            <option value="ribbon_wave">🎀 38. Flowing Ribbon Wave</option>
            <option value="minimal_line">➖ 39. Single Clean Baseline</option>
            <option value="calm_horizon">🌅 40. Calm Horizon Glow</option>
        </optgroup>
        <optgroup label="=== CIRCULAR & CLEAN STUDIO EQS (41-50) ===">
            <option value="circle_bars">🎡 41. Circular Audio Bars</option>
            <option value="circle_ring">⭕ 42. Simple Circular Line</option>
            <option value="circle_dashed">🎯 43. Circular Dashed EQ</option>
            <option value="circle_mirror">🪞 44. Inner & Outer Circle Bars</option>
            <option value="vinyl_record">💿 45. Spinning Vinyl Record</option>
            <option value="block_tower">🏙️ 46. Clean 3D EQ Blocks</option>
            <option value="equalizer_3d">🛠️ 47. Cylinder Studio EQ</option>
            <option value="floating_blocks">🧊 48. Floating Ambient Blocks</option>
            <option value="center_pulse">🔘 49. Center Expanding Bars</option>
            <option value="classic_studio">🎙️ 50. Pro Studio Rack EQ</option>
        </optgroup>
      </select>
    </div>

    <div class="row"><label>TINGGI VIS.</label><input type="range" id="visHeight" min="30" max="600" value="150"></div>
    <div class="row"><label style="color:#00d2ff;">LEBAR VIS.</label><input type="range" id="visWidth" min="100" max="1100" value="400"></div>
    <div class="row"><label style="color:#e040fb;">OPASITAS VIS.</label><input type="range" id="visOpacity" min="0.1" max="1.0" step="0.05" value="1.0"></div>

    <hr style="border: 0; border-top: 1px solid #333; width: 100%; margin: 5px 0;">

    <div class="row">
      <label style="color:#ffb300;">EFEK SPEAKER</label>
      <select id="speakerStyle">
        <option value="none">🚫 Sembunyikan Speaker</option>
        <option value="golden_cone">🟡 Golden Cone (Sesuai Foto)</option>
        <option value="classic_black">⚫ Classic Black Subwoofer</option>
        <option value="white_monitor">⚪ White Monitor Cone</option>
        <option value="silver_alum">🔘 Silver Aluminum Driver</option>
        <option value="red_kevlar">🔴 Red Kevlar Bass</option>
        <option value="neon_ring">⭕ Cyan Neon Glowing Ring</option>
        <option value="hollow_pulse">➰ Minimalist Hollow Pulse</option>
        <option value="glass_dome">🪞 Transparent Glass Dome</option>
        <option value="dj_strobe">🌈 DJ Strobe Rings</option>
        <option value="shatter_bass">💥 Shattered Bass Impact</option>
      </select>
    </div>
    <!-- PASTIKAN SETTINGAN INI PAS UNTUK MENUTUPI GAMBAR LATAR -->
    <div class="row"><label style="color:#ffb300;">UKURAN SPK</label><input type="range" id="speakerSize" min="0.2" max="5.0" step="0.1" value="1.5"></div>
    <div class="row"><label style="color:#ffb300;">OPASITAS SPK</label><input type="range" id="speakerOpacity" min="0.1" max="1.0" step="0.05" value="1.0"></div>

    <hr style="border: 0; border-top: 1px dashed #333; width: 100%; margin: 5px 0;">

    <div class="row">
      <label>EFEK FILM</label>
      <select id="type">
        <option value="vintage">🎞️ Vintage HD (Kotor, Debu, Rambut)</option>
        <option value="grain">🎬 Grains (Bintik & Debu Saja)</option>
        <option value="scratch">📽️ Scratches (Garis Vertikal Saja)</option>
        <option value="sepia_dust">📜 Sepia Dust (Klasik Coklat)</option>
        <option value="old_tv">📺 Old TV (Scanline & Noise)</option>
        <option value="flicker_8mm">🎞️ 8mm Flicker (Kedap-Kedip)</option>
        <option value="rain">🌧️ Hujan Realistis</option>
        <option value="snow">❄️ Salju Lembut</option>
        <option value="fireflies">✨ Kunang-Kunang</option>
        <option value="none">Tanpa Efek</option>
      </select>
    </div>

    <div class="row">
      <label>ARAH EFEK</label>
      <select id="fxAngle">
        <option value="0">Lurus (Normal)</option>
        <option value="15">Miring Kanan 15°</option>
        <option value="30">Miring Kanan 30°</option>
        <option value="-15">Miring Kiri 15°</option>
        <option value="-30">Miring Kiri 30°</option>
      </select>
    </div>

    <div class="row"><label>KECEPATAN</label><input type="range" id="fxSpeed" min="0.1" max="5.0" step="0.1" value="1.0"></div>
    <div class="row"><label>JUMLAH FX</label><input type="range" id="count" min="0" max="400" value="100"></div>

    <button class="btn-record" id="recordBtn" onclick="startCountdownAndRecord()">🔴 MULAI REKAM 720p</button>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    const statusBox = document.getElementById('statusBox');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const stopOverlay = document.getElementById('stopOverlay');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const recordBtn = document.getElementById('recordBtn');
    const progressBar = document.getElementById('progressBar');
    const currTimeEl = document.getElementById('currTime');
    const durTimeEl = document.getElementById('durTime');
    let isDraggingProgress = false;
    
    const width = 1280;
    const height = 720;

    let audioFiles = []; let currentObjectUrl = null; let currentSongName = ""; let playTimeout = null;
    let isTrackLoaded = false; let shuffledPlaylist = []; let currentPlayIndex = 0; let isCountingDown = false; let countdownTimer = null;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; }
      return array;
    }

    document.getElementById('audioInput').addEventListener('change', function(e) {
      if (this.files.length > 0) {
        audioFiles = Array.from(this.files); isTrackLoaded = true; shuffledPlaylist = shuffle(Array.from({ length: audioFiles.length }, (v, k) => k));
        currentPlayIndex = 0; playBtn.innerHTML = "▶ PLAY MUSIK"; playBtn.classList.add('ready'); nextBtn.classList.add('ready');
        statusBox.innerText = `${audioFiles.length} Lagu dimuat. Siap diputar!`; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
        audioPlayer.pause(); if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; currentSongName = "Musik Diunggah";
      }
    });

    function playRandomSong(isInstant = false) {
      if (audioFiles.length === 0) return;
      if (playTimeout) clearTimeout(playTimeout);
      if (currentPlayIndex >= shuffledPlaylist.length) { currentPlayIndex = 0; stopEverything(); return; }
      if (currentObjectUrl && isInstant) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
      const delayAmount = isInstant ? 0 : 3500;
      if (!isInstant) {
        audioPlayer.pause(); playBtn.innerText = "⏳ TUNGGU..."; statusBox.innerText = "⏳ Jeda pergantian lagu...";
        currentSongName = "Memuat..."; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
      }
      playTimeout = setTimeout(() => {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        const actualFileIndex = shuffledPlaylist[currentPlayIndex]; const selectedFile = audioFiles[actualFileIndex];
        currentSongName = selectedFile.name.replace(/\.[^/.]+$/, ""); currentObjectUrl = URL.createObjectURL(selectedFile);
        audioPlayer.src = currentObjectUrl; audioPlayer.load();
        if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
        audioPlayer.play().then(() => { playBtn.innerText = "⏸ PAUSE"; statusBox.innerText = `🎵 Lagu ${currentPlayIndex + 1}/${audioFiles.length}: ${currentSongName}`; currentPlayIndex++; }).catch(err => { playBtn.innerText = "❌ ERROR"; });
      }, delayAmount);
    }

    audioPlayer.addEventListener('ended', () => { playRandomSong(false); });

    function stopEverything() {
      audioPlayer.pause(); if (playTimeout) clearTimeout(playTimeout);
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; currentSongName = "Playlist Selesai";
      if (dataArray) dataArray.fill(0); shuffledPlaylist = shuffle(Array.from({ length: audioFiles.length }, (v, k) => k));
      statusBox.innerText = `✅ Semua lagu selesai.`; playBtn.innerText = "▶ PLAY ACAK"; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
      if (mediaRecorder && mediaRecorder.state === 'recording') { statusBox.innerText = `✅ Menyimpan rekaman otomatis...`; setTimeout(() => { stopRecording(); }, 500); }
    }

    // POSISI VISUALIZER & DUAL SPEAKER
    let visW = 400; let visX = (width - visW) / 2; let visY = height - 160;
    let spk1X = 250; let spk1Y = height - 300;
    let spk2X = width - 250; let spk2Y = height - 300;
    
    let isDraggingSpk1 = false; let isDraggingSpk2 = false; let isDraggingVis = false;
    let dragOffsetX = 0; let dragOffsetY = 0;

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
      let clientX = e.clientX; let clientY = e.clientY;
      if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startDrag(e) {
      const pos = getMousePos(e); 
      const spkScale = parseFloat(document.getElementById('speakerSize').value);
      const clickRadius = 60 * spkScale;
      
      const dist1 = Math.hypot(pos.x - spk1X, pos.y - spk1Y);
      if (dist1 <= Math.max(40, clickRadius) && document.getElementById('speakerStyle').value !== 'none') { 
        isDraggingSpk1 = true; dragOffsetX = pos.x - spk1X; dragOffsetY = pos.y - spk1Y; if (e.cancelable) e.preventDefault(); return; 
      }
      
      const dist2 = Math.hypot(pos.x - spk2X, pos.y - spk2Y);
      if (dist2 <= Math.max(40, clickRadius) && document.getElementById('speakerStyle').value !== 'none') { 
        isDraggingSpk2 = true; dragOffsetX = pos.x - spk2X; dragOffsetY = pos.y - spk2Y; if (e.cancelable) e.preventDefault(); return; 
      }
      
      if (pos.x >= visX && pos.x <= visX + visW && pos.y >= visY - 150 && pos.y <= visY + 150) { 
        isDraggingVis = true; dragOffsetX = pos.x - visX; dragOffsetY = pos.y - visY; if (e.cancelable) e.preventDefault(); 
      }
    }

    function drag(e) {
      if (!isDraggingVis && !isDraggingSpk1 && !isDraggingSpk2) return;
      const pos = getMousePos(e);
      if (isDraggingSpk1) { spk1X = pos.x - dragOffsetX; spk1Y = pos.y - dragOffsetY; if (e.cancelable) e.preventDefault(); return; }
      if (isDraggingSpk2) { spk2X = pos.x - dragOffsetX; spk2Y = pos.y - dragOffsetY; if (e.cancelable) e.preventDefault(); return; }
      if (isDraggingVis) { visX = pos.x - dragOffsetX; visY = pos.y - dragOffsetY; if (e.cancelable) e.preventDefault(); }
    }

    function endDrag() { isDraggingVis = false; isDraggingSpk1 = false; isDraggingSpk2 = false; }
    canvas.addEventListener('mousedown', startDrag); canvas.addEventListener('mousemove', drag); window.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', startDrag, { passive: false }); canvas.addEventListener('touchmove', drag, { passive: false }); window.addEventListener('touchend', endDrag);

    let audioCtx, source, mediaStreamDestination, analyser, dataArray;
    let isAudioInit = false; let peakHeights = new Array(120).fill(0);

    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return "00:00";
      const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60);
      return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function initAudioContext() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.8;
      source = audioCtx.createMediaElementSource(audioPlayer); mediaStreamDestination = audioCtx.createMediaStreamDestination();
      source.connect(analyser); analyser.connect(audioCtx.destination); analyser.connect(mediaStreamDestination);
      dataArray = new Uint8Array(analyser.frequencyBinCount); isAudioInit = true;
    }

    let isBgReady = false; let bgImageElement = new Image();
    document.getElementById('bgInput').addEventListener('change', function(e) {
      if (this.files[0]) {
        const file = this.files[0];
        if (file.type.startsWith('image/')) {
          const fileURL = URL.createObjectURL(file); bgImageElement.src = fileURL;
          bgImageElement.onload = () => { isBgReady = true; statusBox.innerText = "✅ Foto Latar Oke."; };
        } else { alert("Harap unggah file berbentuk Gambar/Foto (JPG, PNG)."); }
      }
    });

    audioPlayer.addEventListener('loadedmetadata', () => { if (isFinite(audioPlayer.duration)) { durTimeEl.innerText = formatTime(audioPlayer.duration); progressBar.max = 100; } });
    audioPlayer.addEventListener('timeupdate', () => {
      if (isFinite(audioPlayer.duration) && durTimeEl.innerText === "00:00") durTimeEl.innerText = formatTime(audioPlayer.duration);
      if (!isDraggingProgress) { const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100; progressBar.value = isNaN(percent) ? 0 : percent; currTimeEl.innerText = formatTime(audioPlayer.currentTime); }
    });

    progressBar.addEventListener('input', () => {
      isDraggingProgress = true;
      if (audioPlayer.duration) { const seekTime = (progressBar.value / 100) * audioPlayer.duration; currTimeEl.innerText = formatTime(seekTime); audioPlayer.currentTime = seekTime; }
    });
    const releaseSeek = () => { isDraggingProgress = false; };
    progressBar.addEventListener('change', releaseSeek); progressBar.addEventListener('touchend', releaseSeek); progressBar.addEventListener('mouseup', releaseSeek);

    function togglePlay() {
      if (!isTrackLoaded) { alert("Pilih Musik Dulu!"); return; }
      if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
      if (audioPlayer.paused) {
        if (!audioPlayer.src || currentPlayIndex >= shuffledPlaylist.length) playRandomSong(true);
        else { audioPlayer.play(); playBtn.innerText = "⏸ PAUSE"; statusBox.innerText = `🎵 Lagu ${currentPlayIndex}/${audioFiles.length}: ${currentSongName}`; }
      } else { audioPlayer.pause(); playBtn.innerText = "▶ RESUME"; statusBox.innerText = "⏸ Musik Dijeda."; }
    }

    const config = { type: 'vintage', count: 100, visType: 'vintage_bars', visHeight: 150, visOpacity: 1.0, fxAngle: 0, fxSpeed: 1.0 };
    document.getElementById('visType').addEventListener('change', (e) => { config.visType = e.target.value; peakHeights.fill(0); });
    document.getElementById('visOpacity').addEventListener('input', (e) => config.visOpacity = parseFloat(e.target.value));
    document.getElementById('type').addEventListener('change', (e) => config.type = e.target.value);
    document.getElementById('fxAngle').addEventListener('change', (e) => config.fxAngle = parseInt(e.target.value));
    document.getElementById('fxSpeed').addEventListener('input', (e) => config.fxSpeed = parseFloat(e.target.value));
    document.getElementById('count').addEventListener('input', (e) => config.count = parseInt(e.target.value));
    document.getElementById('visHeight').addEventListener('input', (e) => config.visHeight = parseInt(e.target.value));
    document.getElementById('visWidth').addEventListener('input', (e) => { visW = parseInt(e.target.value); visX = (width - visW) / 2; });

    let time = 0;

    class RealisticFilmJitter {
      constructor() { this.reset(); }
      reset() {
        this.x = (Math.random() * width * 1.5) - (width * 0.25); this.y = (Math.random() * height * 1.5) - (height * 0.25);
        this.life = Math.random() * 5 + 2; this.alpha = Math.random() * 0.5 + 0.1;
        const rand = Math.random();
        if (rand < 0.05) { this.pType = 'scratch'; this.length = Math.random() * height / 2 + 100; this.color = Math.random() > 0.5 ? `rgba(255,255,255,${this.alpha*0.6})` : `rgba(0,0,0,${this.alpha*0.8})`; } 
        else if (rand < 0.15) { this.pType = 'hair'; this.cp1x = (Math.random() - 0.5) * 80; this.cp1y = (Math.random() - 0.5) * 80; this.cp2x = (Math.random() - 0.5) * 80; this.cp2y = (Math.random() - 0.5) * 80; this.endX = (Math.random() - 0.5) * 100; this.endY = (Math.random() - 0.5) * 100; this.color = `rgba(0, 0, 0, ${this.alpha * 1.2})`; } 
        else { this.pType = 'dust'; this.radius = Math.random() * 3 + 1.0; this.color = Math.random() > 0.6 ? `rgba(0,0,0,${this.alpha})` : `rgba(255,255,255,${this.alpha*0.6})`; }
      }
      update() { if (['none', 'rain', 'snow', 'fireflies'].includes(config.type)) return; this.life -= config.fxSpeed; if (this.life <= 0) this.reset(); }
      draw() {
        if (['none', 'rain', 'snow', 'fireflies'].includes(config.type)) return;
        let showDustHair = ['vintage', 'grain', 'sepia_dust', 'flicker_8mm'].includes(config.type);
        let showScratch = ['vintage', 'scratch', 'sepia_dust', 'flicker_8mm'].includes(config.type);
        if (config.type === 'old_tv' && this.pType !== 'dust') return;
        if (config.type === 'old_tv' && this.pType === 'dust') { this.radius = Math.random() * 1.5; this.color = `rgba(255,255,255,${this.alpha*0.3})`; }
        ctx.save(); ctx.translate(this.x, this.y); if (config.fxAngle !== 0) ctx.rotate(config.fxAngle * Math.PI / 180);
        if (this.pType === 'dust' && (showDustHair || config.type === 'old_tv')) { ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI*2); ctx.fill(); } 
        else if (this.pType === 'hair' && showDustHair) { ctx.strokeStyle = this.color; ctx.lineWidth = 1.5 + Math.random(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(this.cp1x, this.cp1y, this.cp2x, this.cp2y, this.endX, this.endY); ctx.stroke(); } 
        else if (this.pType === 'scratch' && showScratch) { ctx.strokeStyle = this.color; ctx.lineWidth = Math.random() * 2.0 + 1.0; ctx.beginPath(); ctx.moveTo(0, 0); let currentY = 0; let currentX = 0; for (let i = 0; i < this.length; i += 20) { currentY += 20; currentX += (Math.random() - 0.5) * 3; ctx.lineTo(currentX, currentY); } ctx.stroke(); }
        ctx.restore();
      }
    }

    class WeatherParticle {
      constructor() { this.reset(true); }
      reset(init = false) {
        this.x = Math.random() * width; this.y = init ? (Math.random() * height) : -20;
        this.speed = Math.random() * 2 + 1; this.size = Math.random() * 2 + 1; this.opacity = Math.random() * 0.5 + 0.3;
        this.angle = Math.random() * Math.PI * 2; this.wobble = Math.random() * 0.05;
        const layer = Math.random();
        if (layer < 0.5) { this.layer = 'back'; this.layerSpeed = 0.5; this.size *= 0.5; } else if (layer < 0.85) { this.layer = 'mid'; this.layerSpeed = 1.0; } else { this.layer = 'front'; this.layerSpeed = 1.8; this.size *= 1.5; }
      }
      update() {
        if (!['rain', 'snow', 'fireflies'].includes(config.type)) return;
        let windAngle = config.fxAngle * Math.PI / 180; let speedMult = config.fxSpeed * this.layerSpeed;
        if (config.type === 'rain') { this.y += this.speed * 10 * speedMult; this.x += Math.sin(windAngle) * (this.speed * 8); if (this.y > height) this.reset(); } 
        else if (config.type === 'snow') { this.y += this.speed * 1.5 * speedMult; this.angle += this.wobble * config.fxSpeed; this.x += Math.sin(this.angle) * 1.5 + Math.sin(windAngle) * 3; if (this.y > height) this.reset(); } 
        else if (config.type === 'fireflies') { this.y -= this.speed * 0.5 * speedMult; this.angle += this.wobble * config.fxSpeed; this.x += Math.cos(this.angle) * 2 + Math.sin(windAngle) * 1; this.opacity = Math.abs(Math.sin(time * 1.5 + this.x * 0.05)) * 0.8 + 0.2; if (this.y < -20) { this.reset(); this.y = height + 20; } }
        if (this.x > width + 50) this.x = -50; else if (this.x < -50) this.x = width + 50;
      }
      draw() {
        if (!['rain', 'snow', 'fireflies'].includes(config.type)) return;
        ctx.save();
        if (config.type === 'rain') { ctx.strokeStyle = `rgba(185, 222, 255, ${this.opacity * 0.6})`; ctx.lineWidth = this.layer === 'front' ? 3 : 1.5; ctx.beginPath(); ctx.moveTo(this.x, this.y); let windOffset = Math.sin(config.fxAngle * Math.PI / 180) * 15; ctx.lineTo(this.x - windOffset, this.y - this.speed * 10 * config.fxSpeed); ctx.stroke(); } 
        else if (config.type === 'snow') { ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.shadowBlur = this.layer === 'front' ? 8 : 0; ctx.shadowColor = '#fff'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); } 
        else if (config.type === 'fireflies') { ctx.fillStyle = `rgba(215, 255, 40, ${this.opacity})`; ctx.shadowBlur = this.size * 5; ctx.shadowColor = '#d7ff28'; ctx.beginPath(); ctx.arc(this.x, this.y, this.size * 1.2, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      }
    }

    let particles = []; let weatherParticles = [];
    for (let i = 0; i < 400; i++) { particles.push(new RealisticFilmJitter()); weatherParticles.push(new WeatherParticle()); }

    function getSymmetricVal(index, totalItems, bufferLen) {
      try {
        if (!dataArray) return 0;
        const center = totalItems / 2;
        const centerDist = Math.abs(index - center) / center;
        const dataIdx = Math.floor(centerDist * (bufferLen * 0.6));
        return dataArray[dataIdx] / 255;
      } catch (e) { return 0; }
    }

    // =========================================================
    // FITUR SPEAKER BERDENYUT (FRAME LUAR STATIS, MEMBRAN AKTIF)
    // =========================================================
    function drawSpeakers(bufferLen) {
      let style = document.getElementById('speakerStyle').value;
      if (style === 'none') return;
      
      let scale = parseFloat(document.getElementById('speakerSize').value);
      let opac = parseFloat(document.getElementById('speakerOpacity').value);
      
      let bass = 0;
      if(dataArray) { bass = (dataArray[1] + dataArray[2] + dataArray[3]) / (255 * 3); }
      if(isNaN(bass)) bass = 0;

      // UKURAN BINGKAI SPEAKER (STATIC / TIDAK MEMBESAR-MENGECIL)
      let frameR = 50 * scale; 
      // UKURAN DENYUT MEMBRAN DALAM (BERGETAR)
      let pulse = bass * 15 * scale; 

      function renderSpk(x, y) {
          ctx.save();
          ctx.translate(x, y);
          ctx.globalAlpha = opac;

          if (style === 'golden_cone') {
              ctx.beginPath(); ctx.arc(0,0, frameR, 0, Math.PI*2); 
              ctx.lineWidth = 8 * scale; ctx.strokeStyle = '#1a1a1a'; ctx.stroke();
              let coneR = Math.min(frameR * 0.95, frameR * 0.8 + pulse);
              let grad = ctx.createRadialGradient(0,0, coneR*0.1, 0,0, coneR);
              grad.addColorStop(0, '#3e2700'); grad.addColorStop(0.3, '#ffc107'); 
              grad.addColorStop(0.8, '#8b5a00'); grad.addColorStop(1, '#111');
              ctx.beginPath(); ctx.arc(0,0, coneR, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();
              ctx.beginPath(); ctx.arc(0,0, frameR*0.25 + pulse*0.5, 0, Math.PI*2); ctx.fillStyle = '#222'; ctx.fill();
          }
          else if (style === 'classic_black') {
              ctx.beginPath(); ctx.arc(0,0, frameR, 0, Math.PI*2); 
              ctx.lineWidth = 10 * scale; ctx.strokeStyle = '#222'; ctx.stroke();
              let coneR = Math.min(frameR * 0.95, frameR * 0.8 + pulse);
              let grad = ctx.createRadialGradient(0,0, coneR*0.1, 0,0, coneR);
              grad.addColorStop(0, '#444'); grad.addColorStop(0.8, '#111'); grad.addColorStop(1, '#050505');
              ctx.beginPath(); ctx.arc(0,0, coneR, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();
              ctx.beginPath(); ctx.arc(0,0, frameR*0.3 + pulse*0.5, 0, Math.PI*2); ctx.fillStyle = '#0a0a0a'; ctx.fill();
          }
          else if (style === 'white_monitor') {
              ctx.beginPath(); ctx.arc(0,0, frameR, 0, Math.PI*2); 
              ctx.lineWidth = 12 * scale; ctx.strokeStyle = '#111'; ctx.stroke();
              let coneR = Math.min(frameR * 0.95, frameR * 0.75 + pulse);
              let grad = ctx.createRadialGradient(0,0, coneR*0.5, 0,0, coneR);
              grad.addColorStop(0, '#fff'); grad.addColorStop(0.9, '#ddd'); grad.addColorStop(1, '#999');
              ctx.beginPath(); ctx.arc(0,0, coneR, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();
              ctx.beginPath(); ctx.arc(0,0, frameR*0.2 + pulse*0.5, 0, Math.PI*2); ctx.fillStyle = '#111'; ctx.fill();
          }
          else if (style === 'silver_alum') {
              ctx.beginPath(); ctx.arc(0,0, frameR, 0, Math.PI*2); 
              ctx.lineWidth = 6 * scale; ctx.strokeStyle = '#333'; ctx.stroke();
              let coneR = Math.min(frameR * 0.95, frameR * 0.85 + pulse);
              let grad = ctx.createConicGradient ? ctx.createConicGradient(time, 0, 0) : ctx.createRadialGradient(0,0,0,0,0,coneR);
              if(ctx.createConicGradient) { grad.addColorStop(0, '#ddd'); grad.addColorStop(0.25, '#fff'); grad.addColorStop(0.5, '#aaa'); grad.addColorStop(0.75, '#fff'); grad.addColorStop(1, '#ddd'); }
              ctx.beginPath(); ctx.arc(0,0, coneR, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();
              ctx.beginPath(); ctx.arc(0,0, frameR*0.2 + pulse*0.6, 0, Math.PI*2); ctx.fillStyle = '#eee'; ctx.fill();
          }
          else if (style === 'red_kevlar') {
              ctx.beginPath(); ctx.arc(0,0, frameR, 0, Math.PI*2); 
              ctx.lineWidth = 8 * scale; ctx.strokeStyle = '#111'; ctx.stroke();
              let coneR = Math.min(frameR * 0.95, frameR * 0.85 + pulse);
              let grad = ctx.createRadialGradient(0,0, coneR*0.2, 0,0, coneR);
              grad.addColorStop(0, '#500'); grad.addColorStop(0.6, '#b00'); grad.addColorStop(1, '#200');
              ctx.beginPath(); ctx.arc(0,0, coneR, 0, Math.PI*2); ctx.fillStyle = grad; ctx.fill();
              ctx.beginPath(); for(let i=0; i<10; i++) { ctx.arc(0,0, coneR*(i/10), 0, Math.PI*2); } ctx.lineWidth=1; ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.stroke();
              ctx.beginPath(); ctx.arc(0,0, frameR*0.25 + pulse*0.5, 0, Math.PI*2); ctx.fillStyle = '#1a0000'; ctx.fill();
          }
          else if (style === 'neon_ring') {
              ctx.beginPath(); ctx.arc(0,0, frameR, 0, Math.PI*2); 
              ctx.lineWidth = 4 * scale + pulse*0.5; ctx.strokeStyle = '#00e5ff'; 
              ctx.shadowBlur = 20 + pulse; ctx.shadowColor = '#00e5ff'; ctx.stroke(); ctx.shadowBlur = 0;
              ctx.beginPath(); ctx.arc(0,0, frameR*0.5 + pulse, 0, Math.PI*2);
              ctx.lineWidth = 2 * scale; ctx.strokeStyle = `rgba(0,229,255,${0.5+bass})`; ctx.stroke();
          }
          else if (style === 'hollow_pulse') {
              ctx.beginPath(); ctx.arc(0,0, frameR, 0, Math.PI*2); ctx.lineWidth = 2 * scale; ctx.strokeStyle = '#fff'; ctx.stroke();
              ctx.beginPath(); ctx.arc(0,0, frameR*0.7 + pulse*0.5, 0, Math.PI*2); ctx.lineWidth = 1 * scale; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();
              ctx.beginPath(); ctx.arc(0,0, frameR*0.3 + pulse, 0, Math.PI*2); ctx.fillStyle = `rgba(255,255,255,${0.2 + bass*0.5})`; ctx.fill();
          }
          else if (style === 'glass_dome') {
              ctx.beginPath(); ctx.arc(0,0, frameR, 0, Math.PI*2); ctx.lineWidth = 3 * scale; ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.stroke();
              let coneR = Math.min(frameR * 0.95, frameR * 0.8 + pulse);
              ctx.beginPath(); ctx.arc(0,0, coneR, 0, Math.PI*2); ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fill();
              ctx.beginPath(); ctx.ellipse(-coneR*0.3, -coneR*0.3, coneR*0.4, coneR*0.15, Math.PI/4, 0, Math.PI*2); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
              ctx.beginPath(); ctx.arc(0,0, frameR*0.2 + pulse*0.5, 0, Math.PI*2); ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
          }
          else if (style === 'dj_strobe') {
              let colors = ['#f00', '#0f0', '#00f', '#0ff', '#f0f', '#ff0'];
              let c = colors[Math.floor(time * 5) % colors.length];
              ctx.beginPath(); ctx.arc(0,0, frameR, 0, Math.PI*2); ctx.lineWidth = 10 * scale; ctx.strokeStyle = c; ctx.shadowBlur = 15; ctx.shadowColor = c; ctx.stroke();
              ctx.beginPath(); ctx.arc(0,0, frameR*0.4 + pulse, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowBlur = 0;
          }
          else if (style === 'shatter_bass') {
              ctx.beginPath(); ctx.arc(0,0, frameR, 0, Math.PI*2); ctx.lineWidth = 3 * scale; ctx.strokeStyle = '#fff'; ctx.stroke();
              let spikes = 30;
              for(let i=0; i<spikes; i++) {
                  let a = (i * Math.PI * 2) / spikes;
                  let spikeLen = frameR + (bass * 40 * scale * Math.random());
                  ctx.beginPath(); ctx.moveTo(Math.cos(a)*frameR, Math.sin(a)*frameR); ctx.lineTo(Math.cos(a)*spikeLen, Math.sin(a)*spikeLen);
                  ctx.lineWidth = 2 * scale; ctx.strokeStyle = `rgba(255,255,255,${0.3 + bass})`; ctx.stroke();
              }
          }

          ctx.restore();
      }

      renderSpk(spk1X, spk1Y);
      renderSpk(spk2X, spk2Y);
    }

    // ===============================================
    // 50 NORMAL, STANDARD & CLEAN VISUALIZERS
    // ===============================================
    function drawVisualizer(bufferLen) {
      const style = config.visType;
      ctx.save(); ctx.translate(visX, visY); ctx.globalAlpha = config.visOpacity; const cy = 0;
      
      try {
        // --- GROUP 1: SOLID & CLASSIC BARS (1-10) ---
        if (style === 'vintage_bars') {
          let numBars = 48; let spacing = visW / numBars; let barW = spacing * 0.7; ctx.fillStyle = 'rgba(245, 245, 240, 0.9)'; 
          for (let i = 0; i < numBars; i++) { let h = Math.max(5, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); ctx.fillRect(i * spacing, -h, barW, h); }
        }
        else if (style === 'winamp_classic') {
          let numBars = 48; let spacing = visW / numBars; let barW = spacing * 0.7;
          for (let i = 0; i < numBars; i++) {
            let h = Math.max(0, getSymmetricVal(i, numBars, bufferLen) * config.visHeight);
            if (h >= peakHeights[i]) peakHeights[i] = h; else { peakHeights[i] -= 2.0; if (peakHeights[i] < 0) peakHeights[i] = 0; }
            ctx.fillStyle = 'rgba(230, 235, 240, 0.7)'; ctx.fillRect(i * spacing, -h, barW, h); ctx.fillStyle = 'rgba(255, 60, 60, 1)'; ctx.fillRect(i * spacing, -peakHeights[i] - 5, barW, 4);
          }
        }
        else if (style === 'classic_eq') {
          let numBars = 40; let spacing = visW / numBars; let barW = spacing * 0.7;
          for (let i = 0; i < numBars; i++) {
            let h = Math.max(4, getSymmetricVal(i, numBars, bufferLen) * config.visHeight);
            let grad = ctx.createLinearGradient(0, cy, 0, cy - config.visHeight); grad.addColorStop(0, '#00e676'); grad.addColorStop(0.6, '#ffeb3b'); grad.addColorStop(1, '#ff3d00');
            ctx.fillStyle = grad; ctx.fillRect(i * spacing, -h, barW, h);
          }
        }
        else if (style === 'step_eq') {
          let numBars = 32; let spacing = visW / numBars; let barW = spacing - 4; let stepH = 12;
          for (let i = 0; i < numBars; i++) {
            let h = Math.max(0, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); let blocks = Math.floor(h / stepH);
            for (let j = 0; j < blocks; j++) { ctx.fillStyle = j > (config.visHeight/stepH)*0.7 ? '#ff5722' : '#ffc107'; ctx.fillRect(i * spacing, -(j * stepH) - stepH, barW, stepH - 2); }
          }
        }
        else if (style === 'thin_eq') {
          let numBars = 64; let spacing = visW / numBars; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          for (let i = 0; i < numBars; i++) { let h = Math.max(2, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); ctx.fillRect(i * spacing, -h, 2, h); }
        }
        else if (style === 'thick_bars') {
          let numBars = 24; let spacing = visW / numBars; let barW = spacing * 0.85; ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          for (let i = 0; i < numBars; i++) { let h = Math.max(8, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); ctx.fillRect(i * spacing, -h, barW, h); }
        }
        else if (style === 'hollow_bars') {
          let numBars = 40; let spacing = visW / numBars; let barW = spacing * 0.7; ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.lineWidth = 1.5;
          for (let i = 0; i < numBars; i++) { let h = Math.max(5, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); ctx.strokeRect(i * spacing, -h, barW, h); }
        }
        else if (style === 'rounded_bars') {
          let numBars = 36; let spacing = visW / numBars; let barW = spacing * 0.65; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
          for (let i = 0; i < numBars; i++) {
            let h = Math.max(8, getSymmetricVal(i, numBars, bufferLen) * config.visHeight);
            ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(i * spacing, -h, barW, h, [barW/2, barW/2, 0, 0]); else ctx.rect(i * spacing, -h, barW, h); ctx.fill();
          }
        }
        else if (style === 'split_eq') {
          let numBars = 48; let spacing = visW / numBars; let barW = spacing * 0.6; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; ctx.fillRect(0, -1, visW, 2); 
          for (let i = 0; i < numBars; i++) { let h = Math.max(2, getSymmetricVal(i, numBars, bufferLen) * (config.visHeight / 2)); ctx.fillRect(i * spacing, -h - 4, barW, h); ctx.fillRect(i * spacing, 4, barW, h); }
        }
        else if (style === 'double_mirror') {
          let numBars = 40; let spacing = visW / numBars; let barW = spacing * 0.7; ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          for (let i = 0; i < numBars; i++) { let h = Math.max(3, getSymmetricVal(i, numBars, bufferLen) * (config.visHeight / 2)); ctx.fillRect(i * spacing, -h, barW, h); ctx.fillRect(i * spacing, 0, barW, h); }
        }

        // --- GROUP 2: PEAKS, DOTS & VU METERS (11-20) ---
        else if (style === 'dotted_eq') {
          let numBars = 48; let spacing = visW / numBars; ctx.fillStyle = 'rgba(200, 200, 200, 0.5)'; ctx.fillRect(0, 0, visW, 2); ctx.fillStyle = '#00bcd4'; 
          for (let i = 0; i < numBars; i++) { let h = getSymmetricVal(i, numBars, bufferLen) * config.visHeight; let x = i * spacing + (spacing / 2); if (h > 5) { ctx.beginPath(); ctx.arc(x, -h, 4, 0, Math.PI*2); ctx.fill(); } }
        }
        else if (style === 'led_matrix') {
          let cols = 40; let rows = 15; let spaceX = visW / cols; let spaceY = config.visHeight / rows;
          for(let c=0; c<cols; c++) {
            let val = getSymmetricVal(c, cols, bufferLen); let activeRows = Math.floor(val * rows);
            for(let r=0; r<rows; r++) { let x = c * spaceX + spaceX/2; let y = -r * spaceY - spaceY/2; ctx.beginPath(); if(r < activeRows) ctx.fillStyle = (r > rows*0.7) ? '#f44336' : '#8bc34a'; else ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.arc(x, y, spaceX*0.35, 0, Math.PI*2); ctx.fill(); }
          }
        }
        else if (style === 'analog_vu') {
          let valBass = dataArray ? dataArray[Math.floor(bufferLen * 0.05)] / 255 : 0; let valTreble = dataArray ? dataArray[Math.floor(bufferLen * 0.3)] / 255 : 0; let cx = visW/2;
          function drawNeedle(x, r, val, title) {
              ctx.save(); ctx.translate(x, 0); ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, Math.PI*2); ctx.fillStyle = 'rgba(20, 20, 20, 0.8)'; ctx.fill(); ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 2; ctx.stroke();
              for(let i=0; i<=10; i++) { let a = Math.PI + (i/10)*Math.PI; let r1 = r - 10; let r2 = r - (i%5===0 ? 20 : 15); ctx.beginPath(); ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1); ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2); ctx.strokeStyle = i>7 ? '#ff4444' : '#ffb300'; ctx.stroke(); }
              ctx.rotate(Math.PI + (val * 0.8 + 0.1) * Math.PI); ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -r+25); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
              ctx.fillStyle = '#ffb300'; ctx.font = 'bold 16px monospace'; ctx.textAlign = 'center'; ctx.fillText(title, x, 25);
          }
          drawNeedle(cx - visW/4, config.visHeight*0.8, valBass, "L - BASS"); drawNeedle(cx + visW/4, config.visHeight*0.8, valTreble, "R - TREBLE");
        }
        else if (style === 'retro_oscilloscope') {

        if (!audioPlayer.paused) analyser.getByteFrequencyData(dataArray); else for (let i = 0; i < dataArray.length; i++) dataArray[i] = Math.max(0, dataArray[i] - 10);
        drawVisualizer(analyser.frequencyBinCount);
      }

      drawSpeakers(isAudioInit ? analyser.frequencyBinCount : 128);
      
      for (let i = 0; i < config.count; i++) { if (particles[i]) { particles[i].update(); particles[i].draw(); } if (weatherParticles[i]) { weatherParticles[i].update(); weatherParticles[i].draw(); } }

      if (config.type !== 'none') { const grad = ctx.createRadialGradient(width/2, height/2, height*0.4, width/2, height/2, width*0.8); grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.7)'); ctx.fillStyle = grad; ctx.fillRect(-10, -10, width+20, height+20); }

      ctx.restore(); requestAnimationFrame(animate);
    }
    animate();

    let mediaRecorder, chunks = []; let recordStartTime = 0;
    function startCountdownAndRecord() {
      if (!isAudioInit || !currentObjectUrl) { alert("Pilih dan siapkan musik dulu!"); return; }
      if (isCountingDown) { clearInterval(countdownTimer); isCountingDown = false; countdownOverlay.style.display = 'none'; recordBtn.innerText = "🔴 MULAI REKAM 720p"; return; }
      isCountingDown = true; let counter = 3; countdownOverlay.innerText = counter; countdownOverlay.style.display = 'block'; recordBtn.innerText = "❌ BATALKAN REKAM (" + counter + ")";
      countdownTimer = setInterval(() => { counter--; if (counter > 0) { countdownOverlay.innerText = counter; recordBtn.innerText = "❌ BATALKAN REKAM (" + counter + ")"; } else { clearInterval(countdownTimer); isCountingDown = false; countdownOverlay.style.display = 'none'; executeRecording(); } }, 1000);
    }

    function executeRecording() {
      if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) { window.Capacitor.Plugins.KeepAwake.keepAwake(); }
      audioPlayer.play(); playBtn.innerText = "⏸ PAUSE"; stopOverlay.style.display = 'block'; statusBox.innerText = "🔴 Merekam Video 720p..."; recordBtn.innerText = "🔴 SEDANG MEREKAM";
      const stream = canvas.captureStream(30); const combined = new MediaStream([...stream.getVideoTracks(), mediaStreamDestination.stream.getAudioTracks()[0]]);
      let options = { mimeType: 'video/webm;codecs=vp8,opus' }; if (!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/webm' }; }
      try { mediaRecorder = new MediaRecorder(combined, options); } catch (e) { mediaRecorder = new MediaRecorder(combined); }
      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); }; mediaRecorder.onstop = saveVideoWebM; chunks = []; recordStartTime = Date.now(); mediaRecorder.start();
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) window.Capacitor.Plugins.KeepAwake.allowSleep();
      audioPlayer.pause(); playBtn.innerText = "▶ PLAY"; stopOverlay.style.display = 'none'; recordBtn.innerText = "🔴 MULAI REKAM 720p"; statusBox.innerText = "Menyiapkan file video..."; if (playTimeout) clearTimeout(playTimeout);
    }

    function saveVideoWebM() {
      const blob = new Blob(chunks, { type: 'video/webm' }); const recordDuration = Date.now() - recordStartTime; statusBox.innerText = "⏳ Menjahit durasi (Biar bisa di-skip)...";
      if (typeof ysFixWebmDuration === 'function') { try { ysFixWebmDuration(blob, recordDuration, function(fixedBlob) { triggerDownload(fixedBlob); }, {logger: false}); } catch (error) { triggerDownload(blob); } } else { triggerDownload(blob); }
    }

    function triggerDownload(finalBlob) {
      statusBox.innerText = "⏳ Memproses pemotongan file video..."; const url = URL.createObjectURL(finalBlob);
      const oldVid = document.getElementById('previewVid'); if(oldVid) oldVid.remove(); const oldBtn = document.getElementById('shareBtnDewa'); if(oldBtn) oldBtn.remove();
      const vid = document.createElement('video'); vid.id = 'previewVid'; vid.src = url; vid.controls = true; vid.setAttribute('controlsList', 'nodownload'); vid.style.width = "100%"; vid.style.marginTop = "20px"; vid.style.border = "3px solid #00d2ff"; vid.style.borderRadius = "8px";
      const saveBtn = document.createElement('button'); saveBtn.id = 'shareBtnDewa'; saveBtn.innerText = "📥 SIMPAN VIDEO KE HP / PC"; saveBtn.style.width = "100%"; saveBtn.style.padding = "15px"; saveBtn.style.marginTop = "10px"; saveBtn.style.background = "linear-gradient(135deg, #00ffaa, #00bcd4)"; saveBtn.style.color = "black"; saveBtn.style.border = "none"; saveBtn.style.borderRadius = "8px"; saveBtn.style.fontWeight = "bold"; saveBtn.style.fontSize = "14px"; saveBtn.style.cursor = "pointer";
      let isSaving = false;
      saveBtn.onclick = async () => {
        if (isSaving) return; isSaving = true; saveBtn.innerText = "⏳ MEMULAI PROSES SIMPAN...";
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
            const FS = window.Capacitor.Plugins.Filesystem; const fileName = `BassJazz_720p_${Date.now()}.webm`; await FS.writeFile({ path: fileName, data: "", directory: 'DOCUMENTS' });
            const chunkSize = 1572864; const totalChunks = Math.ceil(finalBlob.size / chunkSize);
            for (let i = 0; i < totalChunks; i++) {
              const start = i * chunkSize; const end = Math.min(start + chunkSize, finalBlob.size); const chunk = finalBlob.slice(start, end);
              const base64Chunk = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(chunk); });
              await FS.appendFile({ path: fileName, data: base64Chunk, directory: 'DOCUMENTS' });
              const percent = Math.round(((i + 1) / totalChunks) * 100); statusBox.innerText = `⏳ Menulis ke memori HP... ${percent}%`; saveBtn.innerText = `⏳ MENYIMPAN... ${percent}%`;
            }
            saveBtn.innerText = "✅ TERSIMPAN DI DOCUMENTS HP!"; statusBox.innerText = `🎉 SUKSES! Video 720p tersimpan di folder Documents!`;
          } else {
            statusBox.innerText = "⏳ Mengunduh lewat Browser..."; const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `BassJazz_720p_${Date.now()}.webm`; document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); }, 100); saveBtn.innerText = "✅ VIDEO SUKSES DIUNDUH!"; statusBox.innerText = `🎉 SUKSES! Video berhasil diunduh ke perangkat Anda.`;
          }
        } catch(e) { saveBtn.innerText = "❌ GAGAL MENYIMPAN"; statusBox.innerText = "Terjadi Error: " + e.message; isSaving = false; }
      };
      const controlsDiv = document.getElementById('controls'); controlsDiv.appendChild(vid); controlsDiv.appendChild(saveBtn); saveBtn.scrollIntoView({ behavior: 'smooth' }); setTimeout(() => { if(!isSaving) saveBtn.click(); }, 1500);
    }
  </script>
