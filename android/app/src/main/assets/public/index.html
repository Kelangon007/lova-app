<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambient v.1 FHD Klasik</title>
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.5/fix-webm-duration.js"></script>
  <style>
    body { margin: 0; background-image: linear-gradient(45deg, #111 25%, transparent 25%), linear-gradient(-45deg, #111 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #111 75%), linear-gradient(-45deg, transparent 75%, #111 75%); background-size: 20px 20px; background-color: #222; font-family: 'Segoe UI', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; touch-action: pan-y; }
    #canvas-wrapper { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.15); background: #000; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9); cursor: grab; overflow: hidden; }
    #canvas-wrapper:active { cursor: grabbing; }
    canvas { width: 100%; height: 100%; display: block; }
    #controls { width: 90%; max-width: 600px; background: #191919; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); }
    .btn-group, .play-group { display: flex; gap: 8px; }
    .file-label { flex: 1; background: #252525; color: #aaa; padding: 12px 5px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; border: 1px solid #3c3c3c; transition: 0.2s; white-space: nowrap; }
    .file-label:hover { background: #333; color: white; }
    #playBtn { flex: 2; padding: 15px; background: #2a2a2a; color: #666; border: 1px solid #1a1a1a; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    #playBtn.ready { background: linear-gradient(135deg, #a8ff78, #78ffd6); color: #111; border: none; }
    #nextBtn { flex: 1; padding: 15px; background: #333; color: #777; border: 1px solid #222; border-radius: 8px; font-weight: bold; cursor: not-allowed; transition: 0.3s; }
    #nextBtn.ready { background: #252525; color: white; border: 1px solid #444; cursor: pointer; }
    .progress-container { display: flex; align-items: center; gap: 10px; background: #202020; padding: 8px; border-radius: 6px; border: 1px solid #2d2d2d; }
    .time-text { font-size: 11px; font-family: monospace; color: #a8ff78; min-width: 40px; text-align: center; }
    #progressBar { flex: 1; height: 5px; -webkit-appearance: none; background: #333; border-radius: 5px; cursor: pointer; }
    #progressBar::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; background: #78ffd6; border-radius: 50%; cursor: pointer; }
    .btn-record { width: 100%; padding: 15px; background: linear-gradient(135deg, #1b5e20, #0d47a1); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    #stopOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(13, 71, 161, 0.95); color: white; padding: 15px 30px; border-radius: 50px; z-index: 100; font-weight: bold; border: 3px solid white; cursor: pointer; }
    #countdownOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: bold; color: white; text-shadow: 0 0 20px rgba(0, 0, 0, 0.8); z-index: 100; }
    #statusBox { font-size: 12px; text-align: center; color: #a8ff78; margin-bottom: 5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; align-items: center; gap: 10px; }
    label { font-size: 11px; width: 80px; color: #ccc; font-weight: 600; }
    input[type="range"], select { flex: 1; height: 36px; background: #202020; color: white; border: 1px solid #3c3c3c; border-radius: 6px; }
    input[type="file"] { display: none; }
  </style>
</head>

<body>

  <div id="canvas-wrapper">
    <!-- RESOLUSI DI-SET DI 1080p FHD -->
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <div id="countdownOverlay">3</div>
    <div id="stopOverlay" onclick="stopRecording()">⏹ STOP & SIMPAN</div>
  </div>

  <div id="controls">
    <div id="statusBox">Siap Cetak Video Ambient v.1 FHD</div>
    <div class="btn-group">
      <label onclick="document.getElementById('bgInput').click()" class="file-label" style="border-bottom: 3px solid #a8ff78">1. FOTO LATAR</label>
      <label onclick="document.getElementById('audioInput').click()" class="file-label" style="border-bottom: 3px solid #78ffd6">2. MUSIK (BANYAK)</label>
    </div>

    <div class="play-group">
      <button id="playBtn" onclick="togglePlay()">⚠ PUTAR MUSIK</button>
      <button id="nextBtn" onclick="playRandomSong(false)">⏭ NEXT</button>
    </div>

    <div class="progress-container">
      <span id="currTime" class="time-text">00:00</span>
      <input type="range" id="progressBar" value="0" min="0" step="0.1">
      <span id="durTime" class="time-text">00:00</span>
    </div>

    <input type="file" id="bgInput" accept="image/*">
    <input type="file" id="audioInput" accept="audio/*" multiple>

    <hr style="border: 0; border-top: 1px solid #333; width: 100%; margin: 5px 0;">

    <div class="row">
      <label style="color:#a8ff78;">VISUALIZER</label>
      <select id="visType">
        <!-- 10 SPECTRUM BARU (NON-SYMMETRIC, DARI KIRI KE KANAN) -->
        <option value="winamp_classic">🎙️ Winamp Peaks (Kiri-Kanan)</option>
        <option value="retro_oscilloscope">📺 Oscilloscope (Klasik)</option>
        <option value="analog_meter">📻 Analog Meter (Kiri-Kanan)</option>
        <option value="peak_dots">〰️ Fading Dots Spectrum</option>
        <option value="digital_led">🚦 Digital LED (Common)</option>
        <option value="wireframe_bars">🧊 Wireframe Spectrum</option>
        <option value="classic_bars">🎙️ Classic EQ Blocks</option>
        <option value="split_bars">⏸️ Split Spectrum</option>
        <option value="step_blocks">🧱 Step Blocks Klasik</option>
        <option value="sonic_wave">🌊 Sonic Waveform (Vintage)</option>
      </select>
    </div>

    <div class="row"><label>TINGGI VIS.</label><input type="range" id="visHeight" min="30" max="600" value="180"></div>
    <div class="row"><label style="color:#a8ff78;">LEBAR VIS.</label><input type="range" id="visWidth" min="200" max="1800" value="500"></div>
    <div class="row"><label style="color:#ffb300;">OPASITAS VIS.</label><input type="range" id="visOpacity" min="0.1" max="1.0" step="0.05" value="1.0"></div>

    <hr style="border: 0; border-top: 1px dashed #333; width: 100%; margin: 5px 0;">

    <div class="row">
      <label style="color:#78ffd6;">EFEK CUACA</label>
      <select id="fxType">
        <option value="none">🚫 Tanpa Efek</option>
        <option value="realistic_rain">🌧️ Realistic Rain</option>
        <option value="soft_snow">❄️ Soft Snow</option>
        <option value="falling_leaves">🍁 Falling Leaves</option>
        <option value="forest_fireflies">✨ Forest Fireflies</option>
      </select>
    </div>
    
    <div class="row"><label>ARAH EFEK</label><select id="fxAngle"> <option value="0">Tegak Lurus</option> <option value="15">Miring Kanan 15°</option> <option value="-15">Miring Kiri 15°</option> </select></div>
    <div class="row"><label style="color:#ffb300;">KECEPATAN FX</label><input type="range" id="fxSpeed" min="0.1" max="5.0" step="0.1" value="1.0"></div>
    <div class="row"><label>KEPADATAN</label><input type="range" id="fxCount" min="10" max="800" step="10" value="150"></div>

    <button class="btn-record" id="recordBtn" onclick="startCountdownAndRecord()">🔴 MULAI REKAM AMBIENT 1080p</button>

  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    const statusBox = document.getElementById('statusBox');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d'); 
    
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const stopOverlay = document.getElementById('stopOverlay');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const recordBtn = document.getElementById('recordBtn');
    const progressBar = document.getElementById('progressBar');
    const currTimeEl = document.getElementById('currTime');
    const durTimeEl = document.getElementById('durTime');
    let isDraggingProgress = false;
    
    // RESOLUSI LOGIKA FHD
    const WIDTH = 1920;
    const HEIGHT = 1080;
    
    let audioFiles = []; let currentObjectUrl = null; let currentSongName = ""; let playTimeout = null;
    let isTrackLoaded = false; let shuffledPlaylist = []; let currentPlayIndex = 0; let isCountingDown = false; let countdownTimer = null;
    let peakHeights = new Array(60).fill(0);

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60);
      return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; }
      return array;
    }
    
    document.getElementById('audioInput').addEventListener('change', function(e) {
      if (this.files.length > 0) {
        audioFiles = Array.from(this.files); isTrackLoaded = true; shuffledPlaylist = shuffle(Array.from({ length: audioFiles.length }, (v, k) => k));
        currentPlayIndex = 0; playBtn.innerHTML = "▶ PLAY MUSIK"; playBtn.classList.add('ready'); nextBtn.classList.add('ready');
        statusBox.innerText = `${audioFiles.length} Musik dimuat. Siap diputar!`; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
        audioPlayer.pause(); if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; currentSongName = "Musik Diunggah";
      }
    });

    function playRandomSong(isInstant = false) {
      if (audioFiles.length === 0) return;
      if (playTimeout) clearTimeout(playTimeout);
      if (currentPlayIndex >= shuffledPlaylist.length) { currentPlayIndex = 0; stopEverything(); return; }
      if (currentObjectUrl && isInstant) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
      const delayAmount = isInstant ? 0 : 3500;
      if (!isInstant) {
        audioPlayer.pause(); playBtn.innerText = "⏳ TUNGGU..."; statusBox.innerText = "⏳ Jeda pergantian musik...";
        currentSongName = "Memuat..."; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
      }
      playTimeout = setTimeout(() => {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        const actualFileIndex = shuffledPlaylist[currentPlayIndex]; const selectedFile = audioFiles[actualFileIndex];
        currentSongName = selectedFile.name.replace(/\.[^/.]+$/, ""); currentObjectUrl = URL.createObjectURL(selectedFile);
        audioPlayer.src = currentObjectUrl; audioPlayer.load();
        if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
        audioPlayer.play().then(() => { playBtn.innerText = "⏸ PAUSE"; statusBox.innerText = `🎵 Musik ${currentPlayIndex + 1}/${audioFiles.length}: ${currentSongName}`; currentPlayIndex++; }).catch(err => { playBtn.innerText = "❌ ERROR"; });
      }, delayAmount);
    }
    
    audioPlayer.addEventListener('ended', () => { playRandomSong(false); });

    function stopEverything() {
      audioPlayer.pause(); if (playTimeout) clearTimeout(playTimeout);
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; currentSongName = "Playlist Selesai";
      if (dataArray) dataArray.fill(0); shuffledPlaylist = shuffle(Array.from({ length: audioFiles.length }, (v, k) => k));
      statusBox.innerText = `✅ Semua musik selesai diputar.`; playBtn.innerText = "▶ PLAY ACAK"; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        statusBox.innerText = `✅ Durasi habis! Memproses simpan otomatis...`; setTimeout(() => { stopRecording(); }, 500);
      }
    }
    
    // Posisi visualizer awal
    let visW = 500; let visX = (WIDTH - visW) / 2; let visY = HEIGHT - 200;
    let isDraggingVis = false; let dragOffsetX = 0; let dragOffsetY = 0;

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
      let clientX = e.clientX; let clientY = e.clientY;
      if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startDrag(e) {
      const pos = getMousePos(e);
      if (pos.x >= visX && pos.x <= visX + visW && pos.y >= visY - 150 && pos.y <= visY + 150) { isDraggingVis = true; dragOffsetX = pos.x - visX; dragOffsetY = pos.y - visY; if (e.cancelable) e.preventDefault(); }
    }
    function drag(e) {
      if (!isDraggingVis) return; const pos = getMousePos(e); visX = pos.x - dragOffsetX; visY = pos.y - dragOffsetY; if (e.cancelable) e.preventDefault();
    }
    function endDrag() { isDraggingVis = false; }
    
    canvas.addEventListener('mousedown', startDrag); canvas.addEventListener('mousemove', drag); window.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', startDrag, { passive: false }); canvas.addEventListener('touchmove', drag, { passive: false }); window.addEventListener('touchend', endDrag);
    
    let audioCtx, source, mediaStreamDestination, analyser, dataArray;
    let isAudioInit = false;

    function initAudioContext() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.8;
      source = audioCtx.createMediaElementSource(audioPlayer); mediaStreamDestination = audioCtx.createMediaStreamDestination();
      source.connect(analyser); analyser.connect(audioCtx.destination); analyser.connect(mediaStreamDestination);
      dataArray = new Uint8Array(analyser.frequencyBinCount); isAudioInit = true;
    }
    
    let isBgReady = false; let bgImageElement = new Image();
    document.getElementById('bgInput').addEventListener('change', function(e) {
      if (this.files[0]) {
        const file = this.files[0];
        if (file.type.startsWith('image/')) {
          const fileURL = URL.createObjectURL(file); bgImageElement.src = fileURL;
          bgImageElement.onload = () => { isBgReady = true; statusBox.innerText = "✅ Background Oke."; };
        } else { alert("Harap unggah file berbentuk Gambar/Foto (JPG, PNG)."); }
      }
    });
    
    audioPlayer.addEventListener('loadedmetadata', () => { if (isFinite(audioPlayer.duration)) { durTimeEl.innerText = formatTime(audioPlayer.duration); progressBar.max = 100; } });
    audioPlayer.addEventListener('timeupdate', () => {
      if (isFinite(audioPlayer.duration) && durTimeEl.innerText === "00:00") { durTimeEl.innerText = formatTime(audioPlayer.duration); }
      if (!isDraggingProgress) { const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100; progressBar.value = isNaN(percent) ? 0 : percent; currTimeEl.innerText = formatTime(audioPlayer.currentTime); }
    });
    progressBar.addEventListener('input', () => {
      isDraggingProgress = true;
      if (audioPlayer.duration) { const seekTime = (progressBar.value / 100) * audioPlayer.duration; currTimeEl.innerText = formatTime(seekTime); audioPlayer.currentTime = seekTime; }
    });
    const releaseSeek = () => { isDraggingProgress = false; };
    progressBar.addEventListener('change', releaseSeek); progressBar.addEventListener('touchend', releaseSeek); progressBar.addEventListener('mouseup', releaseSeek);

    function togglePlay() {
      if (!isTrackLoaded) { alert("Pilih Musik Dulu!"); return; }
      if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
      if (audioPlayer.paused) {
        if (!audioPlayer.src || currentPlayIndex >= shuffledPlaylist.length) { playRandomSong(true); } 
        else { audioPlayer.play(); playBtn.innerText = "⏸ PAUSE"; statusBox.innerText = `🎵 Musik ${currentPlayIndex}/${audioFiles.length}: ${currentSongName}`; }
      } else { audioPlayer.pause(); playBtn.innerText = "▶ RESUME"; statusBox.innerText = "⏸ Musik Dijeda."; }
    }
    
    const config = { visType: 'winamp_classic', visHeight: 180, visOpacity: 1.0, fxType: 'none', fxSpeed: 1.0, fxAngle: 0, fxCount: 150 };
    document.getElementById('visType').addEventListener('change', (e) => {config.visType = e.target.value; peakHeights.fill(0);});
    document.getElementById('visHeight').addEventListener('input', (e) => config.visHeight = parseInt(e.target.value));
    document.getElementById('visOpacity').addEventListener('input', (e) => config.visOpacity = parseFloat(e.target.value));
    document.getElementById('visWidth').addEventListener('input', (e) => { visW = parseInt(e.target.value); visX = (WIDTH - visW) / 2; });
    document.getElementById('fxType').addEventListener('change', (e) => config.fxType = e.target.value);
    document.getElementById('fxSpeed').addEventListener('input', (e) => config.fxSpeed = parseFloat(e.target.value));
    document.getElementById('fxAngle').addEventListener('change', (e) => config.fxAngle = parseInt(e.target.value));
    document.getElementById('fxCount').addEventListener('input', (e) => config.fxCount = parseInt(e.target.value));

    let time = 0;

    class WeatherParticle {
      constructor() { this.reset(true); }
      reset(init = false) {
        this.x = Math.random() * WIDTH;
        this.y = init ? (Math.random() * HEIGHT) : -20;
        this.speed = Math.random() * 2 + 1;
        this.size = Math.random() * 2 + 1;
        this.opacity = Math.random() * 0.5 + 0.3;
        this.angle = Math.random() * Math.PI * 2;
        this.wobble = Math.random() * 0.05;
        
        const layer = Math.random();
        if (layer < 0.5) { this.layer = 'back'; this.layerSpeed = 0.5; this.size *= 0.5; }
        else if (layer < 0.85) { this.layer = 'mid'; this.layerSpeed = 1.0; }
        else { this.layer = 'front'; this.layerSpeed = 1.8; this.size *= 1.5; }

        const leafColors = ['#d35400', '#e67e22', '#f39c12', '#bdc542'];
        this.leafColor = leafColors[Math.floor(Math.random() * leafColors.length)];
      }
      update() {
        if (config.fxType === 'none') return;
        let windAngle = config.fxAngle * Math.PI / 180;
        let speedMult = config.fxSpeed * this.layerSpeed;

        if (config.fxType === 'realistic_rain') {
          this.y += this.speed * 10 * speedMult;
          this.x += Math.sin(windAngle) * (this.speed * 8);
          if (this.y > HEIGHT) this.reset();
        } else if (config.fxType === 'soft_snow') {
          this.y += this.speed * 1.5 * speedMult;
          this.angle += this.wobble * config.fxSpeed;
          this.x += Math.sin(this.angle) * 1.5 + Math.sin(windAngle) * 3;
          if (this.y > HEIGHT) this.reset();
        } else if (config.fxType === 'falling_leaves') {
          this.y += this.speed * 2 * speedMult;
          this.angle += (Math.random() - 0.5) * 0.1 * config.fxSpeed;
          this.x += Math.sin(this.angle) * 2.5 + Math.sin(windAngle) * 4;
          if (this.y > HEIGHT) this.reset();
        } else if (config.fxType === 'forest_fireflies') {
          this.y -= this.speed * 0.5 * speedMult;
          this.angle += this.wobble * config.fxSpeed;
          this.x += Math.cos(this.angle) * 2 + Math.sin(windAngle) * 1;
          this.opacity = Math.abs(Math.sin(time * 1.5 + this.x * 0.05)) * 0.8 + 0.2;
          if (this.y < -20) { this.reset(); this.y = HEIGHT + 20; }
        }
        if (this.x > WIDTH + 50) this.x = -50;
        else if (this.x < -50) this.x = WIDTH + 50;
      }
      draw() {
        if (config.fxType === 'none') return;
        ctx.save();
        if (config.fxType === 'realistic_rain') {
          ctx.strokeStyle = `rgba(185, 222, 255, ${this.opacity * 0.6})`;
          ctx.lineWidth = this.layer === 'front' ? 3 : 1.5;
          ctx.beginPath();
          ctx.moveTo(this.x, this.y);
          // Mengikuti arah FX Angle
          let windOffset = Math.sin(config.fxAngle * Math.PI / 180) * 15;
          ctx.lineTo(this.x - windOffset, this.y - this.speed * 10 * config.fxSpeed);
          ctx.stroke();
        } else if (config.fxType === 'soft_snow') {
          ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
          ctx.shadowBlur = this.layer === 'front' ? 8 : 0;
          ctx.shadowColor = '#fff';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        } else if (config.fxType === 'falling_leaves') {
          ctx.translate(this.x, this.y);
          ctx.rotate(this.angle);
          let twistVol = Math.abs(Math.sin(this.angle * 2));
          ctx.fillStyle = this.leafColor;
          ctx.globalAlpha = this.opacity;
          ctx.beginPath();
          ctx.ellipse(0, 0, this.size * 4, this.size * (1 + twistVol * 1.5), 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = 'rgba(0,0,0,0.3)';
          ctx.lineWidth = 1; ctx.stroke();
        } else if (config.fxType === 'forest_fireflies') {
          ctx.fillStyle = `rgba(215, 255, 40, ${this.opacity})`;
          ctx.shadowBlur = this.size * 5;
          ctx.shadowColor = '#d7ff28';
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size * 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }
    }

    let particles = [];
    for (let i = 0; i < 800; i++) { particles.push(new WeatherParticle()); }

    // MAPPING DATA AUDIO KLASIK (LINIER DARI KIRI KE KANAN)
    function getClassicVal(index, totalItems, bufferLen) {
      try {
        if (!dataArray) return 0;
        const dataIdx = Math.floor((index / totalItems) * (bufferLen * 0.8)); // Ambil 80% frekuensi awal
        return dataArray[dataIdx] / 255;
      } catch (e) { return 0; }
    }

    // ===============================================
    // 10 SPECTRUM KLASIK (KIRI KE KANAN, NON-SYMMETRIC)
    // ===============================================
    function drawVisualizer(bufferLen) {
      const style = config.visType;
      ctx.save();
      ctx.translate(visX, visY);
      ctx.globalAlpha = config.visOpacity;
      const cx = visW / 2;
      const cy = 0;

      try {
        // 1. Winamp Peaks Klasik (Kiri-Kanan)
        if (style === 'winamp_classic') {
          let numBars = 64; let spacing = visW / numBars;
          ctx.lineWidth = 2; ctx.lineCap = 'butt';
          for(let i=0; i<numBars; i++) {
            let val = getClassicVal(i, numBars, bufferLen) * config.visHeight;
            if(val >= peakHeights[i]) peakHeights[i] = val; else peakHeights[i] = Math.max(0, peakHeights[i] - (config.visHeight * 0.01));
            
            let grad = ctx.createLinearGradient(0, cy, 0, cy - config.visHeight);
            grad.addColorStop(0, '#78ffd6'); grad.addColorStop(1, '#a8ff78');
            
            // Batang Utama
            ctx.fillStyle = grad;
            ctx.fillRect(i*spacing, cy - val, spacing * 0.8, val);
            // Peak Dot
            ctx.fillStyle = '#fff'; ctx.shadowBlur = 5; ctx.shadowColor = '#fff';
            ctx.fillRect(i*spacing, cy - peakHeights[i] - 5, spacing * 0.8, 3);
            ctx.shadowBlur = 0;
          }
        } 
        
        // 2. Retro Oscilloscope Line (Common)
        else if (style === 'retro_oscilloscope') {
          ctx.beginPath(); ctx.moveTo(0, cy - config.visHeight/2);
          let numPoints = 120; let spacing = visW / numPoints;
          for(let i=0; i<=numPoints; i++) {
            let val = getClassicVal(i, numPoints, bufferLen) * config.visHeight;
            // Waveform style
            let y = cy - (config.visHeight/2) + (Math.sin(i*0.2 + time*5) * val * 0.8);
            ctx.lineTo(i*spacing, y);
          }
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
          ctx.shadowBlur = 15; ctx.shadowColor = '#fff'; ctx.stroke();
          ctx.strokeStyle = '#78ffd6'; ctx.lineWidth = 1; ctx.stroke();
          ctx.shadowBlur = 0;
        }
        
        // 3. Analog Meter Style (L-R)
        else if (style === 'analog_meter') {
          let valBass = getClassicVal(visW*0.1, visW, bufferLen);
          let valTreble = getClassicVal(visW*0.8, visW, bufferLen);
          
          function drawNeedle(x, y, r, val, title) {
              ctx.save(); ctx.translate(x, y);
              // BG Meter
              ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, Math.PI*2);
              ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2; ctx.stroke();
              // Skala
              for(let i=0; i<=10; i++) {
                  let a = Math.PI + (i/10)*Math.PI;
                  let r1 = r - 5; let r2 = r - (i%5===0 ? 15 : 10);
                  ctx.beginPath(); ctx.moveTo(Math.cos(a)*r1, Math.sin(a)*r1); ctx.lineTo(Math.cos(a)*r2, Math.sin(a)*r2);
                  ctx.strokeStyle = i>7 ? '#ff4444' : '#fff'; ctx.stroke();
              }
              // Needle
              ctx.rotate(Math.PI + val * Math.PI);
              ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -r+20);
              ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 3; ctx.stroke();
              ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fillStyle='#ff4444'; ctx.fill();
              // Text
              ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(title, 0, 30);
              ctx.restore();
          }
          drawNeedle(cx - visW/4, cy, config.visHeight*0.8, valBass, "BASS");
          drawNeedle(cx + visW/4, cy, config.visHeight*0.8, valTreble, "TREBLE");
        }

        // 4. Fading Dots Spectrum (Common)
        else if (style === 'peak_dots') {
          let numDots = 40; let spacing = visW / numDots;
          for(let i=0; i<numDots; i++) {
            let val = getClassicVal(i, numDots, bufferLen);
            let h = val * config.visHeight;
            if(h >= peakHeights[i]) peakHeights[i] = h; else peakHeights[i] = Math.max(0, peakHeights[i] - (config.visHeight * 0.02));
            
            // Batang Titik
            ctx.beginPath(); ctx.arc(i*spacing + spacing/2, cy - h/2, spacing*0.3 + h*0.05, 0, Math.PI*2);
            ctx.fillStyle = `rgba(168, 255, 120, ${0.4 + val})`; ctx.fill();
            // Peak Dot
            ctx.beginPath(); ctx.arc(i*spacing + spacing/2, cy - peakHeights[i] - 10, spacing*0.3, 0, Math.PI*2);
            ctx.fillStyle = `rgba(255, 255, 255, ${0.6 + val})`; ctx.fill();
          }
        }

        // 5. Digital LED Spectrum (Klasik Kiri-Kanan)
        else if (style === 'digital_led') {
          let numBars = 32; let segments = 12; let spacing = visW / numBars;
          let segH = config.visHeight / (segments * 1.3);
          for(let i=0; i<numBars; i++) {
            let val = getClassicVal(i, numBars, bufferLen);
            let activeSegs = Math.floor(val * segments);
            for(let s=0; s<segments; s++) {
                if (s < activeSegs) {
                    if (s > segments*0.8) ctx.fillStyle = '#ff4444';
                    else if (s > segments*0.5) ctx.fillStyle = '#ffeb3b';
                    else ctx.fillStyle = '#00e676';
                } else { ctx.fillStyle = 'rgba(255,255,255,0.08)'; }
                ctx.fillRect(i*spacing, cy - (s*segH*1.3) - segH, spacing*0.7, segH);
            }
          }
        }

        // 6. Wireframe Blocks Spectrum
        else if (style === 'wireframe_bars') {
          let numBars = 36; let spacing = visW / numBars;
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
          for(let i=0; i<numBars; i++) {
             let val = Math.max(10, getClassicVal(i, numBars, bufferLen) * config.visHeight);
             ctx.strokeRect(i*spacing, cy - val, spacing*0.7, val);
          }
        }

        // 7. Classic EQ Blocks (Kiri-Kanan)
        else if (style === 'classic_bars') {
          let numBars = 48; let spacing = visW / numBars;
          let grad = ctx.createLinearGradient(0, cy, 0, cy - config.visHeight);
          grad.addColorStop(0, '#78ffd6'); grad.addColorStop(1, '#a8ff78');
          ctx.fillStyle = grad;
          for(let i=0; i<numBars; i++) {
             let val = Math.max(5, getClassicVal(i, numBars, bufferLen) * config.visHeight);
             ctx.fillRect(i*spacing, cy - val, spacing*0.8, val);
          }
        }

        // 8. Split Spectrum (Bass Kiri, Treble Kanan)
        else if (style === 'split_bars') {
          let half = visW / 2;
          let gradL = ctx.createLinearGradient(0, cy, 0, cy - config.visHeight); gradL.addColorStop(0, '#00d2ff'); gradL.addColorStop(1, '#e040fb');
          let gradR = ctx.createLinearGradient(0, cy, 0, cy - config.visHeight); gradR.addColorStop(0, '#e040fb'); gradR.addColorStop(1, '#78ffd6');
          
          // Kiri (Bass)
          ctx.fillStyle = gradL;
          for(let i=0; i<half; i+=10) {
              let val = getClassicVal(i, visW, bufferLen) * config.visHeight;
              ctx.fillRect(i, cy - val/2 - 20, 8, val);
          }
          // Kanan (Treble)
          ctx.fillStyle = gradR;
          for(let i=0; i<half; i+=10) {
              let val = getClassicVal(half + i, visW, bufferLen) * config.visHeight;
              ctx.fillRect(half + i, cy - val/2 - 20, 8, val);
          }
        }

        // 9. Step Blocks Spectrum (Common Retro)
        else if (style === 'step_blocks') {
          let numBars = 24; let steps = 8; let spacing = visW / numBars;
          let stepH = config.visHeight / steps;
          ctx.fillStyle = '#fff'; ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(255,255,255,0.5)';
          for(let i=0; i<numBars; i++) {
              let val = getClassicVal(i, numBars, bufferLen);
              let activeSteps = Math.floor(val * steps);
              for(let s=0; s<activeSteps; s++) {
                  ctx.fillRect(i*spacing, cy - (s*stepH*1.2) - stepH, spacing*0.8, stepH*0.9);
              }
          }
          ctx.shadowBlur = 0;
        }

        // 10. Sonic Waveform (Vintage Oscilloscope)
        else if (style === 'sonic_wave') {
          ctx.beginPath(); ctx.moveTo(0, cy);
          let numPoints = 180; let spacing = visW / numPoints;
          for(let i=0; i<=numPoints; i++) {
              let val = getClassicVal(i, numPoints, bufferLen) * config.visHeight;
              let y = cy - (val/2) - (Math.sin(i*0.1 + time*3)*val*0.2);
              ctx.lineTo(i*spacing, y);
          }
          for(let i=numPoints; i>=0; i--) {
              let val = getClassicVal(i, numPoints, bufferLen) * config.visHeight;
              let y = cy + (val/2) + (Math.sin(i*0.1 + time*3)*val*0.2);
              ctx.lineTo(i*spacing, y);
          }
          ctx.closePath();
          let grad = ctx.createLinearGradient(0, cy - config.visHeight/2, 0, cy + config.visHeight/2); grad.addColorStop(0, '#a8ff78'); grad.addColorStop(1, '#78ffd6');
          ctx.fillStyle = grad; ctx.fill();
        }

      } catch (e) {}
      ctx.restore();
    }

    function animate() {
      // BG Murni Hitam FHD
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
      
      if (isAudioInit && !audioPlayer.paused) { time += 0.02; }
      
      if (isBgReady) {
        const scale = Math.max(WIDTH / bgImageElement.width, HEIGHT / bgImageElement.height);
        const x = (WIDTH / 2) - (bgImageElement.width / 2) * scale; const y = (HEIGHT / 2) - (bgImageElement.height / 2) * scale;
        ctx.drawImage(bgImageElement, x, y, bgImageElement.width * scale, bgImageElement.height * scale);
      }
      
      for (let i = 0; i < config.fxCount; i++) { if (particles[i]) { particles[i].update(); particles[i].draw(); } }
      
      if (isAudioInit && !audioPlayer.paused && currentObjectUrl) { analyser.getByteFrequencyData(dataArray); } 
      else if (dataArray) { for (let i = 0; i < dataArray.length; i++) { dataArray[i] = Math.max(0, dataArray[i] - 5); } }
      
      drawVisualizer(isAudioInit ? analyser.frequencyBinCount : 128);
      requestAnimationFrame(animate);
    }
    animate();
    
    // ===============================================
    // LOGIKA RECORDING SINGLE-CHUNK (AUTO DURASI)
    // ===============================================
    let mediaRecorder, chunks = []; let recordStartTime = 0;

    function startCountdownAndRecord() {
      if (!isAudioInit || !currentObjectUrl) { alert("Pilih musik ambient alam bebas dulu bos!"); return; }
      if (isCountingDown) { clearInterval(countdownTimer); isCountingDown = false; countdownOverlay.style.display = 'none'; recordBtn.innerText = "🔴 MULAI REKAM AMBIENT 1080p"; return; }
      isCountingDown = true; let counter = 3; countdownOverlay.innerText = counter; countdownOverlay.style.display = 'block'; recordBtn.innerText = "❌ BATALKAN REKAM (" + counter + ")";
      countdownTimer = setInterval(() => {
        counter--; if (counter > 0) { countdownOverlay.innerText = counter; recordBtn.innerText = "❌ BATALKAN REKAM (" + counter + ")"; } 
        else { clearInterval(countdownTimer); isCountingDown = false; countdownOverlay.style.display = 'none'; executeRecording(); }
      }, 1000);
    }

    function executeRecording() {
      if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) { window.Capacitor.Plugins.KeepAwake.keepAwake(); }
      audioPlayer.play(); playBtn.innerText = "⏸ PAUSE"; stopOverlay.style.display = 'block'; statusBox.innerText = "🔴 Merekam Alam FHD..."; recordBtn.innerText = "🔴 SEDANG MEREKAM";
      
      const stream = canvas.captureStream(30); 
      const combined = new MediaStream([...stream.getVideoTracks(), mediaStreamDestination.stream.getAudioTracks()[0]]);
      
      // Paksa WebM VP8/Opus FHD
      let options = { mimeType: 'video/webm;codecs=vp8,opus' }; 
      if (!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/webm' }; }
      
      try { mediaRecorder = new MediaRecorder(combined, options); } catch (e) { mediaRecorder = new MediaRecorder(combined); }
      
      // MODE SINGLE-CHUNK (Tanpa timeslice di start())
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      
      mediaRecorder.onstop = saveVideoWebM;
      chunks = []; recordStartTime = Date.now();
      
      // MULAI REKAM TANPA CACAHAN AGAR yFixWebmDuration BEKERJA SEMPURNA
      mediaRecorder.start();
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.stop(); }
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) { window.Capacitor.Plugins.KeepAwake.allowSleep(); }
      audioPlayer.pause(); playBtn.innerText = "▶ PLAY"; stopOverlay.style.display = 'none'; recordBtn.innerText = "🔴 MULAI REKAM AMBIENT 1080p"; statusBox.innerText = "Menyiapkan file video...";
      if (playTimeout) clearTimeout(playTimeout);
    }

    function saveVideoWebM() {
      const blob = new Blob(chunks, { type: 'video/webm' }); const recordDuration = Date.now() - recordStartTime;
      statusBox.innerText = "⏳ Menjahit durasi otomatis (Biar bisa di-skip)...";
      
      // JAHIT DURASI MUTLAK DENGAN yFixWebmDuration
      if (typeof ysFixWebmDuration === 'function') {
        try {
          ysFixWebmDuration(blob, recordDuration, function(fixedBlob) { triggerDownload(fixedBlob); }, {logger: false});
        } catch (error) {
          console.error("Gagal menjahit durasi otomatis:", error); triggerDownload(blob);
        }
      } else {
        console.warn("Peringatan: Skrip yFixWebmDuration gagal dimuat. Durasi WebM mungkin tidak akan terbaca di HP jadul.");
        triggerDownload(blob);
      }
    }

    function triggerDownload(finalBlob) {
      statusBox.innerText = "⏳ Menyiapkan tombol simpan FHD...";
      const url = URL.createObjectURL(finalBlob);
      const oldVid = document.getElementById('previewVid'); if(oldVid) oldVid.remove();
      const oldBtn = document.getElementById('shareBtnDewa'); if(oldBtn) oldBtn.remove();
      
      // PREVIEW VIDEO
      const vid = document.createElement('video'); vid.id = 'previewVid'; vid.src = url; vid.controls = true;
      vid.setAttribute('controlsList', 'nodownload'); vid.style.width = "100%"; vid.style.marginTop = "20px"; vid.style.border = "3px solid #a8ff78"; vid.style.borderRadius = "8px";
      
      // TOMBOL SIMPAN KE DOWNLOAD HP
      const saveBtn = document.createElement('button'); saveBtn.id = 'shareBtnDewa'; saveBtn.innerText = "📥 SIMPAN VIDEO FHD KE HP";
      saveBtn.style.width = "100%"; saveBtn.style.padding = "15px"; saveBtn.style.marginTop = "10px";
      saveBtn.style.background = "linear-gradient(135deg, #a8ff78, #78ffd6)"; saveBtn.style.color = "#111"; saveBtn.style.border = "none"; saveBtn.style.borderRadius = "8px"; saveBtn.style.fontWeight = "bold"; saveBtn.style.fontSize = "14px"; saveBtn.style.cursor = "pointer";
      
      let isSaving = false;
      saveBtn.onclick = async () => {
        if (isSaving) return; isSaving = true; saveBtn.innerText = "⏳ MEMULAI PROSES SIMPAN (FHD)...";
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
            const FS = window.Capacitor.Plugins.Filesystem;
            try { let perm = await FS.checkPermissions(); if (perm.publicStorage !== 'granted') await FS.requestPermissions(); } catch(e) {}
            
            // Simpan ke folder DOWNLOAD HP (Dewa Save Android 9 aman)
            const fileName = `Download/Ambient_FHD_${Date.now()}.webm`;
            await FS.writeFile({ path: fileName, data: "", directory: 'EXTERNAL_STORAGE' });
            
            const chunkSize = 1572864; // 1.5MB per chunk base64
            const totalChunks = Math.ceil(finalBlob.size / chunkSize);
            
            for (let i = 0; i < totalChunks; i++) {
              const start = i * chunkSize; const end = Math.min(start + chunkSize, finalBlob.size); const chunk = finalBlob.slice(start, end);
              const base64Chunk = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(chunk); });
              await FS.appendFile({ path: fileName, data: base64Chunk, directory: 'EXTERNAL_STORAGE' });
              const percent = Math.round(((i + 1) / totalChunks) * 100); statusBox.innerText = `⏳ Memasukkan data FHD ke HP... ${percent}%`; saveBtn.innerText = `⏳ MENYIMPAN... ${percent}%`;
            }
            saveBtn.innerText = "✅ VIDEO SUKSES MASUK FOLDER DOWNLOAD!"; statusBox.innerText = `🎉 BERHASIL! Cek folder Download di HP agan (Format: Ambient_FHD_...webm).`;
          } else { throw new Error("Bukan Capacitor"); }
        } catch(e) { 
            statusBox.innerText = "⏳ Memori HP ditolak, pakai cara cadangan (Browser)...";
            try {
                const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `Ambient_FHD_${Date.now()}.webm`;
                document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); }, 100);
                saveBtn.innerText = "✅ VIDEO SUKSES DIUNDUH!"; statusBox.innerText = `🎉 SUKSES! Video FHD berhasil diunduh pakai metode aman browser.`;
            } catch(e2) {
                saveBtn.innerText = "❌ GAGAL MENYIMPAN"; statusBox.innerText = "Terjadi Error: " + e2.message; isSaving = false; 
            }
        }
      };
      
      const controlsDiv = document.getElementById('controls'); controlsDiv.appendChild(vid); controlsDiv.appendChild(saveBtn);
      saveBtn.scrollIntoView({ behavior: 'smooth' });
      setTimeout(() => { if(!isSaving) saveBtn.click(); }, 1500); // Trigger save otomatis
    }
  </script>
