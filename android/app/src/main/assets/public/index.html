<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test part 1 (No Circle Vis, Pure Bass)</title>
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.5/fix-webm-duration.js"></script>
  <style>
    body { margin: 0; background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%); background-size: 20px 20px; background-color: #333; font-family: 'Segoe UI', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; }
    #canvas-wrapper { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; margin-top: 20px; border: 1px solid rgba(255,255,255,0.3); background: transparent; box-shadow: 0 15px 50px rgba(0,0,0,0.8); cursor: grab; overflow: hidden; }
    #canvas-wrapper:active { cursor: grabbing; } canvas { width: 100%; height: 100%; display: block; }
    #controls { width: 90%; max-width: 600px; background: #1a1a1a; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .btn-group, .play-group, .row { display: flex; gap: 8px; align-items: center; }
    .file-label { flex: 1; background: #2b2b2b; color: #ccc; padding: 12px 5px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; border: 1px solid #444; }
    #playBtn { flex: 2; padding: 15px; background: linear-gradient(135deg, #d4af37, #f39c12); color: #111; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #nextBtn { flex: 1; padding: 15px; background: #444; color: white; border: 1px solid #555; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .progress-container { display: flex; align-items: center; gap: 10px; background: #222; padding: 8px; border-radius: 6px; border: 1px solid #333; }
    .time-text { font-size: 11px; font-family: monospace; color: #d4af37; min-width: 40px; text-align: center; }
    #progressBar { flex: 1; height: 5px; -webkit-appearance: none; background: #444; border-radius: 5px; cursor: pointer; }
    #progressBar::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; background: #f39c12; border-radius: 50%; }
    .btn-record { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff4444, #d32f2f); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #stopOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(220, 20, 60, 0.95); color: white; padding: 15px 30px; border-radius: 50px; z-index: 100; font-weight: bold; border: 3px solid white; cursor: pointer; }
    #statusBox { font-size: 12px; text-align: center; color: #d4af37; font-weight: bold; }
    label { font-size: 11px; color: #ccc; font-weight: 600; width: 80px; }
    input[type="range"], select { flex: 1; height: 36px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 6px; }
    input[type="file"] { display: none; }
    .layout-grid { display: flex; gap: 15px; width: 100%; }
    .layout-col { flex: 1; background: #222; padding: 12px; border-radius: 8px; border: 1px solid #3c3c3c; display: flex; flex-direction: column; gap: 8px; }
    .layout-col label { width: 100%; text-align: left; font-size: 10px; margin-bottom: -4px; color: #aaa; }
  </style>
</head>
<body>
  <div id="canvas-wrapper">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="stopOverlay" onclick="stopRecording()">⏹ STOP & SIMPAN</div>
  </div>

  <div id="controls">
    <div id="statusBox">Siap. test part 1 (40 Vis Lurus, No Bulat).</div>
    <div class="btn-group">
      <label for="bgInput" class="file-label" style="border-bottom: 3px solid #d4af37">1. FOTO LATAR</label>
      <label for="audioInput" class="file-label" style="border-bottom: 3px solid #00bcd4">2. MUSIK</label>
    </div>
    <div class="play-group"><button id="playBtn" onclick="togglePlay()">⚠ PUTAR MUSIK</button><button id="nextBtn" onclick="playRandomSong()">⏭ NEXT</button></div>
    <div class="progress-container"><span id="currTime" class="time-text">00:00</span><input type="range" id="progressBar" value="0" min="0" step="0.1"><span id="durTime" class="time-text">00:00</span></div>
    <input type="file" id="bgInput" accept="image/*"><input type="file" id="audioInput" accept="audio/*" multiple>
    <hr style="border:0; border-top:1px solid #333; margin:5px 0;">

    <div class="layout-grid">
      <div class="layout-col">
        <label style="color:#00d2ff;">VISUALIZER (NO BULAT)</label>
        <select id="visType">
            <optgroup label="SOLID BARS"><option value="vintage_bars">📊 Vintage Bars</option><option value="winamp_classic">📻 Winamp Peaks</option><option value="classic_eq">🎙️ Classic EQ</option><option value="step_eq">🧱 Step Block</option><option value="thin_eq">📏 Thin EQ</option><option value="thick_bars">⬛ Bold Bars</option><option value="hollow_bars">🔲 Hollow Bars</option><option value="rounded_bars">💊 Rounded</option><option value="split_eq">⏸️ Split EQ</option><option value="double_mirror">🪞 Double Mirror</option></optgroup>
            <optgroup label="PEAKS & DOTS"><option value="dotted_eq">⏺️ Dotted Peak</option><option value="led_matrix">🚥 LED Matrix</option><option value="analog_vu">🎛️ Analog VU</option><option value="retro_oscilloscope">📺 Oscilloscope</option><option value="peak_line">〰️ Floating Peak</option><option value="peak_dots_only">⚪ Dots Peak</option><option value="dash_bars">➖ Dashed Seg</option><option value="meter_blocks">📶 Meter Blocks</option><option value="soft_glow_bars">🌟 Soft Glow</option><option value="white_caps">🧢 White Caps</option></optgroup>
            <optgroup label="MODERN GRADIENT"><option value="liquid_bar">💧 Liquid Cyan</option><option value="cyber_pulse">⚡ Neon Pulse</option><option value="mirror_bars">🪞 Mirrored Glass</option><option value="gradient_blocks">🎛️ Cyan-Blue Grad</option><option value="sunset_bars">🌅 Sunset Grad</option><option value="emerald_bars">💎 Emerald Grad</option><option value="purple_haze">🟣 Purple Haze</option><option value="gold_classic">👑 Gold EQ</option><option value="monochrome_fade">🎞️ Mono Fade</option><option value="dual_tone">🌗 Dual Tone</option></optgroup>
            <optgroup label="WAVES & LINES"><option value="modern_wave">🌊 Modern Wave</option><option value="filled_wave">🌊 Filled Wave</option><option value="double_wave">〰️ Double Wave</option><option value="thin_wave">✒️ Thin Line</option><option value="shadow_wave">🌒 Shadow Wave</option><option value="stereo_lines">⏸️ Stereo Lines</option><option value="smooth_curve">🔔 Smooth Curve</option><option value="ribbon_wave">🎀 Ribbon Wave</option><option value="minimal_line">➖ Minimalist Line</option><option value="calm_horizon">🌅 Calm Horizon</option></optgroup>
        </select>
        <label>TINGGI VIS.</label><input type="range" id="visHeight" min="30" max="600" value="150">
        <label>LEBAR VIS.</label><input type="range" id="visWidth" min="100" max="1100" value="400">
        <label>OPASITAS.</label><input type="range" id="visOpacity" min="0.1" max="1.0" step="0.05" value="1.0">
      </div>
      <div class="layout-col">
        <label style="color:#ffb300;">AREA BASS (LATAR ASLI)</label>
        <select id="speakerStyle"><option value="clipping_bg">🟢 Aktifkan Area Bass</option><option value="none">🚫 Matikan Efek</option></select>
        <label style="color:#00ffaa; display:flex; cursor:pointer;"><input type="checkbox" id="showTarget" checked style="margin-right:6px;"> Target [+]</label>
        <label>UKURAN AREA</label><input type="range" id="speakerSize" min="0.2" max="5.0" step="0.1" value="1.5">
        <label style="color:#ff5252;">SHAKE</label><input type="range" id="speakerShake" min="0" max="30" value="10">
        <label style="color:#ff5252;">PUMP</label><input type="range" id="speakerPump" min="0" max="2.0" step="0.1" value="0.5">
      </div>
    </div>
    <hr style="border:0; border-top:1px dashed #333; margin:5px 0;">
    <div class="layout-grid">
      <div class="layout-col">
        <label style="color:#d7ccc8;">ASAP KOPI</label>
        <select id="coffeeStyle"><option value="none">🚫 Tanpa Asap</option><option value="soft_steam">☕ Soft Steam</option><option value="heavy_steam">☁️ Heavy Steam</option></select>
      </div>
      <div class="layout-col">
        <label style="color:#ff8a65;">API LILIN</label>
        <select id="candleStyle"><option value="none">🚫 Tanpa Lilin</option><option value="calm_flame">🕯️ Calm Flame</option></select>
      </div>
    </div>
    <div class="row"><label>UKURAN PROP</label><input type="range" id="propSize" min="0.2" max="5.0" step="0.1" value="1.0"></div>
    <div class="row"><label>KCPTN PROP</label><input type="range" id="propSpeed" min="0.1" max="5.0" step="0.1" value="1.0"></div>
    <hr style="border:0; border-top:1px dashed #333; margin:5px 0;">
    <div class="row">
      <label style="color:#00e5ff;">PARTIKEL</label>
      <select id="type">
        <option value="none">🚫 Tanpa Partikel</option><option value="dust_motes">✨ Debu Emas</option><option value="magic_sparks">💫 Sihir Biru</option>
        <option value="floating_embers">🔥 Bara Terbang</option><option value="bokeh_orbs">🫧 Bokeh Orbs</option><option value="snow_dust">❄️ Salju</option>
      </select>
    </div>
    <div class="row"><label>ARAH</label><select id="fxAngle"><option value="0">Lurus</option><option value="15">Kanan 15°</option><option value="-15">Kiri 15°</option></select></div>
    <div class="row"><label>SPEED FX</label><input type="range" id="fxSpeed" min="0.1" max="5.0" step="0.1" value="1.0"></div>
    <button class="btn-record" onclick="startRecording()">🔴 MULAI REKAM 720p</button>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), audioPlayer=document.getElementById('audioPlayer');
    const width=1280, height=720;
    let audioFiles=[], currentPlayIndex=0, currentUrl=null, isBgReady=false, bgImg=new Image();
    let audioCtx, analyser, dataArray, isAudioInit=false, peakH=new Array(120).fill(0);
    let bgSc=1, bgX=0, bgY=0;

    let visW=400, visX=(width-visW)/2, visY=height-160;
    let spk1X=250, spk1Y=height-300, spk2X=width-250, spk2Y=height-300;
    let cof1X=350, cof1Y=height-150, cof2X=width-350, cof2Y=height-150;
    let can1X=150, can1Y=height-200, can2X=width-150, can2Y=height-200, can3X=200, can3Y=height-100, can4X=width-200, can4Y=height-100;
    let dragT=null, dOffX=0, dOffY=0, isDragProg=false, time=0;

    function formatT(s) { if(isNaN(s))return"00:00"; let m=Math.floor(s/60); return `${m.toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`; }

    document.getElementById('bgInput').addEventListener('change', e => {
      if(e.target.files[0]) {
        const reader=new FileReader();
        reader.onload=ev=>{ bgImg.onload=()=>{ if(bgImg.naturalWidth>0){isBgReady=true; document.getElementById('statusBox').innerText="✅ Foto Oke.";} }; bgImg.src=ev.target.result; };
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    document.getElementById('audioInput').addEventListener('change', e => {
      if(e.target.files.length) { audioFiles=Array.from(e.target.files).sort(()=>Math.random()-0.5); currentPlayIndex=0; document.getElementById('playBtn').innerText="▶ PLAY MUSIK"; document.getElementById('statusBox').innerText=`${audioFiles.length} Lagu Siap!`; }
    });

    function playRandomSong() {
      if(!audioFiles.length) return;
      if(currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl=URL.createObjectURL(audioFiles[currentPlayIndex]); audioPlayer.src=currentUrl; audioPlayer.load();
      if(!audioCtx){ audioCtx=new(window.AudioContext||window.webkitAudioContext)(); analyser=audioCtx.createAnalyser(); analyser.fftSize=256;
        let src=audioCtx.createMediaElementSource(audioPlayer), dest=audioCtx.createMediaStreamDestination();
        src.connect(analyser); analyser.connect(audioCtx.destination); analyser.connect(dest); window.mediaDest=dest; dataArray=new Uint8Array(analyser.frequencyBinCount); isAudioInit=true; }
      audioPlayer.play(); document.getElementById('playBtn').innerText="⏸ PAUSE"; currentPlayIndex=(currentPlayIndex+1)%audioFiles.length;
    }
    audioPlayer.addEventListener('ended', playRandomSong);
    function togglePlay() { if(!audioFiles.length)return alert("Pilih Musik!"); if(audioPlayer.paused){if(!audioPlayer.src)playRandomSong();else{audioPlayer.play(); document.getElementById('playBtn').innerText="⏸ PAUSE";}}else{audioPlayer.pause(); document.getElementById('playBtn').innerText="▶ RESUME";} }

    audioPlayer.addEventListener('timeupdate', ()=>{
      if(isFinite(audioPlayer.duration)&&document.getElementById('durTime').innerText==="00:00") document.getElementById('durTime').innerText=formatT(audioPlayer.duration);
      if(!isDragProg){ document.getElementById('progressBar').value=(audioPlayer.currentTime/audioPlayer.duration)*100||0; document.getElementById('currTime').innerText=formatT(audioPlayer.currentTime); }
    });
    document.getElementById('progressBar').addEventListener('input', e=>{ isDragProg=true; if(audioPlayer.duration)audioPlayer.currentTime=(e.target.value/100)*audioPlayer.duration; });
    document.getElementById('progressBar').addEventListener('change', ()=>isDragProg=false);

    function getPos(e){ let r=canvas.getBoundingClientRect(), ev=e.touches?e.touches[0]:e; return {x:(ev.clientX-r.left)*(width/r.width), y:(ev.clientY-r.top)*(height/r.height)}; }
    function sDrag(e){
      let p=getPos(e), sr=parseFloat(document.getElementById('speakerSize').value)*60, tar=[
        {id:'s1',x:spk1X,y:spk1Y,r:sr},{id:'s2',x:spk2X,y:spk2Y,r:sr}, {id:'cf1',x:cof1X,y:cof1Y,r:40},{id:'cf2',x:cof2X,y:cof2Y,r:40},
        {id:'cn1',x:can1X,y:can1Y,r:30},{id:'cn2',x:can2X,y:can2Y,r:30},{id:'cn3',x:can3X,y:can3Y,r:30},{id:'cn4',x:can4X,y:can4Y,r:30}
      ];
      if(p.x>=visX-visW/2 && p.x<=visX+visW/2 && p.y>=visY-150 && p.y<=visY+50){ dragT='v'; dOffX=p.x-visX; dOffY=p.y-visY; if(e.cancelable)e.preventDefault(); return; }
      for(let t of tar) if(Math.hypot(p.x-t.x, p.y-t.y)<=t.r){ dragT=t.id; dOffX=p.x-t.x; dOffY=p.y-t.y; if(e.cancelable)e.preventDefault(); break; }
    }
    function dDrag(e){
      if(!dragT)return; let p=getPos(e), nx=p.x-dOffX, ny=p.y-dOffY;
      if(dragT==='v'){visX=nx; visY=ny;} else if(dragT==='s1'){spk1X=nx; spk1Y=ny;} else if(dragT==='s2'){spk2X=nx; spk2Y=ny;}
      else if(dragT==='cf1'){cof1X=nx; cof1Y=ny;} else if(dragT==='cf2'){cof2X=nx; cof2Y=ny;}
      else if(dragT==='cn1'){can1X=nx; can1Y=ny;} else if(dragT==='cn2'){can2X=nx; can2Y=ny;} else if(dragT==='cn3'){can3X=nx; can3Y=ny;} else if(dragT==='cn4'){can4X=nx; can4Y=ny;}
      if(e.cancelable)e.preventDefault();
    }
    canvas.addEventListener('mousedown',sDrag); canvas.addEventListener('mousemove',dDrag); window.addEventListener('mouseup',()=>dragT=null);
    canvas.addEventListener('touchstart',sDrag,{passive:false}); canvas.addEventListener('touchmove',dDrag,{passive:false}); window.addEventListener('touchend',()=>dragT=null);

    function getSym(i, t){ if(!dataArray)return 0; return dataArray[Math.floor(Math.abs(i-t/2)/(t/2)*dataArray.length*0.6)]/255; }
    
    // VISUALIZER 40 MACAM
    function drawVis(bLen) {
      let st=document.getElementById('visType').value, vh=parseInt(document.getElementById('visHeight').value); visW=parseInt(document.getElementById('visWidth').value);
      ctx.save(); ctx.translate(visX, visY); ctx.translate(-visW/2, 0); ctx.globalAlpha=parseFloat(document.getElementById('visOpacity').value);
      let cy=0;
      
      let isBars = ['vintage_bars','winamp_classic','classic_eq','step_eq','thin_eq','thick_bars','hollow_bars','rounded_bars','split_eq','double_mirror','dotted_eq','led_matrix','peak_line','peak_dots_only','dash_bars','meter_blocks','soft_glow_bars','white_caps','liquid_bar','cyber_pulse','mirror_bars','gradient_blocks','sunset_bars','emerald_bars','purple_haze','gold_classic','monochrome_fade','dual_tone'].includes(st);
      let isWave = ['modern_wave','filled_wave','double_wave','thin_wave','shadow_wave','stereo_lines','smooth_curve','ribbon_wave','minimal_line','calm_horizon'].includes(st);
      
      if(st==='analog_vu'){
        let b=dataArray?dataArray[5]/255:0, t=dataArray?dataArray[30]/255:0;
        let dn=(x,r,v,txt)=>{
          ctx.save(); ctx.translate(x,0); ctx.beginPath(); ctx.arc(0,0,r,Math.PI,Math.PI*2); ctx.fillStyle='rgba(20,20,20,0.8)'; ctx.fill(); ctx.strokeStyle='#ffb300'; ctx.lineWidth=2; ctx.stroke();
          for(let i=0;i<=10;i++){ let a=Math.PI+(i/10)*Math.PI; ctx.beginPath(); ctx.moveTo(Math.cos(a)*(r-10),Math.sin(a)*(r-10)); ctx.lineTo(Math.cos(a)*(r-20),Math.sin(a)*(r-20)); ctx.strokeStyle=i>7?'red':'#ffb300'; ctx.stroke(); }
          ctx.rotate(Math.PI+(v*0.8+0.1)*Math.PI); ctx.beginPath(); ctx.moveTo(0,10); ctx.lineTo(0,-r+25); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.stroke(); ctx.restore();
          ctx.fillStyle='#ffb300'; ctx.font='bold 16px monospace'; ctx.textAlign='center'; ctx.fillText(txt,x,25);
        }; dn(visW/4,vh*0.8,b,"L"); dn(visW*0.75,vh*0.8,t,"R");
      }
      else if(st==='retro_oscilloscope'){
        ctx.beginPath(); ctx.moveTo(0,0); for(let i=0;i<=100;i++) ctx.lineTo((i/100)*visW, -getSym(i,100)*vh);
        ctx.strokeStyle='#0f4'; ctx.lineWidth=3; ctx.shadowBlur=10; ctx.shadowColor='#0f4'; ctx.stroke(); ctx.shadowBlur=0;
      }
      else if(isBars) {
        let n=st.includes('led')||st.includes('mirror')?40:48; let sp=visW/n, bw=sp*0.7;
        for(let i=0; i<n; i++) {
          let v=getSym(i,n), h=Math.max(2,v*vh), px=i*sp;
          if(peakH[i]<=h) peakH[i]=h; else peakH[i]=Math.max(0,peakH[i]-2);
          
          if(st==='vintage_bars'){ ctx.fillStyle='#f5f5f0'; ctx.fillRect(px,-h,bw,h); }
          else if(st==='winamp_classic'){ ctx.fillStyle='rgba(230,235,240,0.7)'; ctx.fillRect(px,-h,bw,h); ctx.fillStyle='red'; ctx.fillRect(px,-peakH[i]-5,bw,4); }
          else if(st==='classic_eq'){ let g=ctx.createLinearGradient(0,0,0,-vh); g.addColorStop(0,'#00e676'); g.addColorStop(0.6,'yellow'); g.addColorStop(1,'red'); ctx.fillStyle=g; ctx.fillRect(px,-h,bw,h); }
          else if(st==='step_eq'){ let bl=Math.floor(h/12); for(let j=0;j<bl;j++){ctx.fillStyle=j>(vh/12)*0.7?'#ff5722':'#ffc107'; ctx.fillRect(px,-(j*12)-12,bw,10);} }
          else if(st==='thin_eq'){ ctx.fillStyle='#fff'; ctx.fillRect(px,-h,2,h); }
          else if(st==='thick_bars'){ ctx.fillStyle='#fff'; ctx.fillRect(px,-h,sp*0.85,h); }
          else if(st==='hollow_bars'){ ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.lineWidth=1.5; ctx.strokeRect(px,-h,bw,h); }
          else if(st==='rounded_bars'){ ctx.fillStyle='#fff'; ctx.beginPath(); if(ctx.roundRect)ctx.roundRect(px,-h,bw,h,bw/2); else ctx.rect(px,-h,bw,h); ctx.fill(); }
          else if(st==='split_eq'){ ctx.fillStyle='#fff'; ctx.fillRect(0,-1,visW,2); ctx.fillRect(px,-(h/2)-4,bw,h/2); ctx.fillRect(px,4,bw,h/2); }
          else if(st==='double_mirror'){ ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.fillRect(px,-h/2,bw,h/2); ctx.fillRect(px,0,bw,h/2); }
          else if(st==='dotted_eq'){ ctx.fillStyle='rgba(200,200,200,0.5)'; ctx.fillRect(0,0,visW,2); ctx.fillStyle='#00bcd4'; if(h>5){ctx.beginPath(); ctx.arc(px+sp/2,-h,4,0,Math.PI*2); ctx.fill();} }
          else if(st==='led_matrix'){ let ry=vh/15; let ar=Math.floor(v*15); for(let r=0;r<15;r++){ ctx.fillStyle=r<ar?(r>10?'red':'#8bc34a'):'rgba(255,255,255,0.05)'; ctx.beginPath(); ctx.arc(px+sp/2,-r*ry-ry/2,sp*0.35,0,Math.PI*2); ctx.fill(); } }
          else if(st==='peak_line'){ ctx.fillStyle='#fff'; ctx.fillRect(px,-peakH[i]-3,bw,3); }
          else if(st==='peak_dots_only'){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(px+sp/2,-peakH[i]-5,4,0,Math.PI*2); ctx.fill(); }
          else if(st==='dash_bars'){ let ds=Math.floor(h/8); ctx.fillStyle='rgba(255,255,255,0.8)'; for(let j=0;j<ds;j++) ctx.fillRect(px,-(j*8)-4,bw,4); }
          else if(st==='meter_blocks'){ let ds=Math.floor(h/10); for(let j=0;j<ds;j++){ ctx.fillStyle=j>8?'red':(j>5?'yellow':'#0f4'); ctx.fillRect(px,-(j*10)-8,bw,8); } }
          else if(st==='soft_glow_bars'){ ctx.fillStyle='#fff'; ctx.shadowBlur=12; ctx.shadowColor='rgba(255,255,255,0.7)'; ctx.fillRect(px,-h,bw,h); ctx.shadowBlur=0; }
          else if(st==='white_caps'){ ctx.fillStyle='rgba(200,200,200,0.5)'; ctx.fillRect(px,-h,bw,h); ctx.fillStyle='#fff'; ctx.fillRect(px,-h-4,bw,4); }
          else if(st==='liquid_bar'){ ctx.fillStyle='#00e5ff'; ctx.shadowBlur=15; ctx.shadowColor='#00e5ff'; ctx.beginPath(); if(ctx.roundRect)ctx.roundRect(px,-h,bw,h,bw/2); else ctx.rect(px,-h,bw,h); ctx.fill(); ctx.shadowBlur=0; }
          else if(st==='cyber_pulse'){ let g=ctx.createLinearGradient(0,0,0,-vh); g.addColorStop(0,'#f50057'); g.addColorStop(1,'#ff4081'); ctx.fillStyle=g; ctx.shadowBlur=10; ctx.shadowColor='#f50057'; ctx.fillRect(px,-h/2-2,bw,h/2); ctx.fillRect(px,2,bw,h/2); ctx.fillStyle='#fff'; ctx.fillRect(px,-h/2-6,bw,2); ctx.fillRect(px,h/2+4,bw,2); ctx.shadowBlur=0; }
          else if(st==='mirror_bars'){ ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fillRect(px,-h/2,sp*0.6,h/2); ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(px,0,sp*0.6,h*0.4); }
          else if(st.includes('grad')||st.includes('sunset')||st.includes('emerald')||st.includes('purple')||st.includes('gold')||st.includes('mono')){
            let g=ctx.createLinearGradient(0,0,0,-vh);
            if(st==='gradient_blocks'){g.addColorStop(0,'#00c6ff');g.addColorStop(1,'#0072ff');} else if(st==='sunset_bars'){g.addColorStop(0,'#ff3f34');g.addColorStop(0.5,'#ff7f50');g.addColorStop(1,'#fffa65');} else if(st==='emerald_bars'){g.addColorStop(0,'#004d40');g.addColorStop(1,'#18ffff');} else if(st==='purple_haze'){g.addColorStop(0,'#4a148c');g.addColorStop(1,'#ea80fc');} else if(st==='gold_classic'){g.addColorStop(0,'#ff8f00');g.addColorStop(1,'#ffe082');} else {g.addColorStop(0,'rgba(255,255,255,0.1)');g.addColorStop(1,'#fff');}
            ctx.fillStyle=g; ctx.fillRect(px,-h,bw,h);
          }
          else if(st==='dual_tone'){ ctx.fillStyle='#00e5ff'; ctx.fillRect(px,-h/2,bw,h/2); ctx.fillStyle='#ff4081'; ctx.fillRect(px,0,bw,h/2); }
        }
      }
      else if(isWave){
        let pts=100, sp=visW/pts; ctx.beginPath(); ctx.moveTo(0,0);
        for(let i=0;i<=pts;i++) {
          let h=getSym(i,pts)*vh;
          if(st==='modern_wave'){ ctx.lineTo(i*sp, -h-(Math.sin(i*0.1+time*5)*h*0.2)); }
          else if(st==='stereo_lines'){ /* handled below */ }
          else if(st==='smooth_curve'){ if(i<pts){ let nh=getSym(i+1,pts)*vh; ctx.quadraticCurveTo(i*sp,-h, i*sp+sp/2, (-h-nh)/2); } }
          else ctx.lineTo(i*sp, -h);
        }
        if(st==='modern_wave'){ let g=ctx.createLinearGradient(0,0,visW,0); g.addColorStop(0,'#00d2ff'); g.addColorStop(1,'#e040fb'); ctx.strokeStyle=g; ctx.lineWidth=3; ctx.stroke(); ctx.lineTo(visW,0); ctx.lineTo(0,0); ctx.fillStyle='rgba(0,210,255,0.15)'; ctx.fill(); }
        else if(st==='filled_wave'){ ctx.lineTo(visW,0); ctx.lineTo(0,0); ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke(); }
        else if(st==='double_wave'){ ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,0); for(let i=0;i<=pts;i++)ctx.lineTo(i*sp,-getSym(i,pts)*vh*0.6); ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.stroke(); }
        else if(st==='thin_wave'){ ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke(); }
        else if(st==='shadow_wave'){ ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.shadowBlur=15; ctx.shadowColor='#fff'; ctx.stroke(); ctx.shadowBlur=0; }
        else if(st==='minimal_line'){ ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2; ctx.stroke(); ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(0,0,visW,1); }
        else if(st==='calm_horizon'){ let g=ctx.createLinearGradient(0,-vh,0,0); g.addColorStop(0,'#fffa65'); g.addColorStop(1,'#ff7f50'); ctx.strokeStyle=g; ctx.lineWidth=3; ctx.stroke(); ctx.lineTo(visW,0); ctx.lineTo(0,0); ctx.fillStyle='rgba(255,127,80,0.1)'; ctx.fill(); }
        else if(st==='smooth_curve'){ ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.stroke(); }
        else if(st==='ribbon_wave'){ for(let l=0;l<3;l++){ ctx.beginPath(); ctx.moveTo(0,0); for(let i=0;i<=pts;i++)ctx.lineTo(i*sp, -getSym(i,pts)*vh*(1-l*0.2)-l*6); ctx.strokeStyle=`rgba(255,255,255,${0.9-l*0.3})`; ctx.lineWidth=2; ctx.stroke(); } }
        else if(st==='stereo_lines'){ ctx.beginPath(); ctx.moveTo(0,-10); for(let i=0;i<=pts;i++)ctx.lineTo(i*sp, -10-getSym(i,pts)*(vh/2)); ctx.strokeStyle='#00bcd4'; ctx.lineWidth=2; ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,10); for(let i=0;i<=pts;i++)ctx.lineTo(i*sp, 10+getSym(i,pts)*(vh/2)); ctx.strokeStyle='#ff4081'; ctx.stroke(); }
      }
      ctx.restore();
    }

    function drawBass(x,y) {
      if(document.getElementById('speakerStyle').value==='none' || !isBgReady || !bgImg.naturalWidth) return;
      let sc=parseFloat(document.getElementById('speakerSize').value), bs=0;
      if(dataArray&&!audioPlayer.paused){ let mb=Math.max(dataArray[0],dataArray[1],dataArray[2])/255; if(mb>0.4) bs=Math.pow((mb-0.4)/0.6, 1.5); }
      let r=50*sc, shk=parseFloat(document.getElementById('speakerShake').value), pmp=parseFloat(document.getElementById('speakerPump').value);
      let sx=x+(Math.random()-0.5)*bs*shk, sy=y+(Math.random()-0.5)*bs*shk, p=1.0+bs*pmp;

      ctx.save(); ctx.translate(sx,sy); ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fillStyle="rgba(0,0,0,0.15)"; ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(sx,sy); ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip(); ctx.scale(p,p); ctx.translate(-sx,-sy);
      ctx.drawImage(bgImg, bgGlobalX, bgGlobalY, bgImg.naturalWidth*bgGlobalScale, bgImg.naturalHeight*bgGlobalScale); ctx.restore();

      ctx.save(); ctx.translate(sx,sy);
      ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.lineWidth=3; ctx.strokeStyle=`rgba(0,0,0,${Math.max(0.4,bs)})`; ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,r-2,0,Math.PI*2); ctx.lineWidth=1; ctx.strokeStyle="rgba(255,255,255,0.3)"; ctx.stroke();
      if(document.getElementById('showTarget').checked){ ctx.beginPath(); ctx.moveTo(-15,0); ctx.lineTo(15,0); ctx.moveTo(0,-15); ctx.lineTo(0,15); ctx.lineWidth=2; ctx.strokeStyle='red'; ctx.stroke(); ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fillStyle='#0f4'; ctx.fill(); }
      ctx.restore();
    }

    let cPts=Array.from({length:60}, ()=>({x:(Math.random()-0.5)*30,y:Math.random()*1.5+0.5,s:Math.random()*12+6,l:Math.random()*150,m:Math.random()*100+60,sw:Math.random()*0.04+0.01,o:Math.random()*0.4+0.1}));
    function drawProps(s, pSpd) {
      let cs=document.getElementById('coffeeStyle').value, ls=document.getElementById('candleStyle').value;
      if(cs!=='none'){
        let lim=cs==='soft_steam'?15:50, sm=cs==='soft_steam'?0.8:1.5;
        for(let pos of [{x:cof1X,y:cof1Y},{x:cof2X,y:cof2Y}]){
          ctx.save(); ctx.translate(pos.x,pos.y); ctx.scale(s,s);
          for(let i=0;i<lim;i++){ let p=cPts[i]; p.l+=pSpd*sm; if(p.l>p.m){p.l=0;p.x=(Math.random()-0.5)*30;}
            let o=p.o*(1-(p.l/p.m)); if(o>0){ ctx.beginPath(); ctx.arc(p.x+Math.sin(p.l*p.sw)*25, -p.l*p.y, p.s+(p.l*0.4), 0, Math.PI*2); ctx.fillStyle=`rgba(240,240,240,${o})`; ctx.fill(); }
          } ctx.restore();
        }
      }
      if(ls!=='none'){
        let t=time*2*pSpd, f=Math.sin(t*3)*2, sw=Math.sin(t)*1;
        for(let pos of [{x:can1X,y:can1Y},{x:can2X,y:can2Y},{x:can3X,y:can3Y},{x:can4X,y:can4Y}]){
          ctx.save(); ctx.translate(pos.x,pos.y); ctx.scale(s,s);
          ctx.beginPath(); ctx.arc(0,-32,48,0,Math.PI*2); let g=ctx.createRadialGradient(0,-32,0,0,-32,64); g.addColorStop(0,'rgba(255,120,0,0.25)'); g.addColorStop(1,'rgba(255,120,0,0)'); ctx.fillStyle=g; ctx.fill();
          ctx.beginPath(); ctx.moveTo(0,5); ctx.lineTo(sw*0.05,-8); ctx.lineWidth=3; ctx.strokeStyle='#111'; ctx.stroke();
          let df=(fw,fh,fsw,c)=>{ ctx.beginPath(); ctx.moveTo(0,2); ctx.bezierCurveTo(fw,2,fw*0.9,-fh*0.4,fsw,-fh); ctx.bezierCurveTo(-fw*0.9,-fh*0.4,-fw,2,0,2); ctx.fillStyle=c; ctx.fill(); };
          df(16,65+f,sw,'rgba(255,140,0,0.8)'); df(11,48+f*0.75,sw*0.7,'rgba(255,210,0,0.9)'); df(5,29+f*0.45,sw*0.3,'rgba(255,255,255,0.95)');
          ctx.restore();
        }
      }
    }

    let pFx=Array.from({length:300}, ()=>({x:Math.random()*width,y:Math.random()*height,s:Math.random()*3+1,sy:Math.random()*1.5+0.5,o:Math.random()*0.6+0.2,l:Math.random()*100,ws:Math.random()*0.05+0.01}));
    function drawFx() {
      let t=document.getElementById('type').value; if(t==='none')return;
      let c=parseInt(document.getElementById('count').value), sp=parseFloat(document.getElementById('fxSpeed').value), wnd=parseInt(document.getElementById('fxAngle').value)*Math.PI/180;
      ctx.save();
      for(let i=0;i<c;i++){
        let p=pFx[i]; p.l+=p.ws;
        if(['dust_motes','magic_sparks','floating_embers'].includes(t)){ p.y-=p.sy*sp*0.5; p.x+=Math.sin(p.l)*sp+Math.sin(wnd)*2; } else{ p.y+=p.sy*sp; p.x+=Math.sin(p.l)*sp+Math.sin(wnd)*3; }
        if(p.y>height+50||p.y<-50||p.x>width+50||p.x<-50) { p.y=-20; p.x=Math.random()*width; }
        let co = p.o*(0.5+0.5*Math.sin(p.l*2)); ctx.beginPath();
        if(t==='dust_motes'){ ctx.fillStyle=`rgba(255,230,150,${co})`; ctx.shadowBlur=p.s*2; ctx.shadowColor='#ffeb3b'; } else if(t==='snow_dust'){ ctx.fillStyle=`rgba(255,255,255,${co})`; } else { ctx.fillStyle=`rgba(200,255,255,${co})`; }
        ctx.arc(p.x,p.y,p.s,0,Math.PI*2); ctx.fill();
      } ctx.restore();
    }

    function animate() {
      ctx.fillStyle="#000"; ctx.fillRect(0,0,width,height); time+=0.05;
      if(isBgReady&&bgImg.naturalWidth){ bgGlobalScale=Math.max(width/bgImg.naturalWidth,height/bgImg.naturalHeight); bgGlobalX=(width/2)-(bgImg.naturalWidth/2)*bgGlobalScale; bgGlobalY=(height/2)-(bgImg.naturalHeight/2)*bgGlobalScale; ctx.drawImage(bgImg,bgGlobalX,bgGlobalY,bgImg.naturalWidth*bgGlobalScale,bgImg.naturalHeight*bgGlobalScale); }
      if(isAudioInit&&!audioPlayer.paused) analyser.getByteFrequencyData(dataArray);
      drawVis(isAudioInit?analyser.frequencyBinCount:128); drawBass(spk1X,spk1Y); drawBass(spk2X,spk2Y);
      drawProps(parseFloat(document.getElementById('propSize').value), parseFloat(document.getElementById('propSpeed').value)); drawFx();
      requestAnimationFrame(animate);
    } animate();

    let mediaRec, chnk=[];
    function startRecording(){ if(!isAudioInit)return alert("Putar musik!"); audioPlayer.play(); document.getElementById('stopOverlay').style.display='block'; let str=canvas.captureStream(30), comb=new MediaStream([...str.getTracks(),window.mediaDest.stream.getAudioTracks()[0]]); mediaRec=new MediaRecorder(comb,{mimeType:'video/webm'}); mediaRec.ondataavailable=e=>chnk.push(e.data); mediaRec.onstop=()=>{ let b=new Blob(chnk,{type:'video/webm'}); chnk=[]; let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`test_${Date.now()}.webm`; a.click(); document.getElementById('stopOverlay').style.display='none'; }; mediaRec.start(); }
    function stopRecording(){ if(mediaRec)mediaRec.stop(); audioPlayer.pause(); }
  </script>
