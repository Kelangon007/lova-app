<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror v1 (Cinematic Reflection)</title>
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.5/fix-webm-duration.js"></script>
  <style>
    body { margin: 0; background-color: #111; font-family: 'Segoe UI', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; touch-action: pan-y; }
    #canvas-wrapper { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.2); background: #000; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9); cursor: grab; overflow: hidden; }
    #canvas-wrapper:active { cursor: grabbing; }
    canvas { width: 100%; height: 100%; display: block; }
    #controls { width: 90%; max-width: 600px; background: #1a1a1a; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); }
    .btn-group, .play-group, .grid-2 { display: flex; gap: 8px; }
    .grid-2 { flex-wrap: wrap; }
    .grid-2 .row { flex: 1 1 45%; }
    .file-label { flex: 1; background: #2a2a2a; color: #ccc; padding: 12px 5px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; border: 1px solid #444; transition: 0.2s; white-space: nowrap; }
    .file-label:hover { background: #444; color: white; }
    #playBtn { flex: 2; padding: 15px; background: #333; color: #888; border: 2px solid #222; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    #playBtn.ready { background: linear-gradient(135deg, #00d2ff, #e040fb); color: white; border: none; }
    #nextBtn { flex: 1; padding: 15px; background: #444; color: #aaa; border: 2px solid #333; border-radius: 8px; font-weight: bold; cursor: not-allowed; transition: 0.3s; }
    #nextBtn.ready { background: #2a2a2a; color: white; border: 2px solid #555; cursor: pointer; }
    .progress-container { display: flex; align-items: center; gap: 10px; background: #222; padding: 8px; border-radius: 6px; border: 1px solid #333; }
    .time-text { font-size: 11px; font-family: monospace; color: #00d2ff; min-width: 40px; text-align: center; }
    #progressBar { flex: 1; height: 5px; -webkit-appearance: none; background: #444; border-radius: 5px; cursor: pointer; }
    #progressBar::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; background: #e040fb; border-radius: 50%; cursor: pointer; }
    .btn-record { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff4444, #d32f2f); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top:10px; }
    #stopOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(220, 20, 60, 0.95); color: white; padding: 15px 30px; border-radius: 50px; z-index: 100; font-weight: bold; border: 3px solid white; cursor: pointer; }
    #countdownOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: bold; color: white; text-shadow: 0 0 20px rgba(0, 0, 0, 0.8); z-index: 100; }
    #statusBox { font-size: 12px; text-align: center; color: #00d2ff; margin-bottom: 5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; align-items: center; gap: 10px; width: 100%; }
    label { font-size: 10px; width: 85px; color: #aaa; font-weight: 600; text-transform: uppercase; }
    input[type="range"], select { flex: 1; height: 32px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 6px; font-size:12px; }
    input[type="file"] { display: none; }
    optgroup { background: #111; color: #00d2ff; font-weight: bold; }
  </style>
</head>

<body>
  <div id="canvas-wrapper">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="countdownOverlay">3</div>
    <div id="stopOverlay" onclick="stopRecording()">⏹ STOP & SIMPAN</div>
  </div>

  <div id="controls">
    <div id="statusBox">Siap. Mirror v1 (Cinematic 3D Glass Edition).</div>
    <div class="btn-group">
      <label for="bgInput" class="file-label" style="border-bottom: 3px solid #00bcd4">1. FOTO LATAR</label>
      <label for="audioInput" class="file-label" style="border-bottom: 3px solid #e040fb">2. MUSIK (BANYAK)</label>
    </div>

    <div class="play-group">
      <button id="playBtn" onclick="togglePlay()">⚠ PUTAR MUSIK</button>
      <button id="nextBtn" onclick="playRandomSong(false)">⏭ NEXT</button>
    </div>

    <div class="progress-container">
      <span id="currTime" class="time-text">00:00</span>
      <input type="range" id="progressBar" value="0" min="0" step="0.1">
      <span id="durTime" class="time-text">00:00</span>
    </div>

    <input type="file" id="bgInput" accept="image/*">
    <input type="file" id="audioInput" accept="audio/*" multiple>

    <hr style="border: 0; border-top: 1px solid #333; width: 100%; margin: 5px 0;">

    <div class="row">
      <label style="color:#00d2ff;">VISUALIZER</label>
      <select id="visType">
        <optgroup label="=== CINEMATIC & MINIMALIST ===">
            <option value="elegant_piano">🎹 1. Elegant Piano Keys</option>
            <option value="cinematic_streaks">🌠 2. Cinematic Light Streaks</option>
            <option value="ghost_ambient">🌫️ 3. Ghostly Ambient Bars</option>
            <option value="glitch_tech">📟 4. Glitch Tech Blocks</option>
            <option value="diamond_eq">♦️ 5. Symmetric Diamond EQ</option>
            <option value="particle_fountain">✨ 6. Smooth Particle Fountain</option>
        </optgroup>
        <optgroup label="=== MODERN BARS ===">
            <option value="vintage_bars">📊 7. Vintage Solid Bars (Off-White)</option>
            <option value="liquid_bar">💧 8. Liquid Glowing Cyan Bars</option>
            <option value="gradient_blocks">🎛️ 9. Cyan-Blue Gradient Blocks</option>
            <option value="sunset_bars">🌅 10. Warm Sunset Gradient Bars</option>
        </optgroup>
        <optgroup label="=== STUDIO EFFECTS ===">
            <option value="modern_wave">🌊 11. Modern Smooth Wave</option>
            <option value="neon_lines">🚥 12. Vertical Neon Lines</option>
            <option value="ambient_glow">🌟 13. Bottom Ambient Glow</option>
            <option value="split_glow">⚡ 14. Split Center Glow Bars</option>
        </optgroup>
      </select>
    </div>

    <div class="grid-2">
      <div class="row"><label>TINGGI VIS.</label><input type="range" id="visHeight" min="30" max="600" value="150"></div>
      <div class="row"><label>LEBAR VIS.</label><input type="range" id="visWidth" min="100" max="1100" value="400"></div>
    </div>

    <hr style="border: 0; border-top: 1px dashed #333; width: 100%; margin: 5px 0;">

    <div class="row">
        <label style="color:#ffb300; width:100px;">DAUN SPEAKER</label>
        <select id="speakerStyle">
            <option value="active">🟢 Aktif (Berdenyut)</option>
            <option value="none">🚫 Matikan Speaker</option>
        </select>
    </div>
    <div class="grid-2">
        <div class="row"><label>UKURAN</label><input type="range" id="speakerSize" min="0.2" max="5.0" step="0.1" value="1.5"></div>
        <div class="row"><label>DENTUMAN</label><input type="range" id="speakerPump" min="0" max="2.0" step="0.1" value="0.5"></div>
        <div class="row"><label>GETARAN</label><input type="range" id="speakerShake" min="0" max="30" step="1" value="10"></div>
    </div>

    <hr style="border: 0; border-top: 1px dashed #333; width: 100%; margin: 5px 0;">

    <div class="row">
      <label>EFEK FILM</label>
      <select id="type">
        <option value="none">🚫 Tanpa Efek</option>
        <option value="vintage">🎞️ Vintage HD (Kotor, Debu)</option>
        <option value="grain">🎬 Grains (Bintik Saja)</option>
        <option value="flicker_8mm">🎞️ 8mm Flicker Halus</option>
        <option value="rain">🌧️ Hujan Realistis</option>
        <option value="fireflies">✨ Kunang-Kunang</option>
      </select>
    </div>

    <button class="btn-record" id="recordBtn" onclick="startCountdownAndRecord()">🔴 MULAI REKAM 720p</button>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    const statusBox = document.getElementById('statusBox'); const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d');
    const audioPlayer = document.getElementById('audioPlayer'); const playBtn = document.getElementById('playBtn'); const nextBtn = document.getElementById('nextBtn');
    const stopOverlay = document.getElementById('stopOverlay'); const countdownOverlay = document.getElementById('countdownOverlay'); const recordBtn = document.getElementById('recordBtn');
    const progressBar = document.getElementById('progressBar'); const currTimeEl = document.getElementById('currTime'); const durTimeEl = document.getElementById('durTime');
    
    let isDraggingProgress = false; const width = 1280; const height = 720;
    let audioFiles = []; let currentObjectUrl = null; let currentSongName = ""; let playTimeout = null;
    let isTrackLoaded = false; let shuffledPlaylist = []; let currentPlayIndex = 0; let isCountingDown = false; let countdownTimer = null;

    function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } return array; }

    document.getElementById('audioInput').addEventListener('change', function(e) {
      if (this.files.length > 0) {
        audioFiles = Array.from(this.files); isTrackLoaded = true; shuffledPlaylist = shuffle(Array.from({ length: audioFiles.length }, (v, k) => k)); currentPlayIndex = 0;
        playBtn.innerHTML = "▶ PLAY MUSIK"; playBtn.classList.add('ready'); nextBtn.classList.add('ready');
        statusBox.innerText = `${audioFiles.length} Lagu dimuat. Siap diputar!`; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
        audioPlayer.pause(); if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null;
      }
    });

    function playRandomSong(isInstant = false) {
      if (audioFiles.length === 0) return; if (playTimeout) clearTimeout(playTimeout);
      if (currentPlayIndex >= shuffledPlaylist.length) { currentPlayIndex = 0; stopEverything(); return; }
      const delayAmount = isInstant ? 0 : 3500;
      if (!isInstant) { audioPlayer.pause(); playBtn.innerText = "⏳ TUNGGU..."; statusBox.innerText = "⏳ Jeda pergantian lagu..."; progressBar.value = 0; }
      playTimeout = setTimeout(() => {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        const selectedFile = audioFiles[shuffledPlaylist[currentPlayIndex]];
        currentSongName = selectedFile.name.replace(/\.[^/.]+$/, ""); currentObjectUrl = URL.createObjectURL(selectedFile);
        audioPlayer.src = currentObjectUrl; audioPlayer.load();
        if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
        audioPlayer.play().then(() => { playBtn.innerText = "⏸ PAUSE"; statusBox.innerText = `🎵 ${currentPlayIndex + 1}/${audioFiles.length}: ${currentSongName}`; currentPlayIndex++; }).catch(e => { playBtn.innerText = "❌ ERROR"; });
      }, delayAmount);
    }

    audioPlayer.addEventListener('ended', () => { playRandomSong(false); });
    function stopEverything() {
      audioPlayer.pause(); if (playTimeout) clearTimeout(playTimeout); if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null;
      if (dataArray) dataArray.fill(0); shuffledPlaylist = shuffle(Array.from({ length: audioFiles.length }, (v, k) => k));
      statusBox.innerText = `✅ Semua lagu selesai.`; playBtn.innerText = "▶ PLAY ACAK";
      if (mediaRecorder && mediaRecorder.state === 'recording') { setTimeout(() => { stopRecording(); }, 500); }
    }

    // VARIABEL POSISI
    let visW = 400; let visX = (width - visW) / 2; let visY = height - 220; // Diangkat dikit biar muat kaca
    let spk1X = 250; let spk1Y = height - 320; let spk2X = width - 250; let spk2Y = height - 320;
    let isDraggingSpk1 = false; let isDraggingSpk2 = false; let isDraggingVis = false; let dragOffsetX = 0; let dragOffsetY = 0;

    function getMousePos(e) { const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height; let clientX = e.clientX; let clientY = e.clientY; if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; } return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY }; }
    function startDrag(e) {
      const pos = getMousePos(e); const spkScale = parseFloat(document.getElementById('speakerSize').value); const clickR = 60 * spkScale;
      if (Math.hypot(pos.x - spk1X, pos.y - spk1Y) <= clickR && document.getElementById('speakerStyle').value !== 'none') { isDraggingSpk1 = true; dragOffsetX = pos.x - spk1X; dragOffsetY = pos.y - spk1Y; if (e.cancelable) e.preventDefault(); return; }
      if (Math.hypot(pos.x - spk2X, pos.y - spk2Y) <= clickR && document.getElementById('speakerStyle').value !== 'none') { isDraggingSpk2 = true; dragOffsetX = pos.x - spk2X; dragOffsetY = pos.y - spk2Y; if (e.cancelable) e.preventDefault(); return; }
      if (pos.x >= visX && pos.x <= visX + visW && pos.y >= visY - 150 && pos.y <= visY + 150) { isDraggingVis = true; dragOffsetX = pos.x - visX; dragOffsetY = pos.y - visY; if (e.cancelable) e.preventDefault(); }
    }
    function drag(e) {
      if (!isDraggingVis && !isDraggingSpk1 && !isDraggingSpk2) return; const pos = getMousePos(e);
      if (isDraggingSpk1) { spk1X = pos.x - dragOffsetX; spk1Y = pos.y - dragOffsetY; if (e.cancelable) e.preventDefault(); return; }
      if (isDraggingSpk2) { spk2X = pos.x - dragOffsetX; spk2Y = pos.y - dragOffsetY; if (e.cancelable) e.preventDefault(); return; }
      if (isDraggingVis) { visX = pos.x - dragOffsetX; visY = pos.y - dragOffsetY; if (e.cancelable) e.preventDefault(); }
    }
    function endDrag() { isDraggingVis = false; isDraggingSpk1 = false; isDraggingSpk2 = false; }
    canvas.addEventListener('mousedown', startDrag); canvas.addEventListener('mousemove', drag); window.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', startDrag, { passive: false }); canvas.addEventListener('touchmove', drag, { passive: false }); window.addEventListener('touchend', endDrag);

    let audioCtx, source, mediaStreamDestination, analyser, dataArray; let isAudioInit = false; let peakHeights = new Array(120).fill(0);
    function formatTime(seconds) { if (isNaN(seconds) || !isFinite(seconds)) return "00:00"; const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }
    function initAudioContext() { const AudioContext = window.AudioContext || window.webkitAudioContext; audioCtx = new AudioContext(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.8; source = audioCtx.createMediaElementSource(audioPlayer); mediaStreamDestination = audioCtx.createMediaStreamDestination(); source.connect(analyser); analyser.connect(audioCtx.destination); analyser.connect(mediaStreamDestination); dataArray = new Uint8Array(analyser.frequencyBinCount); isAudioInit = true; }

    let isBgReady = false; let bgImageElement = new Image(); let bgGlobalScale = 1; let bgGlobalX = 0; let bgGlobalY = 0;
    document.getElementById('bgInput').addEventListener('change', function(e) { if (this.files[0]) { bgImageElement.src = URL.createObjectURL(this.files[0]); bgImageElement.onload = () => { isBgReady = true; statusBox.innerText = "✅ Foto Latar Oke."; }; } });

    audioPlayer.addEventListener('loadedmetadata', () => { if (isFinite(audioPlayer.duration)) { durTimeEl.innerText = formatTime(audioPlayer.duration); progressBar.max = 100; } });
    audioPlayer.addEventListener('timeupdate', () => { if (!isDraggingProgress && isFinite(audioPlayer.duration)) { progressBar.value = (audioPlayer.currentTime / audioPlayer.duration) * 100; currTimeEl.innerText = formatTime(audioPlayer.currentTime); } });
    progressBar.addEventListener('input', () => { isDraggingProgress = true; if (audioPlayer.duration) { const t = (progressBar.value / 100) * audioPlayer.duration; currTimeEl.innerText = formatTime(t); audioPlayer.currentTime = t; } });
    const releaseSeek = () => { isDraggingProgress = false; }; progressBar.addEventListener('change', releaseSeek); progressBar.addEventListener('touchend', releaseSeek); progressBar.addEventListener('mouseup', releaseSeek);

    function togglePlay() { if (!isTrackLoaded) { alert("Pilih Musik Dulu!"); return; } if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); if (audioPlayer.paused) { if (!audioPlayer.src) playRandomSong(true); else { audioPlayer.play(); playBtn.innerText = "⏸ PAUSE"; } } else { audioPlayer.pause(); playBtn.innerText = "▶ RESUME"; } }

    const config = { type: 'none', visType: 'elegant_piano', visHeight: 150, visOpacity: 1.0 };
    document.getElementById('visType').addEventListener('change', (e) => { config.visType = e.target.value; peakHeights.fill(0); });
    document.getElementById('visOpacity').addEventListener('input', (e) => config.visOpacity = parseFloat(e.target.value));
    document.getElementById('type').addEventListener('change', (e) => config.type = e.target.value);
    document.getElementById('visHeight').addEventListener('input', (e) => config.visHeight = parseInt(e.target.value));
    document.getElementById('visWidth').addEventListener('input', (e) => { visW = parseInt(e.target.value); visX = (width - visW) / 2; });

    let time = 0; let globalSmoothedBass = 0;
    function getSymmetricVal(index, totalItems, bufferLen) { try { if (!dataArray) return 0; const center = totalItems / 2; const centerDist = Math.abs(index - center) / center; const dataIdx = Math.floor(centerDist * (bufferLen * 0.6)); return dataArray[dataIdx] / 255; } catch (e) { return 0; } }

    // ==========================================
    // RENDER VISUALIZER
    // ==========================================
    function drawVisualizer(bufferLen, isReflection) {
      const style = config.visType;
      ctx.save(); 
      
      // LOGIKA KACA CERMIN: Kalau ini mode pantulan, balik kanvasnya!
      if (isReflection) {
          ctx.translate(0, visY);
          ctx.scale(1, -1);
          ctx.translate(0, -visY);
          ctx.globalAlpha = config.visOpacity * 0.45; // Kaca agak buram
      } else {
          ctx.globalAlpha = config.visOpacity;
      }
      
      ctx.translate(visX, visY); const cy = 0;
      
      try {
        if (style === 'elegant_piano') { let numBars = 52; let spacing = visW / numBars; let barW = spacing * 0.85; ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; for (let i = 0; i < numBars; i++) { let h = Math.max(10, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); ctx.fillRect(i * spacing, cy, barW, -h); ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(i * spacing, cy, barW, -h); ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; } }
        else if (style === 'cinematic_streaks') { let numBars = 40; let spacing = visW / numBars; for (let i = 0; i < numBars; i++) { let h = getSymmetricVal(i, numBars, bufferLen) * config.visHeight; let grad = ctx.createLinearGradient(0, cy, 0, cy - h); grad.addColorStop(0, 'rgba(255,255,255,0.8)'); grad.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = grad; ctx.fillRect(i * spacing + spacing/2 - 1, cy - h, 2, h); } }
        else if (style === 'ghost_ambient') { let numBars = 20; let spacing = visW / numBars; let barW = spacing * 0.9; for (let i = 0; i < numBars; i++) { let h = Math.max(10, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); ctx.fillStyle = 'rgba(255, 255, 255, 0.15)'; ctx.shadowBlur = 20; ctx.shadowColor = '#fff'; ctx.fillRect(i * spacing, cy - h, barW, h); } ctx.shadowBlur = 0; }
        else if (style === 'glitch_tech') { let numBars = 36; let spacing = visW / numBars; let barW = spacing * 0.7; ctx.fillStyle = '#fff'; for (let i = 0; i < numBars; i++) { let h = getSymmetricVal(i, numBars, bufferLen) * config.visHeight; if(h > 15) { ctx.fillRect(i * spacing, cy - h, barW, h); ctx.clearRect(i * spacing - 1, cy - h + Math.random()*h, barW + 2, Math.random()*5+2); } else { ctx.fillRect(i * spacing, cy - 2, barW, 2); } } }
        else if (style === 'diamond_eq') { let numBars = 30; let spacing = visW / numBars; ctx.fillStyle = 'rgba(255,255,255,0.8)'; for (let i = 0; i < numBars; i++) { let h = Math.max(5, getSymmetricVal(i, numBars, bufferLen) * (config.visHeight/2)); let cx = i * spacing + spacing/2; ctx.beginPath(); ctx.moveTo(cx, cy - h); ctx.lineTo(cx + spacing*0.4, cy); ctx.lineTo(cx, cy + h); ctx.lineTo(cx - spacing*0.4, cy); ctx.fill(); } }
        else if (style === 'particle_fountain') { let numBars = 45; let spacing = visW / numBars; for (let i = 0; i < numBars; i++) { let h = getSymmetricVal(i, numBars, bufferLen) * config.visHeight; ctx.fillStyle = `rgba(255,255,255,${0.2 + h/config.visHeight})`; ctx.beginPath(); ctx.arc(i * spacing + spacing/2, cy - h, Math.random()*2+1.5, 0, Math.PI*2); ctx.fill(); if(h > 20) { ctx.beginPath(); ctx.arc(i * spacing + spacing/2, cy - h + 15, Math.random()*1.5, 0, Math.PI*2); ctx.fill(); } } }
        else if (style === 'vintage_bars') { let numBars = 48; let spacing = visW / numBars; let barW = spacing * 0.7; ctx.fillStyle = 'rgba(245, 245, 240, 0.9)'; for (let i = 0; i < numBars; i++) { let h = Math.max(5, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); ctx.fillRect(i * spacing, -h, barW, h); } }
        else if (style === 'liquid_bar') { let numBars = 32; let spacing = visW / numBars; let barW = spacing * 0.6; for (let i = 0; i < numBars; i++) { let h = Math.max(10, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); ctx.fillStyle = '#00e5ff'; ctx.shadowBlur = 15; ctx.shadowColor = '#00e5ff'; ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(i * spacing, cy - h, barW, h, barW/2); else ctx.rect(i * spacing, cy - h, barW, h); ctx.fill(); } ctx.shadowBlur = 0; }
        else if (style === 'gradient_blocks') { let numBars = 40; let spacing = visW / numBars; for (let i = 0; i < numBars; i++) { let val = getSymmetricVal(i, numBars, bufferLen) * config.visHeight; let grad = ctx.createLinearGradient(0, cy, 0, cy - config.visHeight); grad.addColorStop(0, '#00c6ff'); grad.addColorStop(1, '#0072ff'); ctx.fillStyle = grad; ctx.fillRect(i * spacing, cy - val, spacing * 0.8, val); } }
        else if (style === 'sunset_bars') { let numBars = 40; let spacing = visW / numBars; let barW = spacing * 0.75; for (let i = 0; i < numBars; i++) { let h = Math.max(6, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); let grad = ctx.createLinearGradient(0, cy, 0, cy - config.visHeight); grad.addColorStop(0, '#ff3f34'); grad.addColorStop(0.5, '#ff7f50'); grad.addColorStop(1, '#fffa65'); ctx.fillStyle = grad; ctx.fillRect(i * spacing, -h, barW, h); } }
        else if (style === 'modern_wave') { ctx.beginPath(); ctx.moveTo(0, cy); let numPoints = 100; let spacing = visW / numPoints; for(let i=0; i<=numPoints; i++) { let val = getSymmetricVal(i, numPoints, bufferLen) * config.visHeight; let y = cy - val - (Math.sin(i*0.1 + time*5)*val*0.2); ctx.lineTo(i*spacing, y); } let grad = ctx.createLinearGradient(0, cy, visW, cy); grad.addColorStop(0, '#00d2ff'); grad.addColorStop(1, '#e040fb'); ctx.strokeStyle = grad; ctx.lineWidth = 3; ctx.stroke(); ctx.lineTo(visW, cy); ctx.lineTo(0, cy); ctx.fillStyle = 'rgba(0, 210, 255, 0.15)'; ctx.fill(); }
        else if (style === 'neon_lines') { let numBars = 24; let spacing = visW / numBars; let barW = 4; for(let i=0; i<numBars; i++) { let val = getSymmetricVal(i, numBars, bufferLen) * config.visHeight; ctx.fillStyle = '#00e5ff'; ctx.shadowBlur = 10; ctx.shadowColor = '#00e5ff'; ctx.fillRect(i*spacing + spacing/2, cy-val, barW, val); } ctx.shadowBlur = 0; }
        else if (style === 'ambient_glow') { let numBars = 30; let spacing = visW / numBars; for(let i=0; i<numBars; i++) { let val = getSymmetricVal(i, numBars, bufferLen) * config.visHeight; let grad = ctx.createRadialGradient(i*spacing, cy, 0, i*spacing, cy, val); grad.addColorStop(0, 'rgba(255,255,255,0.8)'); grad.addColorStop(1, 'rgba(255,255,255,0)'); ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(i*spacing, cy, val, Math.PI, Math.PI*2); ctx.fill(); } }
        else if (style === 'split_glow') { let numBars = 32; let spacing = visW / numBars; let barW = spacing*0.6; for(let i=0; i<numBars; i++) { let val = getSymmetricVal(i, numBars, bufferLen) * (config.visHeight/2); ctx.fillStyle = '#e040fb'; ctx.shadowBlur = 10; ctx.shadowColor = '#e040fb'; ctx.fillRect(i*spacing, cy-val-5, barW, val); ctx.fillRect(i*spacing, cy+5, barW, val); } ctx.shadowBlur = 0; }
        else { let numBars = 40; let spacing = visW / numBars; let barW = spacing * 0.7; ctx.fillStyle = '#fff'; for (let i = 0; i < numBars; i++) { let h = Math.max(5, getSymmetricVal(i, numBars, bufferLen) * config.visHeight); ctx.fillRect(i * spacing, -h, barW, h); } }
      } catch (e) {}
      ctx.restore();
    }

    // ==========================================
    // RENDER SPEAKER TRANSPARAN (GAK ADA BULAT HITAM)
    // ==========================================
    function drawSpeakers(bufferLen, isReflection) {
      if (!isBgReady || document.getElementById('speakerStyle').value === 'none') return;
      let scale = parseFloat(document.getElementById('speakerSize').value);
      let bassSum = 0; let bassCount = 8;
      if(dataArray) { for(let i = 1; i <= bassCount; i++) { bassSum += dataArray[i]; } }
      let rawBass = (bassSum / bassCount) / 255; if(isNaN(rawBass)) rawBass = 0; let punchyBass = Math.pow(rawBass, 2.0);
      
      // Update getaran bass cuma 1x (pas render aslinya aja, pantulan gak usah dihitung ulang biar sinkron)
      if(!isReflection) {
          if (punchyBass > globalSmoothedBass) { globalSmoothedBass += (punchyBass - globalSmoothedBass) * 0.8; } 
          else { globalSmoothedBass += (punchyBass - globalSmoothedBass) * 0.15; }
      }
      
      let bass = globalSmoothedBass; let baseR = 50 * scale; 
      let shakeIntensity = parseFloat(document.getElementById('speakerShake').value); 
      let pumpIntensity = parseFloat(document.getElementById('speakerPump').value);
      let shakeX = (Math.random() - 0.5) * bass * shakeIntensity; let shakeY = (Math.random() - 0.5) * bass * shakeIntensity; 
      let pump = 1.0 + (bass * pumpIntensity);

      function drawLiveBackgroundSpeaker(x, y) {
        ctx.save();
        if (isReflection) {
            ctx.translate(0, visY); ctx.scale(1, -1); ctx.translate(0, -visY); ctx.globalAlpha = 0.45; // Kaca memantulkan speaker
        }
        ctx.translate(x + shakeX, y + shakeY); ctx.beginPath(); ctx.arc(0, 0, baseR, 0, Math.PI * 2); ctx.clip(); ctx.scale(pump, pump);
        ctx.drawImage(bgImageElement, bgGlobalX - x, bgGlobalY - y, bgImageElement.width * bgGlobalScale, bgImageElement.height * bgGlobalScale);
        // FIX: Cincin hitam sepenuhnya dihapus dari sini. Full transparan clipping!
        ctx.restore();
      }
      drawLiveBackgroundSpeaker(spk1X, spk1Y); drawLiveBackgroundSpeaker(spk2X, spk2Y);
    }

    // ==========================================
    // EFEK FILM LAMA
    // ==========================================
    class SimpleFilmFX {
      constructor() { this.reset(); }
      reset() { this.x = Math.random() * width; this.y = Math.random() * height; this.life = Math.random() * 5 + 2; this.alpha = Math.random() * 0.5 + 0.1; }
      update() { this.life -= 1.0; if (this.life <= 0) this.reset(); }
      draw() {
        if (config.type === 'none') return;
        ctx.save(); ctx.translate(this.x, this.y);
        ctx.fillStyle = `rgba(255,255,255,${this.alpha*0.5})`; ctx.fillRect(0,0,2,2);
        ctx.restore();
      }
    }
    let particles = []; for (let i = 0; i < 150; i++) { particles.push(new SimpleFilmFX()); }

    function animate() {
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, width, height); time += 0.05; 
      ctx.save();
      
      // 1. GAMBAR BACKGROUND ASLI
      if (isBgReady) { 
        bgGlobalScale = Math.max(width / bgImageElement.width, height / bgImageElement.height); 
        bgGlobalX = (width / 2) - (bgImageElement.width / 2) * bgGlobalScale; 
        bgGlobalY = (height / 2) - (bgImageElement.height / 2) * bgGlobalScale; 
        ctx.drawImage(bgImageElement, bgGlobalX, bgGlobalY, bgImageElement.width * bgGlobalScale, bgImageElement.height * bgGlobalScale); 
      }
      
      // Update Audio Analyser
      if (isAudioInit && currentObjectUrl) {
        if (!audioPlayer.paused) analyser.getByteFrequencyData(dataArray); else for (let i = 0; i < dataArray.length; i++) dataArray[i] = Math.max(0, dataArray[i] - 10);
      }

      // 2. GAMBAR ELEMEN NORMAL (DI ATAS KACA)
      if (isAudioInit && currentObjectUrl) drawVisualizer(analyser.frequencyBinCount, false);
      drawSpeakers(128, false);

      // 3. GAMBAR ELEMEN REFLEKSI (PANTULAN KACA DI BAWAH)
      if (isAudioInit && currentObjectUrl) drawVisualizer(analyser.frequencyBinCount, true);
      drawSpeakers(128, true);

      // 4. BIKIN EFEK MEJA KACA GELAP DI BAWAHNYA (FADE TO BLACK)
      let mirrorGrad = ctx.createLinearGradient(0, visY, 0, height);
      mirrorGrad.addColorStop(0, 'rgba(0,0,0,0.15)'); // Agak terang pas nempel visualizer
      mirrorGrad.addColorStop(0.5, 'rgba(0,0,0,0.7)'); // Mulai gelap
      mirrorGrad.addColorStop(1, 'rgba(0,0,0,0.95)'); // Item pekat di ujung layar
      ctx.fillStyle = mirrorGrad;
      ctx.fillRect(0, visY, width, height - visY);
      
      // Tambah Garis Neon Tipis pembatas Meja Kaca
      ctx.beginPath(); ctx.moveTo(0, visY); ctx.lineTo(width, visY);
      let edgeGrad = ctx.createLinearGradient(0, 0, width, 0); edgeGrad.addColorStop(0, 'rgba(0,210,255,0)'); edgeGrad.addColorStop(0.5, 'rgba(0,210,255,0.4)'); edgeGrad.addColorStop(1, 'rgba(0,210,255,0)');
      ctx.strokeStyle = edgeGrad; ctx.lineWidth = 2; ctx.stroke();

      // 5. EFEK FILM KLASIK OVERLAY
      if (config.type === 'sepia_dust') { ctx.fillStyle = 'rgba(112, 66, 20, 0.2)'; ctx.fillRect(0, 0, width, height); } 
      else if (config.type === 'flicker_8mm') { let flicker = (Math.sin(time * 5) * 0.08) + (Math.random() * 0.05); if(flicker < 0) flicker = 0; ctx.fillStyle = `rgba(0, 0, 0, ${flicker})`; ctx.fillRect(0, 0, width, height); } 
      
      for (let i = 0; i < 150; i++) { particles[i].update(); particles[i].draw(); }

      ctx.restore(); requestAnimationFrame(animate);
    }
    animate();

    let mediaRecorder, chunks = []; let recordStartTime = 0;
    function startCountdownAndRecord() {
      if (!isAudioInit || !currentObjectUrl) { alert("Pilih dan siapkan musik dulu!"); return; }
      if (isCountingDown) { clearInterval(countdownTimer); isCountingDown = false; countdownOverlay.style.display = 'none'; recordBtn.innerText = "🔴 MULAI REKAM 720p"; return; }
      isCountingDown = true; let counter = 3; countdownOverlay.innerText = counter; countdownOverlay.style.display = 'block'; recordBtn.innerText = "❌ BATALKAN REKAM (" + counter + ")";
      countdownTimer = setInterval(() => { counter--; if (counter > 0) { countdownOverlay.innerText = counter; recordBtn.innerText = "❌ BATALKAN REKAM (" + counter + ")"; } else { clearInterval(countdownTimer); isCountingDown = false; countdownOverlay.style.display = 'none'; executeRecording(); } }, 1000);
    }

    function executeRecording() {
      if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) { window.Capacitor.Plugins.KeepAwake.keepAwake(); }
      audioPlayer.play(); playBtn.innerText = "⏸ PAUSE"; stopOverlay.style.display = 'block'; statusBox.innerText = "🔴 Merekam Video 720p..."; recordBtn.innerText = "🔴 SEDANG MEREKAM";
      const stream = canvas.captureStream(30); const combined = new MediaStream([...stream.getVideoTracks(), mediaStreamDestination.stream.getAudioTracks()[0]]);
      let options = { mimeType: 'video/webm;codecs=vp8,opus' }; if (!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/webm' }; }
      try { mediaRecorder = new MediaRecorder(combined, options); } catch (e) { mediaRecorder = new MediaRecorder(combined); }
      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); }; mediaRecorder.onstop = saveVideoWebM; chunks = []; recordStartTime = Date.now(); mediaRecorder.start();
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) window.Capacitor.Plugins.KeepAwake.allowSleep();
      audioPlayer.pause(); playBtn.innerText = "▶ PLAY"; stopOverlay.style.display = 'none'; recordBtn.innerText = "🔴 MULAI REKAM 720p"; statusBox.innerText = "Menyiapkan file video..."; if (playTimeout) clearTimeout(playTimeout);
    }

    function saveVideoWebM() {
      const blob = new Blob(chunks, { type: 'video/webm' }); const recordDuration = Date.now() - recordStartTime; statusBox.innerText = "⏳ Menjahit durasi (Biar bisa di-skip)...";
      if (typeof ysFixWebmDuration === 'function') { try { ysFixWebmDuration(blob, recordDuration, function(fixedBlob) { triggerDownload(fixedBlob); }, {logger: false}); } catch (error) { triggerDownload(blob); } } else { triggerDownload(blob); }
    }

    function triggerDownload(finalBlob) {
      statusBox.innerText = "⏳ Memproses pemotongan file video..."; const url = URL.createObjectURL(finalBlob);
      const oldVid = document.getElementById('previewVid'); if(oldVid) oldVid.remove(); const oldBtn = document.getElementById('shareBtnDewa'); if(oldBtn) oldBtn.remove();
      const vid = document.createElement('video'); vid.id = 'previewVid'; vid.src = url; vid.controls = true; vid.setAttribute('controlsList', 'nodownload'); vid.style.width = "100%"; vid.style.marginTop = "20px"; vid.style.border = "3px solid #00d2ff"; vid.style.borderRadius = "8px";
      const saveBtn = document.createElement('button'); saveBtn.id = 'shareBtnDewa'; saveBtn.innerText = "📥 SIMPAN VIDEO KE HP / PC"; saveBtn.style.width = "100%"; saveBtn.style.padding = "15px"; saveBtn.style.marginTop = "10px"; saveBtn.style.background = "linear-gradient(135deg, #00ffaa, #00bcd4)"; saveBtn.style.color = "black"; saveBtn.style.border = "none"; saveBtn.style.borderRadius = "8px"; saveBtn.style.fontWeight = "bold"; saveBtn.style.fontSize = "14px"; saveBtn.style.cursor = "pointer";
      let isSaving = false;
      saveBtn.onclick = async () => {
        if (isSaving) return; isSaving = true; saveBtn.innerText = "⏳ MEMULAI PROSES SIMPAN...";
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
            const FS = window.Capacitor.Plugins.Filesystem; const fileName = `Mirror_v1_720p_${Date.now()}.webm`; await FS.writeFile({ path: fileName, data: "", directory: 'DOCUMENTS' });
            const chunkSize = 1572864; const totalChunks = Math.ceil(finalBlob.size / chunkSize);
            for (let i = 0; i < totalChunks; i++) {
              const start = i * chunkSize; const end = Math.min(start + chunkSize, finalBlob.size); const chunk = finalBlob.slice(start, end);
              const base64Chunk = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(chunk); });
              await FS.appendFile({ path: fileName, data: base64Chunk, directory: 'DOCUMENTS' });
              const percent = Math.round(((i + 1) / totalChunks) * 100); statusBox.innerText = `⏳ Menulis ke memori HP... ${percent}%`; saveBtn.innerText = `⏳ MENYIMPAN... ${percent}%`;
            }
            saveBtn.innerText = "✅ TERSIMPAN DI DOCUMENTS HP!"; statusBox.innerText = `🎉 SUKSES! Video 720p tersimpan di folder Documents!`;
          } else {
            statusBox.innerText = "⏳ Mengunduh lewat Browser..."; const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `Mirror_v1_720p_${Date.now()}.webm`; document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); }, 100); saveBtn.innerText = "✅ VIDEO SUKSES DIUNDUH!"; statusBox.innerText = `🎉 SUKSES! Video berhasil diunduh ke perangkat Anda.`;
          }
        } catch(e) { saveBtn.innerText = "❌ GAGAL MENYIMPAN"; statusBox.innerText = "Terjadi Error: " + e.message; isSaving = false; }
      };
      const controlsDiv = document.getElementById('controls'); controlsDiv.appendChild(vid); controlsDiv.appendChild(saveBtn); saveBtn.scrollIntoView({ behavior: 'smooth' }); setTimeout(() => { if(!isSaving) saveBtn.click(); }, 1500);
    }
  </script>
