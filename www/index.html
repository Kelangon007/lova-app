<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mirror Studio Final 3D</title>
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.5/fix-webm-duration.js"></script>
  <style>
    :root { --cyan: #00bcd4; --cyan-glow: #00e5ff; --dark: #121212; --panel: #1a1a1a; --border: #333; }
    body { margin: 0; background-color: var(--dark); font-family: 'Segoe UI', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; overflow-x: hidden; }
    #canvas-wrapper { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; margin-top: 10px; background: #000; overflow: hidden; touch-action: none; border-bottom: 2px solid var(--border); }
    canvas { width: 100%; height: 100%; display: block; transform-origin: 0 0; }
    .zoom-toolbar { width: 96%; max-width: 800px; display: flex; align-items: center; justify-content: space-between; background: #151515; border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; margin-top: 8px; box-sizing: border-box; gap: 8px; }
    .zoom-toolbar label { font-size: 10px; color: var(--cyan); font-weight: bold; text-transform: uppercase; }
    .zoom-btn-group { display: flex; gap: 4px; }
    .btn-zoom { background: #2a2a2a; border: 1px solid #444; color: #ddd; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .btn-zoom.active { background: var(--cyan); color: #000; border-color: var(--cyan-glow); }
    #controls { width: 96%; max-width: 800px; padding: 10px 0; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; }
    #statusBox { font-size: 11px; text-align: center; color: #00ffaa; font-weight: 600; padding: 6px; background: #0a1f14; border-radius: 4px; border: 1px solid #004d26; }
    .btn-group { display: flex; gap: 8px; width: 100%; }
    .file-label { flex: 1; background: #1e1e1e; color: #ccc; padding: 10px; text-align: center; border-radius: 4px; cursor: pointer; font-size: 10px; font-weight: bold; border: 1px solid #444; transition: 0.2s; }
    .file-label:hover { background: #2a2a2a; color: white; }
    .play-group { display: flex; gap: 8px; width: 100%; }
    #playBtn { flex: 2; padding: 10px; background: #222; color: #888; border: 1px solid #333; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    #playBtn.ready { background: #1e1e1e; color: var(--cyan-glow); border: 1px solid var(--border); }
    #nextBtn { flex: 1; padding: 10px; background: #222; color: #888; border: 1px solid #333; border-radius: 4px; font-weight: bold; cursor: not-allowed; }
    #nextBtn.ready { background: #1e1e1e; color: white; border: 1px solid var(--border); cursor: pointer; }
    .progress-container { display: flex; align-items: center; gap: 8px; background: #1a1a1a; padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); }
    .time-text { font-size: 9px; font-family: monospace; color: var(--cyan); min-width: 32px; text-align: center; }
    #progressBar { flex: 1; height: 3px; -webkit-appearance: none; background: #333; border-radius: 3px; cursor: pointer; }
    #progressBar::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: var(--cyan-glow); border-radius: 50%; }
    .panel-block { border: 1px solid var(--border); background: var(--panel); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
    .panel-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-bottom: 1px solid transparent; padding-bottom: 4px; }
    .panel-header:hover { border-bottom: 1px solid #333; }
    .panel-title { font-size: 9px; color: var(--cyan); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
    .col-title { font-size: 9px; color: #ffb300; font-weight: bold; text-transform: uppercase; margin: 0; }
    .btn-lock { background: #222; border: 1px solid #444; color: #888; font-size: 8px; padding: 3px 6px; border-radius: 4px; font-weight: bold; transition: 0.2s; pointer-events: none; }
    .panel-content { display: flex; flex-direction: column; gap: 8px; }
    .panel-content.hidden { display: none; }
    .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
    .col-box { display: flex; flex-direction: column; gap: 6px; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    .row label { font-size: 8px; color: #aaa; font-weight: 600; text-transform: uppercase; width: 35%; }
    input[type="range"] { width: 60%; height: 20px; background: transparent; -webkit-appearance: none; appearance: none; }
    input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 3px; background: #333; border-radius: 2px; }
    input[type="range"]::-webkit-slider-thumb { height: 12px; width: 12px; border-radius: 50%; background: #007bff; cursor: pointer; -webkit-appearance: none; margin-top: -4.5px; }
    select { width: 60%; height: 22px; background: #222; color: white; border: 1px solid #444; border-radius: 4px; font-size: 9px; padding: 0 4px; outline: none; }
    input[type="file"] { display: none; }
    .rec-btn { width: 100%; padding: 12px; background: #d32f2f; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; margin-top: 5px; text-transform: uppercase; }
    #recIndicator { display: none; position: absolute; top: 15px; right: 15px; background: red; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 10px; animation: blink 1s infinite; z-index: 10; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="canvas-wrapper">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="countdownOverlay" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:100px; font-weight:bold; color:white; z-index:100;">3</div>
    <div id="stopOverlay" style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(220,20,60,0.95); color:white; padding:15px 30px; border-radius:50px; z-index:100; font-weight:bold; cursor:pointer;" onclick="stopRecording()">⏹ STOP & SIMPAN</div>
    <div id="recIndicator">⏺ REC</div>
  </div>

  <div class="zoom-toolbar">
    <label>🔍 Zoom Kanvas</label>
    <input type="range" id="canvasZoomSlider" min="1.0" max="3.0" step="0.1" value="1.0" style="width: 45%;">
    <div class="zoom-btn-group">
      <button class="btn-zoom active" id="zoomBtn1" onclick="setCanvasZoom(1.0)">1x</button>
      <button class="btn-zoom" id="zoomBtn2" onclick="setCanvasZoom(1.8)">1.8x</button>
      <button class="btn-zoom" id="zoomBtn3" onclick="setCanvasZoom(2.6)">2.6x</button>
    </div>
  </div>

  <div id="controls">
    <div id="statusBox">Siap - Mirror Studio Final 3D</div>
    <div class="btn-group">
      <label for="bgInput" class="file-label" style="border-bottom: 2px solid #ffb300;">1. FOTO LATAR</label>
      <label for="audioInput" class="file-label" style="border-bottom: 2px solid var(--cyan);">2. MUSIK</label>
    </div>
    <div class="play-group">
      <button id="playBtn" onclick="togglePlay()">⚠ PUTAR MUSIK</button>
      <button id="nextBtn" onclick="playRandomSong(false)">⏭ NEXT</button>
    </div>
    <div class="progress-container">
      <span id="currTime" class="time-text">00:00</span>
      <input type="range" id="progressBar" value="0" min="0" step="0.1">
      <span id="durTime" class="time-text">00:00</span>
    </div>

    <!-- PANEL 1 -->
    <div class="panel-block">
        <div class="panel-header" onclick="togglePanel(this)"><div class="panel-title">VISUALIZER 3D</div><div class="btn-lock">🔒 LIPAT</div></div>
        <div class="panel-content">
            <select id="visType" style="width:100%; margin-bottom: 6px;">
                <option value="liquid_bar" selected>💧 21. Liquid Glowing Cyan</option>
                <option value="cyber_pulse">⚡ 22. Neon Pulse Bars</option>
                <option value="mirror_bars">🪞 23. Mirrored Glass Bars</option>
                <option value="vintage_bars">📊 1. Vintage Solid Bars</option>
                <option value="winamp_classic">📻 2. Winamp Peaks</option>
                <option value="classic_eq">🎙️ 3. Classic Green-Red EQ</option>
                <option value="step_eq">🧱 4. Step Block EQ</option>
                <option value="thin_eq">📏 5. Thin Minimalist EQ</option>
                <option value="dotted_eq">⏺️ 11. Dotted Peak EQ</option>
                <option value="led_matrix">🚥 12. LED Dot Matrix</option>
                <option value="modern_wave">🌊 31. Modern Smooth Wave</option>
                <option value="double_wave">〰️ 33. Double Layer Wave</option>
                <option value="hologram_grid">🧊 41. Hologram 3D Grid</option>
                <option value="aurora_borealis">🌌 46. Aurora Borealis Glow</option>
                <option value="classic_spectrum">🌈 51. Classic Spectrum Analyzer</option>
            </select>
            <div class="grid-2col">
                <div class="col-box">
                    <div class="row"><label style="color:#00e5ff;">TINGGI</label><input type="range" id="visHeight" min="30" max="600" value="150"></div>
                    <div class="row"><label style="color:#00e5ff;">SUDUT</label><input type="range" id="visRot" min="-90" max="90" step="1" value="0"></div>
                    <div class="row"><label style="color:#00e5ff;">SKEW Y</label><input type="range" id="visSkewY" min="-45" max="45" step="1" value="0"></div>
                    <div class="row"><label style="color:#00e5ff;">SKALA X</label><input type="range" id="visScaleX" min="0.1" max="3.0" step="0.05" value="1.0"></div>
                </div>
                <div class="col-box">
                    <div class="row"><label>LEBAR</label><input type="range" id="visWidth" min="100" max="1100" value="400"></div>
                    <div class="row"><label>OPASITAS</label><input type="range" id="visOpacity" min="0.1" max="1.0" step="0.05" value="1.0"></div>
                    <div class="row"><label>SKALA Y</label><input type="range" id="visScaleY" min="0.1" max="3.0" step="0.05" value="1.0"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PANEL 2 -->
    <div class="grid-2col">
        <div class="panel-block">
            <div class="panel-header" onclick="togglePanel(this)"><div class="col-title">DAUN SPEAKER L</div><div class="btn-lock">🔒 LIPAT</div></div>
            <div class="panel-content">
                <div class="row"><label>SAKLAR</label><select id="speakerStyle"><option value="active">🟢 Nyala</option><option value="none">🚫 Mati</option></select></div>
                <div class="row"><label>UK. LUAR</label><input type="range" id="spkL_out" min="20" max="300" value="120"></div>
                <div class="row"><label>UK. DALAM</label><input type="range" id="spkL_in" min="10" max="250" value="50"></div>
                <div class="row"><label>GESER X</label><input type="range" id="spkL_x" min="-150" max="150" value="0"></div>
                <div class="row"><label>GESER Y</label><input type="range" id="spkL_y" min="-150" max="150" value="0"></div>
            </div>
        </div>
        <div class="panel-block">
            <div class="panel-header" onclick="togglePanel(this)"><div class="col-title">DAUN SPEAKER R</div><div class="btn-lock">🔒 LIPAT</div></div>
            <div class="panel-content">
                <div class="row"><label>GRS BANTU</label><select id="showGuides"><option value="yes">Nyala</option><option value="no">Mati</option></select></div>
                <div class="row"><label>UK. LUAR</label><input type="range" id="spkR_out" min="20" max="300" value="120"></div>
                <div class="row"><label>UK. DALAM</label><input type="range" id="spkR_in" min="10" max="250" value="50"></div>
                <div class="row"><label>GESER X</label><input type="range" id="spkR_x" min="-150" max="150" value="0"></div>
                <div class="row"><label>GESER Y</label><input type="range" id="spkR_y" min="-150" max="150" value="0"></div>
            </div>
        </div>
    </div>
    <div class="grid-2col" style="padding: 0 5px;">
        <div class="row"><label style="color:#ff5252;">GETARAN</label><input type="range" id="speakerShake" min="0" max="40" step="1" value="10"></div>
        <div class="row"><label style="color:#ff5252;">DENTUMAN</label><input type="range" id="speakerPump" min="0" max="3.0" step="0.1" value="1.0"></div>
    </div>

    <!-- PANEL 3 -->
    <div class="grid-2col">
        <div class="panel-block">
            <div class="panel-header" onclick="togglePanel(this)"><div class="col-title" style="color:#00e5ff;">PERSPEK. KIRI</div><div class="btn-lock">🔒 LIPAT</div></div>
            <div class="panel-content">
                <div class="row"><label>BLUR (SOFT)</label><input type="range" id="maskSoftness" min="0.1" max="0.95" step="0.05" value="0.5"></div>
                <div class="row"><label style="color:#00ffaa;">GESER BLUR</label>
                    <input type="range" id="spkL_mask_x" min="-150" max="150" step="1" value="0" style="width:23%;">
                    <input type="range" id="spkL_mask_y" min="-150" max="150" step="1" value="0" style="width:23%; margin-left:4%;">
                </div>
                <div class="row"><label>OVAL (X/Y)</label>
                    <input type="range" id="spkOvalX1" min="0.1" max="2.0" step="0.05" value="1.0" style="width:23%;">
                    <input type="range" id="spkOvalY1" min="0.1" max="2.0" step="0.05" value="1.0" style="width:23%; margin-left:4%;">
                </div>
                <div class="row"><label style="color:#ffeb3b;">SKEW (X/Y)</label>
                    <input type="range" id="spkSkewX1" min="-45" max="45" step="1" value="0" style="width:23%;">
                    <input type="range" id="spkSkewY1" min="-45" max="45" step="1" value="0" style="width:23%; margin-left:4%;">
                </div>
                <div class="row"><label>SUDUT</label><input type="range" id="spkRot1" min="-90" max="90" step="1" value="0"></div>
            </div>
        </div>
        <div class="panel-block">
            <div class="panel-header" onclick="togglePanel(this)"><div class="col-title" style="color:#00e5ff;">PERSPEK. KANAN</div><div class="btn-lock">🔒 LIPAT</div></div>
            <div class="panel-content">
                <div class="row"><label>EFEK 3D</label>
                    <select id="effect3D" style="width:23%;"><option value="yes">Nyala</option><option value="no">Mati</option></select>
                    <input type="range" id="depth3D" min="0.1" max="1.5" step="0.1" value="0.8" style="width:33%; margin-left:4%;">
                </div>
                <div class="row"><label style="color:#00ffaa;">GESER BLUR</label>
                    <input type="range" id="spkR_mask_x" min="-150" max="150" step="1" value="0" style="width:23%;">
                    <input type="range" id="spkR_mask_y" min="-150" max="150" step="1" value="0" style="width:23%; margin-left:4%;">
                </div>
                <div class="row"><label>OVAL (X/Y)</label>
                    <input type="range" id="spkOvalX2" min="0.1" max="2.0" step="0.05" value="1.0" style="width:23%;">
                    <input type="range" id="spkOvalY2" min="0.1" max="2.0" step="0.05" value="1.0" style="width:23%; margin-left:4%;">
                </div>
                <div class="row"><label style="color:#ffeb3b;">SKEW (X/Y)</label>
                    <input type="range" id="spkSkewX2" min="-45" max="45" step="1" value="0" style="width:23%;">
                    <input type="range" id="spkSkewY2" min="-45" max="45" step="1" value="0" style="width:23%; margin-left:4%;">
                </div>
                <div class="row"><label>SUDUT</label><input type="range" id="spkRot2" min="-90" max="90" step="1" value="0"></div>
            </div>
        </div>
    </div>

    <!-- PANEL 4 -->
    <div class="grid-2col">
        <div class="panel-block" style="border-color:#00bcd4;">
            <div class="panel-header" onclick="togglePanel(this)"><div class="col-title" style="color:#00bcd4;">SAKLAR KACA</div><div class="btn-lock">🔒 LIPAT</div></div>
            <div class="panel-content">
                <div class="row"><label>GRS MEJA</label><select id="showGlassLine"><option value="yes">Nyala</option><option value="no">Mati</option></select></div>
                <div class="row"><label>PANT. VIS</label><select id="showVisReflect"><option value="yes">Nyala</option><option value="no">Mati</option></select></div>
                <div class="row"><label>PANT. SPK</label><select id="showSpkReflect"><option value="yes">Nyala</option><option value="no">Mati</option></select></div>
                <div class="row"><label>PANT. LILIN</label><select id="showCandleReflect"><option value="yes">Nyala</option><option value="no">Mati</option></select></div>
            </div>
        </div>
        <div class="panel-block" style="border-color:#00bcd4;">
            <div class="panel-header" onclick="togglePanel(this)"><div class="col-title" style="color:#00bcd4;">SETTING KACA</div><div class="btn-lock">🔒 LIPAT</div></div>
            <div class="panel-content">
                <div class="row"><label>POTONG SPK</label><input type="range" id="spkReflectCrop" min="10" max="100" value="100"></div>
                <div class="row"><label>OPASITAS</label><input type="range" id="spkReflectOpacity" min="0.1" max="1.0" step="0.05" value="0.45"></div>
                <div class="row"><label>UKURAN</label><input type="range" id="spkReflectSize" min="0.1" max="2.0" step="0.1" value="1.0"></div>
            </div>
        </div>
    </div>

    <!-- PANEL 5 -->
    <div class="grid-2col">
        <div class="panel-block">
            <div class="panel-header" onclick="togglePanel(this)"><div class="col-title" style="color:#d7ccc8;">ASAP KOPI</div><div class="btn-lock">🔒 LIPAT</div></div>
            <div class="panel-content">
                <select id="coffeeStyle" style="width:100%; margin-bottom:4px;"><option value="none">🚫 Tanpa Asap</option><option value="soft_steam">☕ 1. Soft Warm Steam</option><option value="swirl_vapor">🌪️ 2. Swirling Vapor</option></select>
                <div class="row"><label>UKURAN</label><input type="range" id="propSize" min="0.2" max="5.0" step="0.1" value="1.0"></div>
                <div class="row"><label>TEBAL</label><input type="range" id="smokeOpacity" min="0.1" max="4.0" step="0.1" value="1.2"></div>
            </div>
        </div>
        <div class="panel-block">
            <div class="panel-header" onclick="togglePanel(this)"><div class="col-title" style="color:#ff8a65;">API LILIN</div><div class="btn-lock">🔒 LIPAT</div></div>
            <div class="panel-content">
                <select id="candleStyle" style="width:100%; margin-bottom:4px;"><option value="none">🚫 Tanpa Lilin</option><option value="calm_flame">🕯️ 1. Calm Warm</option><option value="flicker_flame">🕯️ 2. Flickering</option></select>
                <div class="row"><label>KCPTN</label><input type="range" id="propSpeed" min="0.1" max="5.0" step="0.1" value="1.0"></div>
            </div>
        </div>
    </div>

    <button class="rec-btn" id="recordBtn" onclick="startCountdownAndRecord()">MULAI REKAM 720p</button>
    <input type="file" id="bgInput" accept="image/*">
    <input type="file" id="audioInput" accept="audio/*" multiple>
  </div>
  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    function togglePanel(header) { const content = header.nextElementSibling; const btn = header.querySelector('.btn-lock'); if (content.classList.contains('hidden')) { content.classList.remove('hidden'); btn.innerText = "🔒 LIPAT"; btn.style.background = "#222"; btn.style.color = "#888"; btn.style.borderColor = "#444"; } else { content.classList.add('hidden'); btn.innerText = "👁️ BUKA"; btn.style.background = "var(--cyan)"; btn.style.color = "#000"; btn.style.borderColor = "var(--cyan-glow)"; } }
    const statusBox = document.getElementById('statusBox'); const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d');
    const bufferCanvas = document.createElement('canvas'); bufferCanvas.width = 1280; bufferCanvas.height = 720; const bCtx = bufferCanvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvas-wrapper'); const audioPlayer = document.getElementById('audioPlayer'); const playBtn = document.getElementById('playBtn'); const nextBtn = document.getElementById('nextBtn'); const recordBtn = document.getElementById('recordBtn'); const progressBar = document.getElementById('progressBar'); const currTimeEl = document.getElementById('currTime'); const durTimeEl = document.getElementById('durTime');
    let isDraggingProgress = false; const width = 1280; const height = 720; let audioFiles = []; let currentObjectUrl = null; let currentSongName = ""; let playTimeout = null; let isTrackLoaded = false; let shuffledPlaylist = []; let currentPlayIndex = 0; let isCountingDown = false; let countdownTimer = null; let bgGlobalScale = 1; let bgGlobalX = 0; let bgGlobalY = 0; let canvasZoom = 1.0; let canvasPanX = 0; let canvasPanY = 0; let isPanningCanvas = false; let panStartX = 0; let panStartY = 0; let isPinching = false; let initialPinchDist = 0; let initialPinchZoom = 1.0;

    const zoomSlider = document.getElementById('canvasZoomSlider'); zoomSlider.addEventListener('input', (e) => { setCanvasZoom(parseFloat(e.target.value)); });
    function setCanvasZoom(val) { canvasZoom = Math.min(3.5, Math.max(1.0, val)); zoomSlider.value = canvasZoom.toFixed(1); document.querySelectorAll('.btn-zoom').forEach(b => b.classList.remove('active')); if (Math.abs(canvasZoom - 1.0) < 0.1) document.getElementById('zoomBtn1').classList.add('active'); else if (Math.abs(canvasZoom - 1.8) < 0.2) document.getElementById('zoomBtn2').classList.add('active'); else if (Math.abs(canvasZoom - 2.6) < 0.2) document.getElementById('zoomBtn3').classList.add('active'); clampPan(); applyCanvasTransform(); }
    function clampPan() { const w = canvasWrapper.clientWidth; const h = canvasWrapper.clientHeight; if (canvasZoom <= 1.0) { canvasPanX = 0; canvasPanY = 0; } else { const minPanX = w * (1 - canvasZoom); const minPanY = h * (1 - canvasZoom); canvasPanX = Math.min(0, Math.max(minPanX, canvasPanX)); canvasPanY = Math.min(0, Math.max(minPanY, canvasPanY)); } }

    }

    function drawCandle(x, y, refY, style, scale, propSpeed, isReflection) { if(style === 'none') return; ctx.save(); if (isReflection) { if (mirrorConfig.showCandleReflect === 'no') { ctx.restore(); return; } ctx.translate(x, refY); ctx.scale(1, -1); ctx.globalAlpha = 0.45; } else { ctx.translate(x, y); } ctx.scale(scale, scale); let t = time * 2 * propSpeed; let flicker = 0; let sway = 0; let h = 65; let w = 16; let baseColor = 'rgba(255, 140, 0, 0.8)'; let midColor = 'rgba(255, 210, 0, 0.9)'; let coreColor = 'rgba(255, 255, 255, 0.95)'; if(style === 'calm_flame') { flicker = Math.sin(t*3)*2; sway = Math.sin(t)*1; } else if(style === 'flicker_flame') { flicker = Math.sin(t*10)*4 + Math.random()*2; sway = Math.sin(t*5)*3; } ctx.beginPath(); ctx.arc(0, -h*0.5, w*3, 0, Math.PI*2); let gradGlow = ctx.createRadialGradient(0,-h*0.5,0, 0,-h*0.5,w*4); gradGlow.addColorStop(0, 'rgba(255, 120, 0, 0.25)'); gradGlow.addColorStop(1, 'rgba(255, 120, 0, 0)'); ctx.fillStyle = gradGlow; ctx.fill(); ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(sway*0.05, -8); ctx.lineWidth = 3; ctx.strokeStyle = '#111'; ctx.stroke(); ctx.beginPath(); ctx.moveTo(sway*0.05, -8); ctx.lineTo(sway*0.1, -12); ctx.lineWidth = 2; ctx.strokeStyle = '#ff5722'; ctx.stroke(); function drawFlame(fw, fh, fsway, color) { ctx.beginPath(); ctx.moveTo(0, 2); ctx.bezierCurveTo(fw, 2, fw*0.9, -fh*0.4, fsway, -fh); ctx.bezierCurveTo(-fw*0.9, -fh*0.4, -fw, 2, 0, 2); ctx.fillStyle = color; ctx.fill(); } drawFlame(w, h + flicker, sway, baseColor); drawFlame(w*0.7, (h + flicker)*0.75, sway*0.7, midColor); drawFlame(w*0.35, (h + flicker)*0.45, sway*0.3, coreColor); ctx.restore(); }

    function animate() {
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, width, height); time += 0.05; ctx.save();
      if (isBgReady) { bgGlobalScale = Math.max(width / bgImageElement.width, height / bgImageElement.height); bgGlobalX = (width / 2) - (bgImageElement.width / 2) * bgGlobalScale; bgGlobalY = (height / 2) - (bgImageElement.height / 2) * bgGlobalScale; ctx.drawImage(bgImageElement, bgGlobalX, bgGlobalY, bgImageElement.width * bgGlobalScale, bgImageElement.height * bgGlobalScale); }
      if (isAudioInit && currentObjectUrl) { if (!audioPlayer.paused && !audioPlayer.ended) { analyser.getByteFrequencyData(dataArray); } else { for (let i = 0; i < dataArray.length; i++) { dataArray[i] = dataArray[i] > 5 ? dataArray[i] - 5 : 0; } } }

      drawCandle(candle1X, candle1Y, candle1RefY, document.getElementById('candleStyle')?.value || 'none', propScale, propSpeed, true); 
      drawCandle(candle2X, candle2Y, candle2RefY, document.getElementById('candleStyle')?.value || 'none', propScale, propSpeed, true);
      if (mirrorConfig.showGlassLine === 'yes' || mirrorConfig.showVisReflect === 'yes' || mirrorConfig.showSpkReflect === 'yes' || mirrorConfig.showCandleReflect === 'yes') { let mirrorGrad = ctx.createLinearGradient(0, mirrorY, 0, height); mirrorGrad.addColorStop(0, 'rgba(0,0,0,0.15)'); mirrorGrad.addColorStop(0.5, 'rgba(0,0,0,0.7)'); mirrorGrad.addColorStop(1, 'rgba(0,0,0,0.95)'); ctx.fillStyle = mirrorGrad; ctx.fillRect(0, mirrorY, width, height - mirrorY); }
      drawCoffeeSteam(coffeeX, coffeeY, document.getElementById('coffeeStyle')?.value || 'none', propScale, propSpeed);

    animate();

    let mediaRecorder, chunks = []; let recordStartTime = 0;
    function startCountdownAndRecord() { if (!isAudioInit || !currentObjectUrl) { alert("Pilih musik dulu!"); return; } if (isCountingDown) { clearInterval(countdownTimer); isCountingDown = false; document.getElementById('countdownOverlay').style.display = 'none'; document.getElementById('recordBtn').innerText = "MULAI REKAM 720p"; return; } isCountingDown = true; let counter = 3; document.getElementById('countdownOverlay').innerText = counter; document.getElementById('countdownOverlay').style.display = 'block'; document.getElementById('recordBtn').innerText = "BATALKAN (" + counter + ")"; countdownTimer = setInterval(() => { counter--; if (counter > 0) { document.getElementById('countdownOverlay').innerText = counter; document.getElementById('recordBtn').innerText = "BATALKAN (" + counter + ")"; } else { clearInterval(countdownTimer); isCountingDown = false; document.getElementById('countdownOverlay').style.display = 'none'; executeRecording(); } }, 1000); }

    function triggerDownload(finalBlob) { statusBox.innerText = "⏳ Memproses file video..."; const url = URL.createObjectURL(finalBlob); const oldVid = document.getElementById('previewVid'); if(oldVid) oldVid.remove(); const oldBtn = document.getElementById('shareBtnDewa'); if(oldBtn) oldBtn.remove(); const vid = document.createElement('video'); vid.id = 'previewVid'; vid.src = url; vid.controls = true; vid.setAttribute('controlsList', 'nodownload'); vid.style.width = "100%"; vid.style.marginTop = "20px"; vid.style.border = "3px solid #00bcd4"; vid.style.borderRadius = "8px"; const saveBtn = document.createElement('button'); saveBtn.id = 'shareBtnDewa'; saveBtn.innerText = "📥 SIMPAN KE DOKUMEN"; saveBtn.style.width = "100%"; saveBtn.style.padding = "15px"; saveBtn.style.marginTop = "10px"; saveBtn.style.background = "linear-gradient(135deg, #00bcd4, #00e5ff)"; saveBtn.style.color = "black"; saveBtn.style.border = "none"; saveBtn.style.borderRadius = "8px"; saveBtn.style.fontWeight = "bold"; saveBtn.style.fontSize = "14px"; saveBtn.style.cursor = "pointer"; let isSaving = false; saveBtn.onclick = async () => { if (isSaving) return; isSaving = true; saveBtn.innerText = "⏳ MENYIMPAN..."; const downloadBrowser = () => { statusBox.innerText = "⏳ Mengunduh..."; const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `Mirror_${Date.now()}.webm`; document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); }, 100); saveBtn.innerText = "✅ SUKSES!"; statusBox.innerText = `🎉 Berhasil.`; }; try { if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) { const FS = window.Capacitor.Plugins.Filesystem; try { let perm = await FS.checkPermissions(); if (perm.publicStorage !== 'granted' && perm.publicStorage !== 'authorized') await FS.requestPermissions(); } catch(e) {} const fileName = `Mirror_${Date.now()}.webm`; try { await FS.writeFile({ path: fileName, data: "", directory: 'DOCUMENTS' }); const chunkSize = 1572864; const totalChunks = Math.ceil(finalBlob.size / chunkSize); for (let i = 0; i < totalChunks; i++) { const start = i * chunkSize; const end = Math.min(start + chunkSize, finalBlob.size); const chunk = finalBlob.slice(start, end); const base64Chunk = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(chunk); }); await FS.appendFile({ path: fileName, data: base64Chunk, directory: 'DOCUMENTS' }); const percent = Math.round(((i + 1) / totalChunks) * 100); statusBox.innerText = `⏳ Menulis... ${percent}%`; saveBtn.innerText = `⏳ ${percent}%`; } saveBtn.innerText = "✅ TERSIMPAN!"; statusBox.innerText = `🎉 SUKSES!`; } catch(fsError) { downloadBrowser(); } } else { downloadBrowser(); } } catch(e) { try { downloadBrowser(); } catch(err2) { saveBtn.innerText = "❌ GAGAL"; statusBox.innerText = "Error: " + e.message; isSaving = false; } } }; const controlsDiv = document.getElementById('controls'); controlsDiv.appendChild(vid); controlsDiv.appendChild(saveBtn); saveBtn.scrollIntoView({ behavior: 'smooth' }); setTimeout(() => { if(!isSaving && window.Capacitor) saveBtn.click(); }, 1500); }
