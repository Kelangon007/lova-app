<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bass Jazz (Final Realistic Edition)</title>
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.5/fix-webm-duration.js"></script>
  <style>
    body { margin: 0; background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%); background-size: 20px 20px; background-color: #333; font-family: 'Segoe UI', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; touch-action: pan-y; }
    #canvas-wrapper { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.3); background: transparent; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8); cursor: grab; overflow: hidden; }
    #canvas-wrapper:active { cursor: grabbing; }
    canvas { width: 100%; height: 100%; display: block; }
    #controls { width: 90%; max-width: 600px; background: #1a1a1a; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #333; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); }
    .btn-group, .play-group { display: flex; gap: 8px; }
    .file-label { flex: 1; background: #2b2b2b; color: #ccc; padding: 12px 5px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; border: 1px solid #444; transition: 0.2s; white-space: nowrap; }
    .file-label:hover { background: #3b3b3b; color: white; }
    #playBtn { flex: 2; padding: 15px; background: #333; color: #888; border: 1px solid #222; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    #playBtn.ready { background: linear-gradient(135deg, #d4af37, #f39c12); color: #111; border: none; }
    #nextBtn { flex: 1; padding: 15px; background: #444; color: #aaa; border: 1px solid #333; border-radius: 8px; font-weight: bold; cursor: not-allowed; transition: 0.3s; }
    #nextBtn.ready { background: #2a2a2a; color: white; border: 1px solid #555; cursor: pointer; }
    .progress-container { display: flex; align-items: center; gap: 10px; background: #222; padding: 8px; border-radius: 6px; border: 1px solid #333; }
    .time-text { font-size: 11px; font-family: monospace; color: #d4af37; min-width: 40px; text-align: center; }
    #progressBar { flex: 1; height: 5px; -webkit-appearance: none; background: #444; border-radius: 5px; cursor: pointer; }
    #progressBar::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; background: #f39c12; border-radius: 50%; cursor: pointer; }
    .btn-record { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff4444, #d32f2f); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #stopOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(220, 20, 60, 0.95); color: white; padding: 15px 30px; border-radius: 50px; z-index: 100; font-weight: bold; border: 3px solid white; cursor: pointer; }
    #countdownOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: bold; color: white; text-shadow: 0 0 20px rgba(0, 0, 0, 0.8); z-index: 100; }
    #statusBox { font-size: 12px; text-align: center; color: #d4af37; margin-bottom: 5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; align-items: center; gap: 10px; }
    label { font-size: 11px; width: 80px; color: #ccc; font-weight: 600; }
    input[type="range"], select { flex: 1; height: 36px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 6px; }
    input[type="file"] { display: none; }
    optgroup { background: #111; color: #d4af37; font-weight: bold; }

    /* MENU BERSAMPINGAN (UI BARU) */
    .layout-grid { display: flex; gap: 15px; width: 100%; box-sizing: border-box; }
    .layout-col { flex: 1; background: #222; padding: 12px; border-radius: 8px; border: 1px solid #3c3c3c; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box; }
    .layout-col label { width: 100%; text-align: left; font-size: 10px; margin-bottom: -4px; color: #aaa; font-weight: bold; }
    .layout-col select, .layout-col input[type="range"] { width: 100%; margin-bottom: 5px; }

    /* PALET WARNA BULAT & TOGGLE */
    .swatch { width: 18px; height: 18px; border-radius: 50%; cursor: pointer; border: 2px solid #555; transition: 0.2s; }
    .swatch:hover { border: 2px solid #fff; transform: scale(1.2); }
    .toggle-color-btn { width: 100%; padding: 8px; background: #333; color: #ffb300; border: 1px solid #555; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; transition: 0.2s; }
    .toggle-color-btn:hover { background: #444; }

    /* TOMBOL FALLBACK MANUAL DOWNLOAD */
    #manualLinkBtn { display: block; width: 100%; box-sizing: border-box; text-align: center; padding: 15px; margin-top: 10px; background: #333; color: #fff; border: 1px solid #555; border-radius: 8px; font-weight: bold; font-size: 14px; text-decoration: none; cursor: pointer; transition: 0.3s; }
    #manualLinkBtn:hover { background: #444; }
  </style>
</head>

<body>

  <div id="canvas-wrapper">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="countdownOverlay">3</div>
    <div id="stopOverlay" onclick="stopRecording()">⏹ STOP & SIMPAN</div>
  </div>

  <div id="controls">

    <input type="file" id="bgInput" accept="image/*">

            </optgroup>

                <option value="retro_oscilloscope">📺 14. CRT Oscilloscope</option>
                <option value="peak_line">〰️ 15. Floating Peak Line</option>
                <option value="peak_dots_only">⚪ 16. Floating Dots Peak</option>
                <option value="dash_bars">➖ 17. Dashed Segment Bars</option>
                <option value="meter_blocks">📶 18. Meter Blocks</option>

            </optgroup>

                <option value="cyber_pulse">⚡ 22. Neon Pulse Bars</option>
                <option value="mirror_bars">🪞 23. Mirrored Glass Bars</option>
                <option value="gradient_blocks">🎛️ 24. Cyan-Blue Gradient</option>
                <option value="sunset_bars">🌅 25. Warm Sunset Gradient</option>
                <option value="emerald_bars">💎 26. Emerald Green Grad</option>
                <option value="purple_haze">🟣 27. Purple-Pink Soft</option>
                <option value="gold_classic">👑 28. Golden Elegant EQ</option>
                <option value="monochrome_fade">🎞️ 29. Grayscale Fading</option>
                <option value="dual_tone">🌗 30. Dual Tone Top-Bot</option>

            <optgroup label="=== WAVES & LINES ===">

                <option value="filled_wave">🌊 32. Filled Ambient Wave</option>
                <option value="double_wave">〰️ 33. Double Layer Wave</option>
                <option value="thin_wave">✒️ 34. Ultra Thin Line</option>
                <option value="shadow_wave">🌒 35. Wave with Shadow</option>
                <option value="stereo_lines">⏸️ 36. Dual Parallel Lines</option>
                <option value="smooth_curve">🔔 37. Bell Curve Wave</option>
                <option value="ribbon_wave">🎀 38. Flowing Ribbon Wave</option>
                <option value="minimal_line">➖ 39. Minimalist Baseline</option>
                <option value="calm_horizon">🌅 40. Calm Horizon Glow</option>
            </optgroup>
            <optgroup label="=== CIRCULAR & CLEAN ===">
                <option value="circle_bars">🎡 41. Circular Audio Bars</option>
                <option value="circle_ring">⭕ 42. Simple Circular Line</option>
                <option value="circle_dashed">🎯 43. Circular Dashed EQ</option>
                <option value="circle_mirror">🪞 44. Inner & Outer Circle</option>
                <option value="vinyl_record">💿 45. Spinning Vinyl</option>
                <option value="block_tower">🏙️ 46. Clean 3D EQ Blocks</option>
                <option value="equalizer_3d">🛠️ 47. Cylinder Studio EQ</option>
                <option value="floating_blocks">🧊 48. Floating Blocks</option>
                <option value="center_pulse">🔘 49. Center Expanding</option>
                <option value="classic_studio">🎙️ 50. Pro Studio Rack</option>
            </optgroup>
        </select>
        
        <label>TINGGI VIS.</label>
        <input type="range" id="visHeight" min="30" max="600" value="150">
        
        <label>LEBAR VIS.</label>
        <input type="range" id="visWidth" min="100" max="1100" value="400">
        
        <label>OPASITAS VIS.</label>
        <input type="range" id="visOpacity" min="0.1" max="1.0" step="0.05" value="1.0">
      </div>

      <!-- KOLOM KANAN (SPEAKER SHAKE & MENU WARNA TERSEMBUNYI) -->
      <div class="layout-col">
        <label style="color:#ffb300; text-align:center; font-size:12px; margin-bottom:10px;">EFEK SPEAKER (DAUN)</label>
        <select id="speakerStyle">
          <option value="none">🚫 Sembunyikan Speaker</option>
          <option value="golden_cone">🟡 1. Golden Cone Studio</option>

          <option value="kevlar_yellow">🟨 4. Yellow Kevlar Driver</option>
          <option value="kevlar_red">🟥 5. Red Kevlar Woofer</option>
          <option value="silver_alum">🔘 6. Silver Aluminum Cone</option>
          <option value="copper_driver">🟠 7. Copper Metallic Cone</option>
          <option value="paper_vintage">📜 8. Vintage Paper Ribbed</option>
          <option value="carbon_fiber">🏎️ 9. Carbon Fiber Dark</option>
          <option value="blue_poly">🟦 10. Blue Polypropylene</option>
          <option value="white_dimpled">🤍 11. White Dimpled Cone</option>
          <option value="orange_studio">🟧 12. Orange Studio Mon</option>
          <option value="grey_graphite">🪨 13. Grey Graphite Woofer</option>
          <option value="titanium_dome">⚙️ 14. Titanium Shiny Dome</option>
          <option value="purple_anodized">🟪 15. Purple Anodized Cone</option>
          <option value="green_poly">🟩 16. Green Poly Woofer</option>
          <option value="wood_fiber">🪵 17. Brown Wood Fiber</option>
          <option value="clear_poly">🧊 18. Clear Frosted Poly</option>

        <label>UKURAN SPK</label>
        <input type="range" id="speakerSize" min="0.2" max="5.0" step="0.1" value="1.5">

        <label style="color:#ff5252;">GETARAN (SHAKE)</label>

        <!-- TOMBOL MENU WARNA (HIDDEN/TOGGLE) -->
        <button class="toggle-color-btn" onclick="toggleColorMenu()">🎨 ATUR WARNA DAUN ▼</button>
        
        <div id="colorPanel" style="display: none; width: 100%; flex-direction: column; align-items: center; gap: 8px; margin-top: 5px;">
            <label style="color:#fff; display:flex; justify-content:center; align-items:center;">

            <div style="width: 100%; display: flex; justify-content: center; margin-bottom: 5px;">
                <canvas id="colorWheel" width="200" height="200" style="width: 100%; max-width: 140px; aspect-ratio: 1/1; border-radius: 8px; border: 2px solid #555; cursor: crosshair; touch-action: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5);"></canvas>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap; justify-content:center;">

              <div class="swatch" style="background:#ff9800;" onclick="setColor('#ff9800')"></div>

              <div class="swatch" style="background:#4caf50;" onclick="setColor('#4caf50')"></div>
              <div class="swatch" style="background:#00e5ff;" onclick="setColor('#00e5ff')"></div>
              <div class="swatch" style="background:#2979ff;" onclick="setColor('#2979ff')"></div>
              <div class="swatch" style="background:#d500f9;" onclick="setColor('#d500f9')"></div>

      </div>
    </div>

    <hr style="border: 0; border-top: 1px dashed #333; width: 100%; margin: 5px 0;">

    <!-- EFEK KOPI DAN LILIN BERSAMPINGAN -->
    <div class="layout-grid">
      <div class="layout-col">
        <label style="color:#d7ccc8; text-align:center; font-size:12px; margin-bottom:5px;">ASAP KOPI</label>
        <select id="coffeeStyle">
          <option value="none">🚫 Tanpa Asap Kopi</option>
          <option value="soft_steam">☕ 1. Soft Warm Steam</option>
          <option value="swirl_vapor">🌪️ 2. Swirling Vapor</option>
          <option value="thin_wisp">🌬️ 3. Thin Elegant Wisp</option>
          <option value="heavy_steam">☁️ 4. Heavy Morning Steam</option>
          <option value="wind_steam">🍃 5. Breezy Coffee Steam</option>
        </select>
      </div>
      <div class="layout-col">
        <label style="color:#ff8a65; text-align:center; font-size:12px; margin-bottom:5px;">API LILIN</label>
        <select id="candleStyle">
          <option value="none">🚫 Tanpa Api Lilin</option>
          <option value="calm_flame">🕯️ 1. Calm Warm Flame</option>
          <option value="flicker_flame">🕯️ 2. Flickering Flame</option>
          <option value="bright_glow">🌟 3. Bright Glowing Flame</option>
          <option value="blue_base">🔵 4. Blue-Base Real Flame</option>
          <option value="wind_flame">🌬️ 5. Wind-blown Flame</option>

      </div>
    </div>
    
    <div class="row" style="margin-top: 5px;"><label style="color:#fff;">UKURAN PROP</label><input type="range" id="propSize" min="0.2" max="5.0" step="0.1" value="1.0"></div>
    <div class="row" style="margin-top: 5px;"><label style="color:#ff8a65;">KCPTN PROP</label><input type="range" id="propSpeed" min="0.1" max="5.0" step="0.1" value="1.0"></div>

    <hr style="border: 0; border-top: 1px dashed #333; width: 100%; margin: 5px 0;">

    <div class="row">
      <label style="color:#00e5ff;">PARTIKEL SINEMATIK</label>
      <select id="type">
        <option value="none">🚫 Tanpa Partikel</option>
        <option value="dust_motes">✨ 1. Butiran Debu Emas</option>
        <option value="magic_sparks">💫 2. Percikan Sihir Biru</option>
        <option value="floating_embers">🔥 3. Bara Api Terbang</option>
        <option value="bokeh_orbs">🫧 4. Bokeh Orbs Sinematik</option>
        <option value="snow_dust">❄️ 5. Debu Salju Halus</option>
        <option value="fairy_light">🧚 6. Cahaya Peri Berpendar</option>
        <option value="ash_particles">🌪️ 7. Abu Hitam Melayang</option>
        <option value="starlight_glint">🌟 8. Kilauan Bintang Halus</option>
        <option value="deep_sea_motes">🌊 9. Partikel Air Laut</option>

    <div class="row"><label style="color:#00e5ff;">KECEPATAN FX</label><input type="range" id="fxSpeed" min="0.1" max="5.0" step="0.1" value="1.0"></div>
    <div class="row"><label>JUMLAH FX</label><input type="range" id="count" min="0" max="400" value="100"></div>

    <button class="btn-record" id="recordBtn" onclick="startCountdownAndRecord()">🔴 MULAI REKAM 720p</button>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    const statusBox = document.getElementById('statusBox');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const stopOverlay = document.getElementById('stopOverlay');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const recordBtn = document.getElementById('recordBtn');
    const progressBar = document.getElementById('progressBar');
    const currTimeEl = document.getElementById('currTime');
    const durTimeEl = document.getElementById('durTime');
    let isDraggingProgress = false;
    
    const width = 1280;
    const height = 720;

    let audioFiles = []; let currentObjectUrl = null; let currentSongName = ""; let playTimeout = null;
    let isTrackLoaded = false; let shuffledPlaylist = []; let currentPlayIndex = 0; let isCountingDown = false; let countdownTimer = null;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; }
      return array;
    }

    document.getElementById('audioInput').addEventListener('change', function(e) {
      if (this.files.length > 0) {
        audioFiles = Array.from(this.files); isTrackLoaded = true; shuffledPlaylist = shuffle(Array.from({ length: audioFiles.length }, (v, k) => k));
        currentPlayIndex = 0; playBtn.innerHTML = "▶ PLAY MUSIK"; playBtn.classList.add('ready'); nextBtn.classList.add('ready');
        statusBox.innerText = `${audioFiles.length} Lagu dimuat. Siap diputar!`; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
        audioPlayer.pause(); if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; currentSongName = "Musik Diunggah";
      }
    });

    function playRandomSong(isInstant = false) {
      if (audioFiles.length === 0) return;
      if (playTimeout) clearTimeout(playTimeout);
      if (currentPlayIndex >= shuffledPlaylist.length) { currentPlayIndex = 0; stopEverything(); return; }
      if (currentObjectUrl && isInstant) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
      const delayAmount = isInstant ? 0 : 3500;
      if (!isInstant) {
        audioPlayer.pause(); playBtn.innerText = "⏳ TUNGGU..."; statusBox.innerText = "⏳ Jeda pergantian lagu...";
        currentSongName = "Memuat..."; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
      }
      playTimeout = setTimeout(() => {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        const actualFileIndex = shuffledPlaylist[currentPlayIndex]; const selectedFile = audioFiles[actualFileIndex];
        currentSongName = selectedFile.name.replace(/\.[^/.]+$/, ""); currentObjectUrl = URL.createObjectURL(selectedFile);
        audioPlayer.src = currentObjectUrl; audioPlayer.load();
        if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
        audioPlayer.play().then(() => { playBtn.innerText = "⏸ PAUSE"; statusBox.innerText = `🎵 Lagu ${currentPlayIndex + 1}/${audioFiles.length}: ${currentSongName}`; currentPlayIndex++; }).catch(err => { playBtn.innerText = "❌ ERROR"; });
      }, delayAmount);
    }

    audioPlayer.addEventListener('ended', () => { playRandomSong(false); });

    function stopEverything() {
      audioPlayer.pause(); if (playTimeout) clearTimeout(playTimeout);
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; currentSongName = "Playlist Selesai";
      if (dataArray) dataArray.fill(0); shuffledPlaylist = shuffle(Array.from({ length: audioFiles.length }, (v, k) => k));
      statusBox.innerText = `✅ Semua lagu selesai.`; playBtn.innerText = "▶ PLAY ACAK"; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
      if (mediaRecorder && mediaRecorder.state === 'recording') { statusBox.innerText = `✅ Menyimpan rekaman otomatis...`; setTimeout(() => { stopRecording(); }, 500); }
    }

    // =========================================================
    // COLOR WHEEL SCRIPT & TOGGLE
    // =========================================================
    function toggleColorMenu() {
        const panel = document.getElementById('colorPanel');
        panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
    }

    function setColor(hex) {
        document.getElementById('speakerColor').value = hex;
        document.getElementById('useCustomColor').checked = true;
    }

    const cwCanvas = document.getElementById('colorWheel');

    function drawColorWheel() {
        const w = cwCanvas.width;
        const h = cwCanvas.height;
        const cx = w / 2;
        const cy = h / 2;
        
        if(cwCtx.createConicGradient) {
            const grad = cwCtx.createConicGradient(0, cx, cy);
            grad.addColorStop(0, "red"); grad.addColorStop(1/6, "magenta"); grad.addColorStop(2/6, "blue");
            grad.addColorStop(3/6, "cyan"); grad.addColorStop(4/6, "green"); grad.addColorStop(5/6, "yellow");
            grad.addColorStop(1, "red");
            cwCtx.fillStyle = grad; cwCtx.fillRect(0, 0, w, h);
        } else {
            for(let angle=0; angle<360; angle++) {
                cwCtx.beginPath(); cwCtx.moveTo(cx, cy); cwCtx.arc(cx, cy, cx*1.5, angle*Math.PI/180, (angle+1.5)*Math.PI/180);
                cwCtx.fillStyle = `hsl(${angle}, 100%, 50%)`; cwCtx.fill();

    function pickColor(e) {
        const rect = cwCanvas.getBoundingClientRect();

        let clientX = e.clientX; let clientY = e.clientY;

        let x = (clientX - rect.left) * scaleX; let y = (clientY - rect.top) * scaleY;
        
        const pixel = cwCtx.getImageData(x, y, 1, 1).data;
        const hex = "#" + (1 << 24 | pixel[0] << 16 | pixel[1] << 8 | pixel[2]).toString(16).slice(1);

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
      let clientX = e.clientX; let clientY = e.clientY;
      if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startDrag(e) {
      const pos = getMousePos(e); 
      const spkScale = parseFloat(document.getElementById('speakerSize').value);
      const clickRadius = 60 * spkScale;
      
      const dist1 = Math.hypot(pos.x - spk1X, pos.y - spk1Y);
      if (dist1 <= Math.max(40, clickRadius) && document.getElementById('speakerStyle').value !== 'none') { 
        isDraggingSpk1 = true; dragOffsetX = pos.x - spk1X; dragOffsetY = pos.y - spk1Y; if (e.cancelable) e.preventDefault(); return; 
      }
      const dist2 = Math.hypot(pos.x - spk2X, pos.y - spk2Y);
      if (dist2 <= Math.max(40, clickRadius) && document.getElementById('speakerStyle').value !== 'none') { 
        isDraggingSpk2 = true; dragOffsetX = pos.x - spk2X; dragOffsetY = pos.y - spk2Y; if (e.cancelable) e.preventDefault(); return; 
      }
      
      // Hitbox Props (Coffee/Candles)
      if (document.getElementById('coffeeStyle').value !== 'none' && Math.hypot(pos.x - coffeeX, pos.y - coffeeY) <= 50) {
        isDraggingCoffee = true; dragOffsetX = pos.x - coffeeX; dragOffsetY = pos.y - coffeeY; if (e.cancelable) e.preventDefault(); return;
      }
      if (document.getElementById('candleStyle').value !== 'none') {
        if (Math.hypot(pos.x - candle1X, pos.y - candle1Y) <= 40) {
            isDraggingCandle1 = true; dragOffsetX = pos.x - candle1X; dragOffsetY = pos.y - candle1Y; if (e.cancelable) e.preventDefault(); return;
        }
        if (Math.hypot(pos.x - candle2X, pos.y - candle2Y) <= 40) {
            isDraggingCandle2 = true; dragOffsetX = pos.x - candle2X; dragOffsetY = pos.y - candle2Y; if (e.cancelable) e.preventDefault(); return;
        }
      }
      
      if (pos.x >= visX && pos.x <= visX + visW && pos.y >= visY - 150 && pos.y <= visY + 150) { 
        isDraggingVis = true; dragOffsetX = pos.x - visX; dragOffsetY = pos.y - visY; if (e.cancelable) e.preventDefault(); 
      }
    }

    function drag(e) {
      if (!isDraggingVis && !isDraggingSpk1 && !isDraggingSpk2 && !isDraggingCoffee && !isDraggingCandle1 && !isDraggingCandle2) return;
      const pos = getMousePos(e);

    // =========================================================
    // FITUR: 10 PARTIKEL SINEMATIK SUPER LEMBUT

    class CinematicParticle {
        constructor() { this.reset(true); }
        reset(init = false) {
            this.x = Math.random() * width;
            this.y = init ? (Math.random() * height) : -20 - Math.random()*50;
            this.size = Math.random() * 3 + 1;
            this.speedY = Math.random() * 1.5 + 0.5;
            this.opacity = Math.random() * 0.6 + 0.2;
            this.life = Math.random() * 100;
            this.wobbleSpeed = Math.random() * 0.05 + 0.01;
            
            if(config.type === 'bokeh_orbs') { this.size = Math.random() * 15 + 5; this.opacity = Math.random()*0.3+0.1; }
            if(config.type === 'snow_dust' || config.type === 'ash_particles') { this.speedY = Math.random() * 2 + 1; }
        }
        update() {
            if(config.type === 'none') return;
            let wind = config.fxAngle * Math.PI / 180;
            let sm = config.fxSpeed;
            
            this.life += this.wobbleSpeed;
            
            if (['dust_motes', 'golden_pollen', 'magic_sparks', 'floating_embers'].includes(config.type)) {
                this.y -= this.speedY * sm * 0.5;
                this.x += Math.sin(this.life) * 1 * sm + Math.sin(wind)*2;
            } else if (config.type === 'bokeh_orbs' || config.type === 'fairy_light') {
                this.y -= this.speedY * sm * 0.3;
                this.x += Math.sin(this.life) * 0.5 * sm + Math.sin(wind)*1;
            } else {
                this.y += this.speedY * sm;
                this.x += Math.sin(this.life) * 1 * sm + Math.sin(wind)*3;
            }
            
            this.currentOpacity = this.opacity * (0.5 + 0.5*Math.sin(this.life*2));
            
            if(this.y > height + 50 || this.y < -50 || this.x > width+50 || this.x < -50) this.reset();
        }
        draw() {
            if(config.type === 'none') return;
            ctx.save();
            ctx.beginPath();
            
            let c1;
            if(config.type === 'dust_motes') { c1=`rgba(255,230,150,${this.currentOpacity})`; ctx.shadowBlur=this.size*2; ctx.shadowColor='#ffeb3b'; }
            else if(config.type === 'magic_sparks') { c1=`rgba(200,255,255,${this.currentOpacity})`; ctx.shadowBlur=this.size*3; ctx.shadowColor='#00e5ff'; }
            else if(config.type === 'floating_embers') { c1=`rgba(255,100,0,${this.currentOpacity})`; ctx.shadowBlur=this.size*3; ctx.shadowColor='#ff3d00'; }
            else if(config.type === 'bokeh_orbs') { c1=`rgba(255,255,255,${this.currentOpacity*0.5})`; }
            else if(config.type === 'snow_dust') { c1=`rgba(255,255,255,${this.currentOpacity})`; ctx.shadowBlur=this.size; ctx.shadowColor='#fff'; }
            else if(config.type === 'fairy_light') { c1=`rgba(255,200,255,${this.currentOpacity})`; ctx.shadowBlur=this.size*4; ctx.shadowColor='#e040fb'; }
            else if(config.type === 'ash_particles') { c1=`rgba(50,50,50,${this.currentOpacity+0.4})`; }
            else if(config.type === 'starlight_glint') { c1=`rgba(255,255,255,${this.currentOpacity})`; 
                let rot = this.life;
                ctx.translate(this.x, this.y); ctx.rotate(rot);
                ctx.moveTo(-this.size, 0); ctx.lineTo(this.size, 0); ctx.moveTo(0, -this.size); ctx.lineTo(0, this.size);
                ctx.strokeStyle=c1; ctx.lineWidth=1; ctx.stroke();
                ctx.restore(); return;
            }
            else if(config.type === 'deep_sea_motes') { c1=`rgba(100,200,255,${this.currentOpacity*0.7})`; ctx.shadowBlur=this.size*2; ctx.shadowColor='#00bcd4'; }
            else if(config.type === 'golden_pollen') { c1=`rgba(255,215,0,${this.currentOpacity})`; ctx.shadowBlur=this.size*2; ctx.shadowColor='#ffb300'; }
            
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
            ctx.fillStyle = c1;
            ctx.fill();
            ctx.restore();
        }
    }

    function getSymmetricVal(index, totalItems, bufferLen) {
      try {
        if (!dataArray) return 0;
        const center = totalItems / 2;
        const centerDist = Math.abs(index - center) / center;
        const dataIdx = Math.floor(centerDist * (bufferLen * 0.6));
        return dataArray[dataIdx] / 255;
      } catch (e) { return 0; }
    }

    // =========================================================
    // FITUR SPEAKER: DUSTCAP MEMOMPA KE DEPAN, TIDAK MENGECIL DARI UKURAN ASLI
    // =========================================================
    function drawSpeakers(bufferLen) {
      let style = document.getElementById('speakerStyle').value;
      if (style === 'none') return;
      
      let scale = parseFloat(document.getElementById('speakerSize').value);
      
      let bass = 0;
      if(dataArray) { bass = (dataArray[1] + dataArray[2] + dataArray[3]) / (255 * 3); }
      if(isNaN(bass)) bass = 0;

      let baseR = 50 * scale; 
      
      let shakeIntensity = parseFloat(document.getElementById('speakerShake').value);
      // Getar (Shake)
      let shakeX = (Math.random() - 0.5) * bass * shakeIntensity;
      let shakeY = (Math.random() - 0.5) * bass * shakeIntensity;

      function drawRealSpk(x, y, coneStops, capStops, ribs=0) {
        ctx.save(); 

        // Getaran dipusatkan ke seluruh badan speaker 
        ctx.translate(x + shakeX, y + shakeY); 

        let coneR = baseR; // Daun statis ukurannya
        
        // INI YANG DIUBAH: Dustcap memompa keluar (membesar) sesuai bass, 
        // tapi ukuran minimalnya tetap baseR * 0.45 (tidak mengecil saat pause)
        let pumpAmount = bass * 15 * scale; 
        let capR = (baseR * 0.45) + pumpAmount; 
        
        let customColor = document.getElementById('speakerColor').value;
        let useColor = document.getElementById('useCustomColor').checked;

        // 2. Gambar Daun Speaker (Cone) - TETAP STATIS
        let grad = ctx.createRadialGradient(0,0, baseR * 0.45, 0,0, coneR); 
        coneStops.forEach(st => grad.addColorStop(st[0], st[1]));
        ctx.beginPath(); ctx.arc(0,0, coneR, 0, Math.PI*2);
        ctx.fillStyle = grad; ctx.fill();
        
        // 3. Garis Tekstur (Ribs)
        if(ribs > 0) {
            ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            for(let i=1; i<=ribs; i++) { 
                ctx.beginPath(); ctx.arc(0,0, (baseR * 0.45) + (coneR - baseR * 0.45)*(i/(ribs+1)), 0, Math.PI*2); ctx.stroke(); 
            }
        }

        // 4. Color Blending 
        if(useColor) {
            ctx.save();
            ctx.beginPath(); ctx.arc(0,0, coneR, 0, Math.PI*2);
            ctx.clip();
            ctx.globalCompositeOperation = 'color'; 
            ctx.fillStyle = customColor;
            ctx.fillRect(-coneR, -coneR, coneR*2, coneR*2);
            ctx.restore();
        }

        // 5. Pelindung Debu Tengah (Dust Cap) MEMOMPA
        let capGrad = ctx.createRadialGradient(0,-capR*0.3, 0, 0,0, capR);
        capStops.forEach(st => capGrad.addColorStop(st[0], st[1]));
        ctx.beginPath(); ctx.arc(0,0, capR, 0, Math.PI*2); ctx.fillStyle = capGrad; ctx.fill();
        
        // 6. Cincin Emas Mengelilingi Dust Cap ikut memompa
        ctx.beginPath(); ctx.arc(0,0, capR, 0, Math.PI*2); 
        ctx.lineWidth = 2 * scale; 
        let ringGrad = ctx.createLinearGradient(-capR, -capR, capR, capR);
        ringGrad.addColorStop(0, '#ffca28'); ringGrad.addColorStop(0.5, '#fff8e1'); ringGrad.addColorStop(1, '#ff8f00');
        ctx.strokeStyle = ringGrad; 
        ctx.stroke();

        // 7. Garis Halus Tepi Luar Daun (Batas luar)
        ctx.beginPath(); ctx.arc(0,0, coneR, 0, Math.PI*2);
        ctx.lineWidth = 2 * scale; ctx.strokeStyle = '#111'; ctx.stroke();

        ctx.restore();
      }

      function renderSpk(x, y) {
          if (style === 'golden_cone') drawRealSpk(x, y, [[0,'#ffca28'], [1,'#8b5a00']], [[0,'#444'], [1,'#111']]);
          else if (style === 'classic_black') drawRealSpk(x, y, [[0,'#333'], [1,'#0a0a0a']], [[0,'#222'], [1,'#050505']]);
          else if (style === 'white_monitor') drawRealSpk(x, y, [[0,'#fff'], [1,'#ccc']], [[0,'#333'], [1,'#111']]);
          else if (style === 'kevlar_yellow') drawRealSpk(x, y, [[0,'#fbc02d'], [1,'#f57f17']], [[0,'#222'], [1,'#000']], 3);
          else if (style === 'kevlar_red') drawRealSpk(x, y, [[0,'#e53935'], [1,'#b71c1c']], [[0,'#222'], [1,'#000']], 3);
          else if (style === 'silver_alum') drawRealSpk(x, y, [[0,'#eee'], [1,'#888']], [[0,'#ddd'], [1,'#666']]);
          else if (style === 'copper_driver') drawRealSpk(x, y, [[0,'#d88c51'], [1,'#8a5626']], [[0,'#a0632c'], [1,'#472c13']]);
          else if (style === 'paper_vintage') drawRealSpk(x, y, [[0,'#8c7b6c'], [1,'#4a4139']], [[0,'#222'], [1,'#111']], 6);
          else if (style === 'carbon_fiber') drawRealSpk(x, y, [[0,'#555'], [1,'#222']], [[0,'#333'], [1,'#111']]);
          else if (style === 'blue_poly') drawRealSpk(x, y, [[0,'#1e3f66'], [1,'#0c1929']], [[0,'#222'], [1,'#000']]);
          else if (style === 'white_dimpled') drawRealSpk(x, y, [[0,'#f5f5f5'], [1,'#a0a0a0']], [[0,'#ddd'], [1,'#888']]);
          else if (style === 'orange_studio') drawRealSpk(x, y, [[0,'#ff9800'], [1,'#e65100']], [[0,'#222'], [1,'#000']]);
          else if (style === 'grey_graphite') drawRealSpk(x, y, [[0,'#757575'], [1,'#424242']], [[0,'#212121'], [1,'#000']]);
          else if (style === 'titanium_dome') drawRealSpk(x, y, [[0,'#b0bec5'], [1,'#546e7a']], [[0,'#cfd8dc'], [1,'#455a64']]);
          else if (style === 'purple_anodized') drawRealSpk(x, y, [[0,'#7b1fa2'], [1,'#4a148c']], [[0,'#222'], [1,'#111']]);
          else if (style === 'green_poly') drawRealSpk(x, y, [[0,'#2e7d32'], [1,'#1b5e20']], [[0,'#222'], [1,'#000']]);
          else if (style === 'wood_fiber') drawRealSpk(x, y, [[0,'#5d4037'], [1,'#3e2723']], [[0,'#222'], [1,'#111']]);
          else if (style === 'clear_poly') drawRealSpk(x, y, [[0,'#cfd8dc'], [1,'#90a4ae']], [[0,'#37474f'], [1,'#263238']]);
          else if (style === 'ribbed_black') drawRealSpk(x, y, [[0,'#424242'], [1,'#212121']], [[0,'#111'], [1,'#000']], 8);
          else if (style === 'bronze_spun') drawRealSpk(x, y, [[0,'#cd7f32'], [1,'#8b4513']], [[0,'#cd7f32'], [1,'#8b4513']], 6);
      }

      renderSpk(spk1X, spk1Y); renderSpk(spk2X, spk2Y);
    }

    // =========================================================
    // FITUR PROP: ASAP KOPI DITEBALKAN
    // =========================================================
    function drawCoffeeSteam(x, y, style, scale, propSpeed) {
        if(style === 'none') return;
        ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);

        let branches = 3; let hMax = 150; let wMax = 30; let speedMult = 1.5; let waveFreq = 2.0; let opacity = 0.8;
        if(style === 'soft_steam') { branches=2; hMax=120; wMax=20; speedMult=1; waveFreq=1.5; opacity=0.7; }
        if(style === 'swirl_vapor') { branches=4; hMax=180; wMax=40; speedMult=1.8; waveFreq=2.5; opacity=0.85; }
        if(style === 'thin_wisp') { branches=2; hMax=140; wMax=15; speedMult=1.2; waveFreq=3; opacity=0.6; }
        if(style === 'heavy_steam') { branches=5; hMax=200; wMax=45; speedMult=2; waveFreq=1.8; opacity=0.95; }
        if(style === 'wind_steam') { branches=3; hMax=160; wMax=35; speedMult=2.5; waveFreq=2.0; opacity=0.75; ctx.rotate(20 * Math.PI/180); }

        ctx.globalCompositeOperation = 'screen';
        ctx.filter = 'blur(4px)'; 

        for(let b=0; b<branches; b++) {
            let pts = []; let steps = 40; 
            for(let i=0; i<=steps; i++) {
                let prog = i/steps; 
                let speed = time * speedMult * propSpeed;
                let w = (5 + Math.sin(prog * Math.PI * 3 + speed) * 5) * Math.sin(prog * Math.PI); 
                let sway = Math.sin(prog * Math.PI * waveFreq - speed + b * 1.3) * wMax * Math.pow(prog, 0.8);
                let secondarySway = Math.sin(prog * Math.PI * waveFreq * 2.1 - speed * 1.4 + b * 2) * (wMax * 0.4) * prog;
                let px = sway + secondarySway; 
                let py = -prog * hMax;
                pts.push({x: px, y: py, w: w});
            }
            
            // Draw Ribbon Fill
            ctx.beginPath();
            ctx.moveTo(pts[0].x - pts[0].w, pts[0].y);
            for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x - pts[i].w, pts[i].y);
            for(let i=pts.length-1; i>=0; i--) ctx.lineTo(pts[i].x + pts[i].w, pts[i].y);
            ctx.closePath();
            
            let grad = ctx.createLinearGradient(0,0, 0,-hMax);
            grad.addColorStop(0, `rgba(255, 255, 255, 0)`); 
            grad.addColorStop(0.5, `rgba(255, 255, 255, ${opacity})`); 
            grad.addColorStop(1, `rgba(255, 255, 255, 0)`);
            ctx.fillStyle = grad; 
            ctx.fill();

            // Draw Bright Ribbon Edge (Lebih tebal)
            ctx.beginPath();
            ctx.moveTo(pts[0].x - pts[0].w, pts[0].y);
            for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x - pts[i].w, pts[i].y);
            ctx.strokeStyle = `rgba(255, 255, 255, ${Math.min(1, opacity * 1.8)})`;
            ctx.lineWidth = 2; // Ditebalkan
            ctx.stroke();
            
            // Garis dalam biar lebih pekat
            ctx.beginPath();
            ctx.moveTo(pts[0].x + pts[0].w, pts[0].y);
            for(let i=1; i<pts.length; i++) ctx.lineTo(pts[i].x + pts[i].w, pts[i].y);
            ctx.strokeStyle = `rgba(255, 255, 255, ${opacity * 0.8})`; 
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        ctx.restore();
    }

    // =========================================================
    // FITUR PROP HYPER-REALISTIC: API LILIN BERLAPIS (ORGANIK)
    // =========================================================
    function drawCandle(x, y, style, scale, propSpeed) {
        if(style === 'none') return;
        ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);

        let t = time * 2 * propSpeed;
        let flicker = 0; let sway = 0; let h = 65; let w = 16;
        let baseColor = 'rgba(255, 140, 0, 0.8)';
        let midColor = 'rgba(255, 210, 0, 0.9)';
        let coreColor = 'rgba(255, 255, 255, 0.95)';

        if(style === 'calm_flame') { flicker = Math.sin(t*3)*2; sway = Math.sin(t)*1; }
        else if(style === 'flicker_flame') { flicker = Math.sin(t*10)*4 + Math.random()*2; sway = Math.sin(t*5)*3; }
        else if(style === 'bright_glow') { flicker = Math.sin(t*4)*2; h = 75; w = 18; ctx.shadowBlur = 50 + flicker*5; ctx.shadowColor = '#ff9800'; }
        else if(style === 'blue_base') { flicker = Math.sin(t*5)*2; baseColor = 'rgba(0, 150, 255, 0.8)'; midColor = 'rgba(100, 200, 255, 0.9)'; }
        else if(style === 'wind_flame') { flicker = Math.random()*5; sway = 15 + Math.sin(t*8)*5; }

        // Glow Halo
        ctx.beginPath(); ctx.arc(0, -h*0.5, w*3, 0, Math.PI*2);
        let gradGlow = ctx.createRadialGradient(0,-h*0.5,0, 0,-h*0.5,w*4);
        gradGlow.addColorStop(0, 'rgba(255, 120, 0, 0.25)'); gradGlow.addColorStop(1, 'rgba(255, 120, 0, 0)');
        ctx.fillStyle = gradGlow; ctx.fill();

        // Wick
        ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(sway*0.05, -8);
        ctx.lineWidth = 3; ctx.strokeStyle = '#111'; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(sway*0.05, -8); ctx.lineTo(sway*0.1, -12);
        ctx.lineWidth = 2; ctx.strokeStyle = '#ff5722'; ctx.stroke();

        // Layer Api
        function drawFlame(fw, fh, fsway, color) {
            ctx.beginPath();
            ctx.moveTo(0, 2);
            ctx.bezierCurveTo(fw, 2, fw*0.9, -fh*0.4, fsway, -fh);
            ctx.bezierCurveTo(-fw*0.9, -fh*0.4, -fw, 2, 0, 2);
            ctx.fillStyle = color; ctx.fill();
        }

        drawFlame(w, h + flicker, sway, baseColor); 
        drawFlame(w*0.7, (h + flicker)*0.75, sway*0.7, midColor); 
        drawFlame(w*0.35, (h + flicker)*0.45, sway*0.3, coreColor); 
        
        // Base Biru
        if(style !== 'blue_base') {
            ctx.beginPath(); ctx.moveTo(0, 4); ctx.bezierCurveTo(w*0.5, 4, w*0.4, -5, 0, -5); ctx.bezierCurveTo(-w*0.4, -5, -w*0.5, 4, 0, 4);
            let bg = ctx.createRadialGradient(0,0,0, 0,0,w*0.5); bg.addColorStop(0,'rgba(0,100,255,0.6)'); bg.addColorStop(1,'rgba(0,50,255,0)');
            ctx.fillStyle = bg; ctx.fill();
        }
        ctx.restore();
    }

              let val = getSymmetricVal(i, points, bufferLen) * (config.visHeight * 0.4); let angle = (i * Math.PI * 2) / points; let r = radius + val;
              let x = Math.cos(angle) * r; let y = Math.sin(angle) * r; if(i===0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.closePath(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
        }
        else if (style === 'circle_dashed') {
          let cx_c = visW / 2; let cy_c = -config.visHeight * 0.6; let radius = config.visHeight * 0.4; let bars = 48; let dashH = 4; let gapH = 3;
          for(let i=0; i<bars; i++) {

    function animate() {
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, width, height); time += 0.05; // Time utama konstan
      ctx.save();
      
      if (isBgReady) { const scale = Math.max(width / bgImageElement.width, height / bgImageElement.height); const x = (width / 2) - (bgImageElement.width / 2) * scale; const y = (height / 2) - (bgImageElement.height / 2) * scale; ctx.drawImage(bgImageElement, x, y, bgImageElement.width * scale, bgImageElement.height * scale); }

      if (isAudioInit && currentObjectUrl) {
        if (!audioPlayer.paused) analyser.getByteFrequencyData(dataArray); else for (let i = 0; i < dataArray.length; i++) dataArray[i] = Math.max(0, dataArray[i] - 10);
        drawVisualizer(analyser.frequencyBinCount);
      }

      // RENDER SPEAKER DRAGGABLE
      drawSpeakers(isAudioInit ? analyser.frequencyBinCount : 128);
      
      // RENDER COFFEE & CANDLES (DENGAN SPEED TERPISAH)
      let propScale = parseFloat(document.getElementById('propSize').value);
      let propSpeed = parseFloat(document.getElementById('propSpeed').value);
      drawCoffeeSteam(coffeeX, coffeeY, document.getElementById('coffeeStyle').value, propScale, propSpeed);
      drawCandle(candle1X, candle1Y, document.getElementById('candleStyle').value, propScale, propSpeed);
      drawCandle(candle2X, candle2Y, document.getElementById('candleStyle').value, propScale, propSpeed);

      // RENDER CINEMATIC PARTICLES (DENGAN FX SPEED NATIVE)
      for (let i = 0; i < config.count; i++) { 
        if (cinematicParticles[i]) { 
            cinematicParticles[i].update(); 
            cinematicParticles[i].draw(); 
        } 
      }

      if (config.type !== 'none') { const grad = ctx.createRadialGradient(width/2, height/2, height*0.4, width/2, height/2, width*0.8); grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.4)'); ctx.fillStyle = grad; ctx.fillRect(-10, -10, width+20, height+20); }

      ctx.restore(); requestAnimationFrame(animate);
    }
    animate();

    let mediaRecorder, chunks = []; let recordStartTime = 0;
    function startCountdownAndRecord() {
      if (!isAudioInit || !currentObjectUrl) { alert("Pilih dan siapkan musik dulu!"); return; }
      if (isCountingDown) { clearInterval(countdownTimer); isCountingDown = false; countdownOverlay.style.display = 'none'; recordBtn.innerText = "🔴 MULAI REKAM 720p"; return; }
      isCountingDown = true; let counter = 3; countdownOverlay.innerText = counter; countdownOverlay.style.display = 'block'; recordBtn.innerText = "❌ BATALKAN REKAM (" + counter + ")";
      countdownTimer = setInterval(() => { counter--; if (counter > 0) { countdownOverlay.innerText = counter; recordBtn.innerText = "❌ BATALKAN REKAM (" + counter + ")"; } else { clearInterval(countdownTimer); isCountingDown = false; countdownOverlay.style.display = 'none'; executeRecording(); } }, 1000);
    }

    function executeRecording() {
      if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) { window.Capacitor.Plugins.KeepAwake.keepAwake(); }
      audioPlayer.play(); playBtn.innerText = "⏸ PAUSE"; stopOverlay.style.display = 'block'; statusBox.innerText = "🔴 Merekam Video 720p..."; recordBtn.innerText = "🔴 SEDANG MEREKAM";
      const stream = canvas.captureStream(30); const combined = new MediaStream([...stream.getVideoTracks(), mediaStreamDestination.stream.getAudioTracks()[0]]);
      let options = { mimeType: 'video/webm;codecs=vp8,opus' }; if (!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/webm' }; }
      try { mediaRecorder = new MediaRecorder(combined, options); } catch (e) { mediaRecorder = new MediaRecorder(combined); }
      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); }; mediaRecorder.onstop = saveVideoWebM; chunks = []; recordStartTime = Date.now(); mediaRecorder.start();
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) window.Capacitor.Plugins.KeepAwake.allowSleep();
      audioPlayer.pause(); playBtn.innerText = "▶ PLAY"; stopOverlay.style.display = 'none'; recordBtn.innerText = "🔴 MULAI REKAM 720p"; statusBox.innerText = "Menyiapkan file video..."; if (playTimeout) clearTimeout(playTimeout);
    }

    function saveVideoWebM() {
      const blob = new Blob(chunks, { type: 'video/webm' }); const recordDuration = Date.now() - recordStartTime; statusBox.innerText = "⏳ Menjahit durasi (Biar bisa di-skip)...";
      if (typeof ysFixWebmDuration === 'function') { try { ysFixWebmDuration(blob, recordDuration, function(fixedBlob) { triggerDownload(fixedBlob); }, {logger: false}); } catch (error) { triggerDownload(blob); } } else { triggerDownload(blob); }
    }

    function triggerDownload(finalBlob) {
      statusBox.innerText = "⏳ Memproses pemotongan file video..."; const url = URL.createObjectURL(finalBlob);
      const oldVid = document.getElementById('previewVid'); if(oldVid) oldVid.remove(); const oldBtn = document.getElementById('shareBtnDewa'); if(oldBtn) oldBtn.remove();
      const oldLinkBtn = document.getElementById('manualLinkBtn'); if(oldLinkBtn) oldLinkBtn.remove();
      
      const vid = document.createElement('video'); vid.id = 'previewVid'; vid.src = url; vid.controls = true; vid.setAttribute('controlsList', 'nodownload'); vid.style.width = "100%"; vid.style.marginTop = "20px"; vid.style.border = "3px solid #00d2ff"; vid.style.borderRadius = "8px";
      const saveBtn = document.createElement('button'); saveBtn.id = 'shareBtnDewa'; saveBtn.innerText = "📥 SIMPAN KE DOKUMEN (CAPACITOR)"; saveBtn.style.width = "100%"; saveBtn.style.padding = "15px"; saveBtn.style.marginTop = "10px"; saveBtn.style.background = "linear-gradient(135deg, #00ffaa, #00bcd4)"; saveBtn.style.color = "black"; saveBtn.style.border = "none"; saveBtn.style.borderRadius = "8px"; saveBtn.style.fontWeight = "bold"; saveBtn.style.fontSize = "14px"; saveBtn.style.cursor = "pointer";
      
      const fallbackBtn = document.createElement('a'); fallbackBtn.id = 'manualLinkBtn'; fallbackBtn.innerText = "⬇️ DOWNLOAD MANUAL (JIKA GAGAL)"; fallbackBtn.href = url; fallbackBtn.download = `BassJazz_720p_${Date.now()}.webm`;

      let isSaving = false;
      saveBtn.onclick = async () => {
        if (isSaving) return; isSaving = true; saveBtn.innerText = "⏳ MEMINTA IZIN & MENYIMPAN...";
        
        const downloadBrowser = () => {
            statusBox.innerText = "⏳ Mengunduh lewat Download Manager HP...";
            fallbackBtn.click();
            saveBtn.innerText = "✅ MENGGUNAKAN DOWNLOAD BAWAAN"; statusBox.innerText = `🎉 SUKSES! Periksa folder Download atau Galeri Anda.`;
        };

        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
            const FS = window.Capacitor.Plugins.Filesystem; 
            
            try { 
                let perm = await FS.checkPermissions();
                if (perm.publicStorage !== 'granted' && perm.publicStorage !== 'authorized') await FS.requestPermissions(); 
            } catch(e) { console.warn("Capacitor Perm Check Err:", e); } 
            
            const fileName = `BassJazz_720p_${Date.now()}.webm`; 
            
            try {
                await FS.writeFile({ path: fileName, data: "", directory: 'DOCUMENTS' });
                const chunkSize = 1572864; const totalChunks = Math.ceil(finalBlob.size / chunkSize);
                for (let i = 0; i < totalChunks; i++) {
                  const start = i * chunkSize; const end = Math.min(start + chunkSize, finalBlob.size); const chunk = finalBlob.slice(start, end);
                  const base64Chunk = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(chunk); });
                  await FS.appendFile({ path: fileName, data: base64Chunk, directory: 'DOCUMENTS' });
                  const percent = Math.round(((i + 1) / totalChunks) * 100); statusBox.innerText = `⏳ Menulis ke memori HP... ${percent}%`; saveBtn.innerText = `⏳ MENYIMPAN... ${percent}%`;
                }
                saveBtn.innerText = "✅ TERSIMPAN DI FOLDER DOKUMEN!"; statusBox.innerText = `🎉 SUKSES! Video 720p tersimpan di folder Documents!`;
            } catch(fsError) {
                console.warn("Capacitor FS Error:", fsError);
                downloadBrowser();
            }
          } else {
            downloadBrowser();
          }
        } catch(e) { 
            console.warn("Fatal Error:", e);
            try { downloadBrowser(); } catch(err2) {
                saveBtn.innerText = "❌ GAGAL MENYIMPAN"; statusBox.innerText = "Terjadi Error: " + e.message; isSaving = false; 
            }
        }
      };
      
      const controlsDiv = document.getElementById('controls'); controlsDiv.appendChild(vid); controlsDiv.appendChild(saveBtn); controlsDiv.appendChild(fallbackBtn); saveBtn.scrollIntoView({ behavior: 'smooth' }); setTimeout(() => { if(!isSaving && window.Capacitor) saveBtn.click(); }, 1500);
    }
