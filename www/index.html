<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noir v.1 (720p - 40 Visualizers)</title>
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.5/fix-webm-duration.js"></script>
  <style>
    body { margin: 0; background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%); background-size: 20px 20px; background-color: #444; font-family: 'Segoe UI', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; touch-action: pan-y; }
    #canvas-wrapper { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; margin-top: 20px; border: 1px solid rgba(255, 255, 255, 0.3); background: transparent; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8); cursor: grab; overflow: hidden; }
    #canvas-wrapper:active { cursor: grabbing; }
    canvas { width: 100%; height: 100%; display: block; }
    #controls { width: 90%; max-width: 600px; background: #222; padding: 20px; border-radius: 12px; margin-top: 20px; border: 1px solid #444; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3); }
    .btn-group, .play-group { display: flex; gap: 8px; }
    .file-label { flex: 1; background: #333; color: #ccc; padding: 12px 5px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; border: 1px solid #555; transition: 0.2s; white-space: nowrap; }
    .file-label:hover { background: #444; color: white; }
    #playBtn { flex: 2; padding: 15px; background: #444; color: #888; border: 2px solid #333; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    #playBtn.ready { background: linear-gradient(135deg, #00d2ff, #e040fb); color: white; border: none; }
    #nextBtn { flex: 1; padding: 15px; background: #555; color: #aaa; border: 2px solid #444; border-radius: 8px; font-weight: bold; cursor: not-allowed; transition: 0.3s; }
    #nextBtn.ready { background: #333; color: white; border: 2px solid #555; cursor: pointer; }
    .progress-container { display: flex; align-items: center; gap: 10px; background: #333; padding: 8px; border-radius: 6px; border: 1px solid #444; }
    .time-text { font-size: 11px; font-family: monospace; color: #00d2ff; min-width: 40px; text-align: center; }
    #progressBar { flex: 1; height: 5px; -webkit-appearance: none; background: #555; border-radius: 5px; cursor: pointer; }
    #progressBar::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; background: #e040fb; border-radius: 50%; cursor: pointer; }
    .btn-record { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff4444, #d32f2f); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #stopOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(220, 20, 60, 0.95); color: white; padding: 15px 30px; border-radius: 50px; z-index: 100; font-weight: bold; border: 3px solid white; cursor: pointer; }
    #countdownOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: bold; color: white; text-shadow: 0 0 20px rgba(0, 0, 0, 0.8); z-index: 100; }
    #statusBox { font-size: 12px; text-align: center; color: #00d2ff; margin-bottom: 5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row { display: flex; align-items: center; gap: 10px; }
    label { font-size: 11px; width: 80px; color: #ccc; font-weight: 600; }
    input[type="range"], select { flex: 1; height: 36px; background: #333; color: white; border: 1px solid #555; border-radius: 6px; }
    input[type="file"] { display: none; }
    optgroup { background: #111; color: #00d2ff; font-weight: bold; }
  </style>
</head>

<body>

  <div id="canvas-wrapper">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="countdownOverlay">3</div>
    <div id="stopOverlay" onclick="stopRecording()">⏹ STOP & SIMPAN</div>
  </div>

  <div id="controls">
    <div id="statusBox">Siap. Noir v.1 Ultimate (40 Visualizers!).</div>
    <div class="btn-group">
      <label for="bgInput" class="file-label" style="border-bottom: 3px solid #00bcd4">1. FOTO LATAR</label>
      <label for="audioInput" class="file-label" style="border-bottom: 3px solid #e040fb">2. MUSIK (BANYAK)</label>
    </div>

    <div class="play-group">
      <button id="playBtn" onclick="togglePlay()">⚠ PUTAR MUSIK</button>
      <button id="nextBtn" onclick="playRandomSong(false)">⏭ NEXT</button>
    </div>

    <div class="progress-container">
      <span id="currTime" class="time-text">00:00</span>
      <input type="range" id="progressBar" value="0" min="0" step="0.1">
      <span id="durTime" class="time-text">00:00</span>
    </div>

    <input type="file" id="bgInput" accept="image/*">
    <input type="file" id="audioInput" accept="audio/*" multiple>

    <hr style="border: 0; border-top: 1px solid #444; width: 100%; margin: 5px 0;">

    <div class="row">
      <label style="color:#00d2ff;">VISUALIZER</label>
      <select id="visType">
        <optgroup label="=== KLASIK & VINTAGE (10) ===">
            <option value="vintage_bars">📊 1. Vintage Solid Bars</option>
            <option value="winamp_classic">📻 2. Winamp Classic Peaks</option>
            <option value="retro_oscilloscope">📺 3. CRT Oscilloscope</option>
            <option value="analog_vu">🎛️ 4. Analog VU Meter</option>
            <option value="step_eq">🧱 5. Step Block EQ</option>
            <option value="thin_eq">📏 6. Thin Line EQ</option>
            <option value="dotted_eq">⏺️ 7. Dotted Peak EQ</option>
            <option value="hollow_bars">🔲 8. Hollow Outline Bars</option>
            <option value="split_eq">⏸️ 9. Split Center EQ</option>
            <option value="led_matrix">🚥 10. LED Dot Matrix</option>
        </optgroup>
        <optgroup label="=== MODERN & GLOWING (10) ===">
            <option value="liquid_bar">💧 11. Liquid Glowing Bars</option>
            <option value="cyber_pulse">⚡ 12. Cyber Neon Pulse</option>
            <option value="mirror_bars">🪞 13. Mirrored Glass Bars</option>
            <option value="gradient_blocks">🎛️ 14. RGB Gradient Blocks</option>
            <option value="neon_laser">🎇 15. Neon Laser Beam</option>
            <option value="fire_flames">🔥 16. Burning Fire Flames</option>
            <option value="lightning_strike">⚡ 17. Lightning Strike</option>
            <option value="block_tower">🏙️ 18. 3D Block Tower</option>
            <option value="barcode_scanner">📟 19. Red Barcode Scanner</option>
            <option value="equalizer_3d">🛠️ 20. 3D Cylinder EQ</option>
        </optgroup>
        <optgroup label="=== GELOMBANG & GARIS (8) ===">
            <option value="modern_wave">🌊 21. Modern Smooth Wave</option>
            <option value="heartbeat">❤️ 22. EKG Heartbeat Pulse</option>
            <option value="double_line">🧬 23. Crossing DNA Lines</option>
            <option value="glitch_wave">👾 24. Digital Glitch Wave</option>
            <option value="sonic_wave">〰️ 25. Sonic Waveform</option>
            <option value="matrix_rain">🌧️ 26. Matrix Code Rain</option>
            <option value="dna_helix">🧬 27. Rotating DNA Helix</option>
            <option value="ghost_echo">👻 28. Ghost Echo Wave</option>
        </optgroup>
        <optgroup label="=== LINGKARAN & ORBIT (7) ===">
            <option value="circle_bars">🎡 29. Circular Audio Bars</option>
            <option value="sunburst">☀️ 30. Audio Sunburst</option>
            <option value="sound_bubble">🫧 31. Fluid Sound Bubble</option>
            <option value="neon_hex">🛑 32. Glowing Neon Hexagons</option>
            <option value="vinyl_record">💿 33. Spinning Vinyl Record</option>
            <option value="radar_sweep">📡 34. Radar Sweep Orbit</option>
            <option value="mandala_star">⚜️ 35. Mandala Starburst</option>
        </optgroup>
        <optgroup label="=== BENTUK UNIK & GEOMETRIS (5) ===">
            <option value="piano_keys">🎹 36. Pressing Piano Keys</option>
            <option value="floating_blocks">🧊 37. Zero-Gravity Blocks</option>
            <option value="shatter_glass">💎 38. Shattered Glass Erupt</option>
            <option value="retro_grid">🌐 39. Synthwave Floor Grid</option>
            <option value="starlight_flare">🌟 40. Starlight Flare Spikes</option>
        </optgroup>
      </select>
    </div>

    <div class="row"><label>TINGGI VIS.</label><input type="range" id="visHeight" min="30" max="600" value="150"></div>
    <div class="row"><label style="color:#00d2ff;">LEBAR VIS.</label><input type="range" id="visWidth" min="100" max="1100" value="400"></div>
    <div class="row"><label style="color:#e040fb;">OPASITAS VIS.</label><input type="range" id="visOpacity" min="0.1" max="1.0" step="0.05" value="1.0"></div>

    <div class="row"><label style="color:#ff9800;">UKURAN ASAP</label><input type="range" id="smokeSize" min="0.2" max="3.0" step="0.1" value="1.0"></div>
    <div class="row"><label style="color:#ff9800;">ARAH ASAP 1</label><input type="range" id="smokeAngle1" min="-60" max="60" value="0"></div>
    <div class="row"><label style="color:#ff9800;">ARAH ASAP 2</label><input type="range" id="smokeAngle2" min="-60" max="60" value="0"></div>

    <hr style="border: 0; border-top: 1px dashed #444; width: 100%; margin: 5px 0;">

    <div class="row">
      <label>EFEK FILM</label>
      <select id="type">
        <option value="vintage">🎞️ Vintage HD (Kotor, Debu, Rambut)</option>
        <option value="grain">🎬 Grains (Bintik & Debu Saja)</option>
        <option value="scratch">📽️ Scratches (Garis Vertikal Saja)</option>
        <option value="sepia_dust">📜 Sepia Dust (Klasik Coklat)</option>
        <option value="old_tv">📺 Old TV (Scanline & Noise)</option>
        <option value="flicker_8mm">🎞️ 8mm Flicker (Kedap-Kedip)</option>
        <option value="rain">🌧️ Hujan Realistis</option>
        <option value="snow">❄️ Salju Lembut</option>
        <option value="fireflies">✨ Kunang-Kunang</option>
        <option value="none">Tanpa Efek</option>
      </select>
    </div>

    <div class="row">
      <label>ARAH EFEK</label>
      <select id="fxAngle">
        <option value="0">Lurus (Normal)</option>
        <option value="15">Miring Kanan 15°</option>
        <option value="30">Miring Kanan 30°</option>
        <option value="-15">Miring Kiri 15°</option>
        <option value="-30">Miring Kiri 30°</option>
      </select>
    </div>

    <div class="row"><label>KECEPATAN</label><input type="range" id="fxSpeed" min="0.1" max="5.0" step="0.1" value="1.0"></div>
    <div class="row"><label>JUMLAH FX</label><input type="range" id="count" min="0" max="400" value="100"></div>

    <button class="btn-record" id="recordBtn" onclick="startCountdownAndRecord()">🔴 MULAI REKAM 720p</button>
  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    const statusBox = document.getElementById('statusBox');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const nextBtn = document.getElementById('nextBtn');
    const stopOverlay = document.getElementById('stopOverlay');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const recordBtn = document.getElementById('recordBtn');
    const progressBar = document.getElementById('progressBar');
    const currTimeEl = document.getElementById('currTime');
    const durTimeEl = document.getElementById('durTime');
    let isDraggingProgress = false;
    
    const width = 1280;
    const height = 720;

    let audioFiles = []; let currentObjectUrl = null; let currentSongName = ""; let playTimeout = null;
    let isTrackLoaded = false; let shuffledPlaylist = []; let currentPlayIndex = 0; let isCountingDown = false; let countdownTimer = null;

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; }
      return array;
    }

    document.getElementById('audioInput').addEventListener('change', function(e) {
      if (this.files.length > 0) {
        audioFiles = Array.from(this.files); isTrackLoaded = true; shuffledPlaylist = shuffle(Array.from({ length: audioFiles.length }, (v, k) => k));
        currentPlayIndex = 0; playBtn.innerHTML = "▶ PLAY MUSIK"; playBtn.classList.add('ready'); nextBtn.classList.add('ready');
        statusBox.innerText = `${audioFiles.length} Lagu dimuat. Siap diputar!`; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
        audioPlayer.pause(); if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; currentSongName = "Musik Diunggah";
      }
    });

    function playRandomSong(isInstant = false) {
      if (audioFiles.length === 0) return;
      if (playTimeout) clearTimeout(playTimeout);
      if (currentPlayIndex >= shuffledPlaylist.length) { currentPlayIndex = 0; stopEverything(); return; }
      if (currentObjectUrl && isInstant) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
      const delayAmount = isInstant ? 0 : 3500;
      if (!isInstant) {
        audioPlayer.pause(); playBtn.innerText = "⏳ TUNGGU..."; statusBox.innerText = "⏳ Jeda pergantian lagu...";
        currentSongName = "Memuat..."; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
      }
      playTimeout = setTimeout(() => {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        const actualFileIndex = shuffledPlaylist[currentPlayIndex]; const selectedFile = audioFiles[actualFileIndex];
        currentSongName = selectedFile.name.replace(/\.[^/.]+$/, ""); currentObjectUrl = URL.createObjectURL(selectedFile);
        audioPlayer.src = currentObjectUrl; audioPlayer.load();
        if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
        audioPlayer.play().then(() => { playBtn.innerText = "⏸ PAUSE"; statusBox.innerText = `🎵 Lagu ${currentPlayIndex + 1}/${audioFiles.length}: ${currentSongName}`; currentPlayIndex++; }).catch(err => { playBtn.innerText = "❌ ERROR"; });
      }, delayAmount);
    }

    audioPlayer.addEventListener('ended', () => { playRandomSong(false); });

    function stopEverything() {
      audioPlayer.pause(); if (playTimeout) clearTimeout(playTimeout);
      if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; currentSongName = "Playlist Selesai";
      if (dataArray) dataArray.fill(0); shuffledPlaylist = shuffle(Array.from({ length: audioFiles.length }, (v, k) => k));
      statusBox.innerText = `✅ Semua lagu selesai.`; playBtn.innerText = "▶ PLAY ACAK"; progressBar.value = 0; currTimeEl.innerText = "00:00"; durTimeEl.innerText = "00:00";
      if (mediaRecorder && mediaRecorder.state === 'recording') { statusBox.innerText = `✅ Menyimpan rekaman otomatis...`; setTimeout(() => { stopRecording(); }, 500); }
    }

    let visW = 400; let visX = (width - visW) / 2; let visY = height - 160;
    let smokeX = 150; let smokeY = height - 150; let smokeX2 = width - 250; let smokeY2 = height - 150;
    let isDraggingSmoke = false; let isDraggingSmoke2 = false; let isDraggingVis = false;
    let dragOffsetX = 0; let dragOffsetY = 0;

    function getMousePos(e) {
      const rect = canvas.getBoundingClientRect(); const scaleX = canvas.width / rect.width; const scaleY = canvas.height / rect.height;
      let clientX = e.clientX; let clientY = e.clientY;
      if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function startDrag(e) {
      const pos = getMousePos(e); const sScale = parseFloat(document.getElementById('smokeSize').value);
      const distSmoke = Math.hypot(pos.x - smokeX, pos.y - smokeY);
      if (distSmoke <= Math.max(40, 30 * sScale)) { isDraggingSmoke = true; dragOffsetX = pos.x - smokeX; dragOffsetY = pos.y - smokeY; if (e.cancelable) e.preventDefault(); return; }
      const distSmoke2 = Math.hypot(pos.x - smokeX2, pos.y - smokeY2);
      if (distSmoke2 <= Math.max(40, 30 * sScale)) { isDraggingSmoke2 = true; dragOffsetX = pos.x - smokeX2; dragOffsetY = pos.y - smokeY2; if (e.cancelable) e.preventDefault(); return; }
      if (pos.x >= visX && pos.x <= visX + visW && pos.y >= visY - 150 && pos.y <= visY + 150) { isDraggingVis = true; dragOffsetX = pos.x - visX; dragOffsetY = pos.y - visY; if (e.cancelable) e.preventDefault(); }
    }

    function drag(e) {
      if (!isDraggingVis && !isDraggingSmoke && !isDraggingSmoke2) return;
      const pos = getMousePos(e);
      if (isDraggingSmoke) { smokeX = pos.x - dragOffsetX; smokeY = pos.y - dragOffsetY; if (e.cancelable) e.preventDefault(); return; }
      if (isDraggingSmoke2) { smokeX2 = pos.x - dragOffsetX; smokeY2 = pos.y - dragOffsetY; if (e.cancelable) e.preventDefault(); return; }
      if (isDraggingVis) { visX = pos.x - dragOffsetX; visY = pos.y - dragOffsetY; if (e.cancelable) e.preventDefault(); }
    }

    function endDrag() { isDraggingVis = false; isDraggingSmoke = false; isDraggingSmoke2 = false; }
    canvas.addEventListener('mousedown', startDrag); canvas.addEventListener('mousemove', drag); window.addEventListener('mouseup', endDrag);
    canvas.addEventListener('touchstart', startDrag, { passive: false }); canvas.addEventListener('touchmove', drag, { passive: false }); window.addEventListener('touchend', endDrag);

    let audioCtx, source, mediaStreamDestination, analyser, dataArray;
    let isAudioInit = false; let peakHeights = new Array(120).fill(0);

    function formatTime(seconds) {
      if (isNaN(seconds) || !isFinite(seconds)) return "00:00";
      const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60);
      return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function initAudioContext() {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext(); analyser = audioCtx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.8;
      source = audioCtx.createMediaElementSource(audioPlayer); mediaStreamDestination = audioCtx.createMediaStreamDestination();
      source.connect(analyser); analyser.connect(audioCtx.destination); analyser.connect(mediaStreamDestination);
      dataArray = new Uint8Array(analyser.frequencyBinCount); isAudioInit = true;
    }

    let isBgReady = false; let bgImageElement = new Image();
    document.getElementById('bgInput').addEventListener('change', function(e) {
      if (this.files[0]) {
        const file = this.files[0];
        if (file.type.startsWith('image/')) {
          const fileURL = URL.createObjectURL(file); bgImageElement.src = fileURL;
          bgImageElement.onload = () => { isBgReady = true; statusBox.innerText = "✅ Foto Latar Oke."; };
        } else { alert("Harap unggah file berbentuk Gambar/Foto (JPG, PNG)."); }
      }
    });

    audioPlayer.addEventListener('loadedmetadata', () => { if (isFinite(audioPlayer.duration)) { durTimeEl.innerText = formatTime(audioPlayer.duration); progressBar.max = 100; } });
    audioPlayer.addEventListener('timeupdate', () => {
      if (isFinite(audioPlayer.duration) && durTimeEl.innerText === "00:00") durTimeEl.innerText = formatTime(audioPlayer.duration);
      if (!isDraggingProgress) { const percent = (audioPlayer.currentTime / audioPlayer.duration) * 100; progressBar.value = isNaN(percent) ? 0 : percent; currTimeEl.innerText = formatTime(audioPlayer.currentTime); }
    });

    progressBar.addEventListener('input', () => {
      isDraggingProgress = true;
      if (audioPlayer.duration) { const seekTime = (progressBar.value / 100) * audioPlayer.duration; currTimeEl.innerText = formatTime(seekTime); audioPlayer.currentTime = seekTime; }
    });
    const releaseSeek = () => { isDraggingProgress = false; };
    progressBar.addEventListener('change', releaseSeek); progressBar.addEventListener('touchend', releaseSeek); progressBar.addEventListener('mouseup', releaseSeek);

    function togglePlay() {
      if (!isTrackLoaded) { alert("Pilih Musik Dulu!"); return; }
      if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
      if (audioPlayer.paused) {
        if (!audioPlayer.src || currentPlayIndex >= shuffledPlaylist.length) playRandomSong(true);
        else { audioPlayer.play(); playBtn.innerText = "⏸ PAUSE"; statusBox.innerText = `🎵 Lagu ${currentPlayIndex}/${audioFiles.length}: ${currentSongName}`; }
      } else { audioPlayer.pause(); playBtn.innerText = "▶ RESUME"; statusBox.innerText = "⏸ Musik Dijeda."; }
    }

    const config = { type: 'vintage', count: 100, visType: 'vintage_bars', visHeight: 150, visOpacity: 1.0, fxAngle: 0, fxSpeed: 1.0 };
    document.getElementById('visType').addEventListener('change', (e) => { config.visType = e.target.value; peakHeights.fill(0); });
    document.getElementById('visOpacity').addEventListener('input', (e) => config.visOpacity = parseFloat(e.target.value));
    document.getElementById('type').addEventListener('change', (e) => config.type = e.target.value);
    document.getElementById('fxAngle').addEventListener('change', (e) => config.fxAngle = parseInt(e.target.value));
    document.getElementById('fxSpeed').addEventListener('input', (e) => config.fxSpeed = parseFloat(e.target.value));
    document.getElementById('count').addEventListener('input', (e) => config.count = parseInt(e.target.value));
    document.getElementById('visHeight').addEventListener('input', (e) => config.visHeight = parseInt(e.target.value));
    document.getElementById('visWidth').addEventListener('input', (e) => { visW = parseInt(e.target.value); visX = (width - visW) / 2; });

    let time = 0;

    class RealisticFilmJitter {
      constructor() { this.reset(); }
      reset() {
        this.x = (Math.random() * width * 1.5) - (width * 0.25); this.y = (Math.random() * height * 1.5) - (height * 0.25);
        this.life = Math.random() * 5 + 2; this.alpha = Math.random() * 0.5 + 0.1;
        const rand = Math.random();
        if (rand < 0.05) { this.pType = 'scratch'; this.length = Math.random() * height / 2 + 100; this.color = Math.random() > 0.5 ? `rgba(255,255,255,${this.alpha*0.6})` : `rgba(0,0,0,${this.alpha*0.8})`; } 
        else if (rand < 0.15) { this.pType = 'hair'; this.cp1x = (Math.random() - 0.5) * 80; this.cp1y = (Math.random() - 0.5) * 80; this.cp2x = (Math.random() - 0.5) * 80; this.cp2y = (Math.random() - 0.5) * 80; this.endX = (Math.random() - 0.5) * 100; this.endY = (Math.random() - 0.5) * 100; this.color = `rgba(0, 0, 0, ${this.alpha * 1.2})`; } 
        else { this.pType = 'dust'; this.radius = Math.random() * 3 + 1.0; this.color = Math.random() > 0.6 ? `rgba(0,0,0,${this.alpha})` : `rgba(255,255,255,${this.alpha*0.6})`; }
      }
      update() { if (['none', 'rain', 'snow', 'fireflies'].includes(config.type)) return; this.life -= config.fxSpeed; if (this.life <= 0) this.reset(); }
      draw() {
        if (['none', 'rain', 'snow', 'fireflies'].includes(config.type)) return;
        let showDustHair = ['vintage', 'grain', 'sepia_dust', 'flicker_8mm'].includes(config.type);
        let showScratch = ['vintage', 'scratch', 'sepia_dust', 'flicker_8mm'].includes(config.type);

              for(let i=0; i<bars; i++) { let val = getSymmetricVal(i, bars, bufferLen) * config.visHeight; let angle = (i * Math.PI * 2) / bars; ctx.save(); ctx.translate(cx_c, cy_c); ctx.rotate(angle); let grad = ctx.createLinearGradient(0, radius, 0, radius + val); grad.addColorStop(0, '#ffeb3b'); grad.addColorStop(1, '#ff3b3b'); ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(-1.5, radius); ctx.lineTo(1.5, radius); ctx.lineTo(4, radius + Math.max(5, val)); ctx.lineTo(-4, radius + Math.max(5, val)); ctx.fill(); ctx.restore(); }
          }
          else if (style === 'sound_bubble') {
            ctx.beginPath();
            for(let i=0; i<=60; i++) { let angle = i * Math.PI*2 / 60; let val = getSymmetricVal(i, 60, bufferLen); let r = config.visHeight*0.4 + val * config.visHeight * 0.6 + Math.sin(time*3+i)*5; let px = cx_c + Math.cos(angle)*r; let py = cy_c + Math.sin(angle)*r; if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
            ctx.closePath(); let grad = ctx.createRadialGradient(cx_c, cy_c, 0, cx_c, cy_c, config.visHeight); grad.addColorStop(0, 'rgba(255,0,255,0.8)'); grad.addColorStop(1, 'rgba(0,255,255,0)'); ctx.fillStyle = grad; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
          }
          else if (style === 'neon_hex') {
            let numHex = 15; let spacing = visW/numHex;
            function drawHex(x, y, r, val) { ctx.beginPath(); for(let i=0; i<6; i++) { let angle = i * Math.PI/3; let hx = x + Math.cos(angle)*r; let hy = y + Math.sin(angle)*r; if(i===0) ctx.moveTo(hx,hy); else ctx.lineTo(hx,hy); } ctx.closePath(); ctx.strokeStyle = `rgba(0, 255, 255, ${val})`; ctx.lineWidth = 2; ctx.shadowBlur = val*20; ctx.shadowColor = '#0ff'; ctx.stroke(); ctx.shadowBlur=0; }
            for(let i=0; i<numHex; i++) { let val = getSymmetricVal(i, numHex, bufferLen); drawHex(i*spacing + spacing/2, cy_c + Math.sin(i+time)*20, spacing*0.4 + val*15, val); }
          }
          else if (style === 'vinyl_record') {
            let bass = getSymmetricVal(10, 20, bufferLen); ctx.save(); ctx.translate(cx_c, cy_c); ctx.rotate(time); ctx.beginPath(); ctx.arc(0,0, config.visHeight*0.5 + bass*20, 0, Math.PI*2); ctx.fillStyle = '#111'; ctx.fill(); ctx.lineWidth = 1.5;
            for(let i=0; i<5; i++) { let val = getSymmetricVal(i*4, 20, bufferLen); ctx.beginPath(); ctx.arc(0,0, config.visHeight*0.1 + i*15, 0, Math.PI*2); ctx.strokeStyle = `rgba(255,255,255,${0.1 + val*0.5})`; ctx.stroke(); }
            ctx.beginPath(); ctx.arc(0,0, 25, 0, Math.PI*2); ctx.fillStyle = '#ff3b3b'; ctx.fill(); ctx.beginPath(); ctx.arc(0,0, 5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
          }
          else if (style === 'radar_sweep') {
            let rMax = config.visHeight*0.6; ctx.save(); ctx.translate(cx_c, cy_c); ctx.beginPath(); ctx.arc(0,0, rMax, 0, Math.PI*2); ctx.strokeStyle='rgba(0,255,0,0.3)'; ctx.lineWidth=2; ctx.stroke(); ctx.beginPath(); ctx.arc(0,0, rMax/2, 0, Math.PI*2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-rMax,0); ctx.lineTo(rMax,0); ctx.moveTo(0,-rMax); ctx.lineTo(0,rMax); ctx.stroke();
            ctx.rotate(time*2); let grad = ctx.createConicGradient ? ctx.createConicGradient(0, 0, 0) : null; 
            if(grad) { grad.addColorStop(0, 'rgba(0,255,0,0)'); grad.addColorStop(0.8, 'rgba(0,255,0,0.1)'); grad.addColorStop(1, 'rgba(0,255,0,0.8)'); ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0, rMax, 0, Math.PI/4); ctx.closePath(); ctx.fillStyle = grad; ctx.fill(); }
            let dots = 10; for(let i=0; i<dots; i++) { let val = getSymmetricVal(i, dots, bufferLen); if(val > 0.3) { ctx.beginPath(); ctx.arc(Math.cos(i)*rMax*0.8, Math.sin(i)*rMax*0.8, val*8, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.shadowBlur=10; ctx.shadowColor='#0f0'; ctx.fill(); } } ctx.restore();
          }
          else if (style === 'mandala_star') {
            let points = 8; ctx.save(); ctx.translate(cx_c, cy_c); ctx.rotate(time*0.5);
            for(let i=0; i<points; i++) { ctx.rotate(Math.PI*2 / points); let val = getSymmetricVal(i, points, bufferLen); ctx.beginPath(); ctx.moveTo(0, 0); ctx.bezierCurveTo(20 + val*30, 20, 20 + val*30, 80 + val*config.visHeight, 0, 100 + val*config.visHeight); ctx.bezierCurveTo(-20 - val*30, 80 + val*config.visHeight, -20 - val*30, 20, 0, 0); ctx.fillStyle = `rgba(0, 200, 255, ${0.2 + val*0.5})`; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke(); } ctx.restore();
          }
        }

        // --- BENTUK UNIK & GEOMETRIS (36-40) ---
        else if (style === 'piano_keys') {
          let numBars = 36; let spacing = visW / numBars; let barW = spacing * 0.8;
          for (let i = 0; i < numBars; i++) { let val = getSymmetricVal(i, numBars, bufferLen); let isBlack = [1,3,6,8,10].includes(i%12); let h = isBlack ? config.visHeight*0.6 : config.visHeight; let press = val * 20; ctx.fillStyle = isBlack ? '#222' : '#fff'; ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.fillRect(i * spacing, cy + press - h, barW, h); ctx.strokeRect(i * spacing, cy + press - h, barW, h); if(val > 0.2) { ctx.fillStyle = `rgba(0, 210, 255, ${val})`; ctx.fillRect(i * spacing, cy + press - 8, barW, 8); } }
        }
        else if (style === 'floating_blocks') {
          let numBars = 30; let spacing = visW / numBars; let barW = spacing * 0.7;
          for (let i = 0; i < numBars; i++) { let val = getSymmetricVal(i, numBars, bufferLen) * config.visHeight; ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fillRect(i * spacing, cy - val, barW, 10); if(val > 10) { ctx.fillStyle = 'rgba(255, 255, 255, 0.3)'; ctx.fillRect(i * spacing, cy - val + 15, barW, val - 15); } }
        }
        else if (style === 'shatter_glass') {
          let numShards = 30; let cx_s = visW/2;
          for(let i=0; i<numShards; i++) { let val = getSymmetricVal(i, numShards, bufferLen); let angle = (i * Math.PI*2)/numShards; let len = val * config.visHeight; ctx.beginPath(); ctx.moveTo(cx_s, cy-50); ctx.lineTo(cx_s + Math.cos(angle-0.1)*len*0.5, cy-50 + Math.sin(angle-0.1)*len*0.5); ctx.lineTo(cx_s + Math.cos(angle)*len, cy-50 + Math.sin(angle)*len); ctx.lineTo(cx_s + Math.cos(angle+0.1)*len*0.5, cy-50 + Math.sin(angle+0.1)*len*0.5); ctx.closePath(); ctx.fillStyle = `rgba(255,255,255,${val*0.8})`; ctx.fill(); ctx.strokeStyle='#aaa'; ctx.stroke(); }
        }
        else if (style === 'retro_grid') {
          let lines = 20; let cx_g = visW/2; let bassVal = getSymmetricVal(lines/2, lines, bufferLen); let horizon = cy - config.visHeight/2 + bassVal*30; ctx.strokeStyle = '#e040fb'; ctx.lineWidth = 2; ctx.shadowBlur = 10; ctx.shadowColor = '#e040fb';
          for(let i=0; i<=lines; i++) { ctx.beginPath(); ctx.moveTo(cx_g, horizon); let xDest = (i/lines)*visW*3 - visW; ctx.lineTo(xDest, cy + 100); ctx.stroke(); }
          for(let j=0; j<5; j++) { let yDest = cy + 100 - (j*20) - (time*10)%20; if (yDest > horizon) { ctx.beginPath(); ctx.moveTo(-visW, yDest); ctx.lineTo(visW*2, yDest); ctx.stroke(); } } ctx.shadowBlur=0;
        }
        else if (style === 'starlight_flare') {
          let cx_st = visW/2; let cy_st = cy - 50; let points = 16; ctx.beginPath();
          for(let i=0; i<=points*2; i++) { let angle = i * Math.PI / points; let val = getSymmetricVal(Math.floor(i/2), points, bufferLen); let r = (i%2===0) ? (50 + val*config.visHeight) : 20; let x = cx_st + Math.cos(angle)*r; let y = cy_st + Math.sin(angle)*r; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
          ctx.closePath(); let grad = ctx.createRadialGradient(cx_st, cy_st, 0, cx_st, cy_st, config.visHeight); grad.addColorStop(0, '#fff'); grad.addColorStop(0.2, '#ffeb3b'); grad.addColorStop(1, 'rgba(255,0,0,0)'); ctx.fillStyle = grad; ctx.fill();
        }

      } catch (e) {}
      ctx.restore();
    }

    function drawPureAnimatedVectorSmoke() {
      let smokeScale = parseFloat(document.getElementById('smokeSize').value);
      let smokeAng1 = parseFloat(document.getElementById('smokeAngle1').value) * Math.PI / 180;
      ctx.save(); ctx.translate(smokeX, smokeY); ctx.rotate(smokeAng1); ctx.scale(smokeScale, smokeScale);
      function drawBranch(height, maxW, waveFreq, speedMult, xOffsetBase) {
        let points = []; let steps = 50;
        for (let i = 0; i <= steps; i++) {
          let prog = i / steps; let w = Math.sin(prog * Math.PI) * maxW; if (prog > 0.6) w *= Math.pow(1 - prog + 0.05, 0.6);
          let speed = time * speedMult; let envelope = Math.pow(prog, 0.8); let x = Math.sin(prog * Math.PI * waveFreq - speed) * 70 * envelope;
          x += xOffsetBase * prog; let y = -prog * height; points.push({ x, y, w });
        }
        function drawPolygon(widthMult, offsetX, color) {
          ctx.beginPath();
          for (let i = 0; i < points.length; i++) { let px = points[i].x + offsetX - (points[i].w * widthMult); if (i === 0) ctx.moveTo(px, points[i].y); else ctx.lineTo(px, points[i].y); }
          for (let i = points.length - 1; i >= 0; i--) { let px = points[i].x + offsetX + (points[i].w * widthMult); ctx.lineTo(px, points[i].y); }
          ctx.closePath(); ctx.fillStyle = color; ctx.fill();
        }
        drawPolygon(1.4, 0, 'rgba(180, 185, 190, 0.15)'); drawPolygon(1.0, 0, 'rgba(220, 225, 230, 0.25)'); drawPolygon(0.35, -maxW * 0.25, 'rgba(255, 255, 255, 0.3)');
      }
      drawBranch(550, 15, 2.0, 4.0, 0); drawBranch(380, 8, 2.5, 3.2, -30); drawBranch(300, 6, 3.0, 3.5, 35);
      ctx.restore();
    }

    function drawNewAnimatedVectorSmoke() {
      let smokeScale = parseFloat(document.getElementById('smokeSize').value);
      let smokeAng2 = parseFloat(document.getElementById('smokeAngle2').value) * Math.PI / 180;
      ctx.save(); ctx.translate(smokeX2, smokeY2); ctx.rotate(smokeAng2); ctx.scale(smokeScale, smokeScale);
      function drawBillow(height, maxW, waveFreq, speedMult, xOffsetBase) {
        let points = []; let steps = 40;
        for (let i = 0; i <= steps; i++) {
          let prog = i / steps; let w = Math.sin(prog * Math.PI) * maxW * (1 + prog * 1.5); if (prog > 0.4) w *= Math.pow(1.2 - prog, 1.2);
          let speed = time * speedMult; let turb = Math.sin(prog * 15 - speed * 2) * 15 * prog;
          let x = Math.sin(prog * Math.PI * waveFreq - speed) * 60 * prog + turb; x += xOffsetBase * prog; let y = -prog * height; points.push({ x, y, w });
        }
        function drawPolygon(widthMult, offsetX, color) {
          ctx.beginPath();
          for (let i = 0; i < points.length; i++) { let px = points[i].x + offsetX - (points[i].w * widthMult); if (i === 0) ctx.moveTo(px, points[i].y); else ctx.lineTo(px, points[i].y); }
          for (let i = points.length - 1; i >= 0; i--) { let px = points[i].x + offsetX + (points[i].w * widthMult); ctx.lineTo(px, points[i].y); }
          ctx.closePath(); ctx.fillStyle = color; ctx.fill();
        }
        drawPolygon(1.8, 0, 'rgba(100, 105, 110, 0.15)'); drawPolygon(1.2, 0, 'rgba(150, 155, 160, 0.2)'); drawPolygon(0.5, -maxW * 0.1, 'rgba(220, 220, 225, 0.25)');
      }
      drawBillow(500, 25, 1.5, 2.5, 20); drawBillow(400, 18, 2.0, 3.0, -35);
      ctx.restore();
    }

    function animate() {
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, width, height); time += (0.05 * config.fxSpeed); 
      ctx.save();
      
      if (['vintage', 'grain', 'scratch', 'sepia_dust', 'old_tv', 'flicker_8mm'].includes(config.type)) { const jitterX = (Math.random() - 0.5) * 1.5; const jitterY = (Math.random() - 0.5) * 1.5; ctx.translate(jitterX, jitterY); }
      if (isBgReady) { const scale = Math.max(width / bgImageElement.width, height / bgImageElement.height); const x = (width / 2) - (bgImageElement.width / 2) * scale; const y = (height / 2) - (bgImageElement.height / 2) * scale; ctx.drawImage(bgImageElement, x, y, bgImageElement.width * scale, bgImageElement.height * scale); }
      
      if (config.type === 'sepia_dust') { ctx.fillStyle = 'rgba(112, 66, 20, 0.35)'; ctx.fillRect(-10, -10, width+20, height+20); } 
      else if (config.type === 'old_tv') { ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; for (let i = 0; i < height; i += 4) { ctx.fillRect(0, i, width, 1.5); } ctx.fillStyle = 'rgba(0, 255, 0, 0.05)'; ctx.fillRect(-10, -10, width+20, height+20); } 
      else if (config.type === 'flicker_8mm') { let flicker = Math.random() * 0.25; ctx.fillStyle = `rgba(0, 0, 0, ${flicker})`; ctx.fillRect(-10, -10, width+20, height+20); } 
      else if (config.type !== 'none') { ctx.fillStyle = "rgba(10, 5, 0, 0.1)"; ctx.fillRect(-10, -10, width+20, height+20); }

      if (isAudioInit && currentObjectUrl) {
        if (!audioPlayer.paused) analyser.getByteFrequencyData(dataArray); else for (let i = 0; i < dataArray.length; i++) dataArray[i] = Math.max(0, dataArray[i] - 10);
        drawVisualizer(analyser.frequencyBinCount);
      }

      drawPureAnimatedVectorSmoke(); drawNewAnimatedVectorSmoke();
      
      for (let i = 0; i < config.count; i++) { if (particles[i]) { particles[i].update(); particles[i].draw(); } if (weatherParticles[i]) { weatherParticles[i].update(); weatherParticles[i].draw(); } }

      if (config.type !== 'none') { const grad = ctx.createRadialGradient(width/2, height/2, height*0.4, width/2, height/2, width*0.8); grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.7)'); ctx.fillStyle = grad; ctx.fillRect(-10, -10, width+20, height+20); }

      ctx.restore(); requestAnimationFrame(animate);
    }
    animate();

    let mediaRecorder, chunks = []; let recordStartTime = 0;
    function startCountdownAndRecord() {
      if (!isAudioInit || !currentObjectUrl) { alert("Pilih dan siapkan musik dulu!"); return; }
      if (isCountingDown) { clearInterval(countdownTimer); isCountingDown = false; countdownOverlay.style.display = 'none'; recordBtn.innerText = "🔴 MULAI REKAM 720p"; return; }
      isCountingDown = true; let counter = 3; countdownOverlay.innerText = counter; countdownOverlay.style.display = 'block'; recordBtn.innerText = "❌ BATALKAN REKAM (" + counter + ")";
      countdownTimer = setInterval(() => { counter--; if (counter > 0) { countdownOverlay.innerText = counter; recordBtn.innerText = "❌ BATALKAN REKAM (" + counter + ")"; } else { clearInterval(countdownTimer); isCountingDown = false; countdownOverlay.style.display = 'none'; executeRecording(); } }, 1000);
    }

    function executeRecording() {
      if (!audioCtx) initAudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume();
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) { window.Capacitor.Plugins.KeepAwake.keepAwake(); }
      audioPlayer.play(); playBtn.innerText = "⏸ PAUSE"; stopOverlay.style.display = 'block'; statusBox.innerText = "🔴 Merekam Video 720p..."; recordBtn.innerText = "🔴 SEDANG MEREKAM";
      const stream = canvas.captureStream(30); const combined = new MediaStream([...stream.getVideoTracks(), mediaStreamDestination.stream.getAudioTracks()[0]]);
      let options = { mimeType: 'video/webm;codecs=vp8,opus' }; if (!MediaRecorder.isTypeSupported(options.mimeType)) { options = { mimeType: 'video/webm' }; }
      try { mediaRecorder = new MediaRecorder(combined, options); } catch (e) { mediaRecorder = new MediaRecorder(combined); }
      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); }; mediaRecorder.onstop = saveVideoWebM; chunks = []; recordStartTime = Date.now(); mediaRecorder.start();
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake) window.Capacitor.Plugins.KeepAwake.allowSleep();
      audioPlayer.pause(); playBtn.innerText = "▶ PLAY"; stopOverlay.style.display = 'none'; recordBtn.innerText = "🔴 MULAI REKAM 720p"; statusBox.innerText = "Menyiapkan file video..."; if (playTimeout) clearTimeout(playTimeout);
    }

    function saveVideoWebM() {
      const blob = new Blob(chunks, { type: 'video/webm' }); const recordDuration = Date.now() - recordStartTime; statusBox.innerText = "⏳ Menjahit durasi (Biar bisa di-skip)...";
      if (typeof ysFixWebmDuration === 'function') { try { ysFixWebmDuration(blob, recordDuration, function(fixedBlob) { triggerDownload(fixedBlob); }, {logger: false}); } catch (error) { triggerDownload(blob); } } else { triggerDownload(blob); }
    }

    function triggerDownload(finalBlob) {
      statusBox.innerText = "⏳ Memproses pemotongan file video..."; const url = URL.createObjectURL(finalBlob);
      const oldVid = document.getElementById('previewVid'); if(oldVid) oldVid.remove(); const oldBtn = document.getElementById('shareBtnDewa'); if(oldBtn) oldBtn.remove();
      const vid = document.createElement('video'); vid.id = 'previewVid'; vid.src = url; vid.controls = true; vid.setAttribute('controlsList', 'nodownload'); vid.style.width = "100%"; vid.style.marginTop = "20px"; vid.style.border = "3px solid #00d2ff"; vid.style.borderRadius = "8px";
      const saveBtn = document.createElement('button'); saveBtn.id = 'shareBtnDewa'; saveBtn.innerText = "📥 SIMPAN VIDEO KE HP / PC"; saveBtn.style.width = "100%"; saveBtn.style.padding = "15px"; saveBtn.style.marginTop = "10px"; saveBtn.style.background = "linear-gradient(135deg, #00ffaa, #00bcd4)"; saveBtn.style.color = "black"; saveBtn.style.border = "none"; saveBtn.style.borderRadius = "8px"; saveBtn.style.fontWeight = "bold"; saveBtn.style.fontSize = "14px"; saveBtn.style.cursor = "pointer";
      let isSaving = false;
      saveBtn.onclick = async () => {
        if (isSaving) return; isSaving = true; saveBtn.innerText = "⏳ MEMULAI PROSES SIMPAN...";
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
            const FS = window.Capacitor.Plugins.Filesystem; const fileName = `Noir_v1_720p_${Date.now()}.webm`; await FS.writeFile({ path: fileName, data: "", directory: 'DOCUMENTS' });
            const chunkSize = 1572864; const totalChunks = Math.ceil(finalBlob.size / chunkSize);
            for (let i = 0; i < totalChunks; i++) {
              const start = i * chunkSize; const end = Math.min(start + chunkSize, finalBlob.size); const chunk = finalBlob.slice(start, end);
              const base64Chunk = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(chunk); });
              await FS.appendFile({ path: fileName, data: base64Chunk, directory: 'DOCUMENTS' });
              const percent = Math.round(((i + 1) / totalChunks) * 100); statusBox.innerText = `⏳ Menulis ke memori HP... ${percent}%`; saveBtn.innerText = `⏳ MENYIMPAN... ${percent}%`;
            }
            saveBtn.innerText = "✅ TERSIMPAN DI DOCUMENTS HP!"; statusBox.innerText = `🎉 SUKSES! Video 720p tersimpan di folder Documents!`;
          } else {
            statusBox.innerText = "⏳ Mengunduh lewat Browser..."; const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `Noir_v1_720p_${Date.now()}.webm`; document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); }, 100); saveBtn.innerText = "✅ VIDEO SUKSES DIUNDUH!"; statusBox.innerText = `🎉 SUKSES! Video berhasil diunduh ke perangkat Anda.`;
          }
        } catch(e) { saveBtn.innerText = "❌ GAGAL MENYIMPAN"; statusBox.innerText = "Terjadi Error: " + e.message; isSaving = false; }
      };
      const controlsDiv = document.getElementById('controls'); controlsDiv.appendChild(vid); controlsDiv.appendChild(saveBtn); saveBtn.scrollIntoView({ behavior: 'smooth' }); setTimeout(() => { if(!isSaving) saveBtn.click(); }, 1500);
    }
