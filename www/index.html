<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Mirror Final 1</title>
  <script src="https://cdn.jsdelivr.net/npm/fix-webm-duration@1.0.5/fix-webm-duration.js"></script>
  <style>
    body { margin: 0; background-color: #111; font-family: 'Segoe UI', sans-serif; color: white; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 50px; touch-action: pan-y; overflow-x: hidden; }
    #canvas-wrapper { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16/9; margin-top: 15px; border: 1px solid rgba(255, 255, 255, 0.2); background: #000; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9); overflow: hidden; touch-action: none; }
    canvas { width: 100%; height: 100%; display: block; transform-origin: 0 0; will-change: transform; }
    
    .zoom-toolbar { width: 96%; max-width: 800px; display: flex; align-items: center; justify-content: space-between; background: #181818; border: 1px solid #333; border-radius: 8px; padding: 6px 12px; margin-top: 8px; box-sizing: border-box; gap: 8px; }
    .zoom-toolbar label { font-size: 10px; color: #00e5ff; font-weight: bold; white-space: nowrap; text-transform: uppercase; }
    .zoom-btn-group { display: flex; gap: 4px; }
    .btn-zoom { background: #2a2a2a; border: 1px solid #444; color: #ddd; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .btn-zoom.active { background: #00bcd4; color: #000; border-color: #00e5ff; }
    
    #controls { width: 96%; max-width: 800px; background: #1a1a1a; padding: 12px; border-radius: 12px; margin-top: 10px; border: 1px solid #333; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5); box-sizing: border-box; }
    .btn-group, .play-group { display: flex; gap: 8px; width: 100%; }
    .file-label { flex: 1; background: #2b2b2b; color: #ccc; padding: 10px 5px; text-align: center; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; border: 1px solid #444; transition: 0.2s; white-space: nowrap; }
    .file-label:hover { background: #3b3b3b; color: white; }
    #playBtn { flex: 2; padding: 12px; background: #333; color: #888; border: 1px solid #222; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
    #playBtn.ready { background: linear-gradient(135deg, #d4af37, #00e5ff); color: #111; border: none; }
    #nextBtn { flex: 1; padding: 12px; background: #444; color: #aaa; border: 1px solid #333; border-radius: 8px; font-weight: bold; cursor: not-allowed; transition: 0.3s; }
    #nextBtn.ready { background: #2a2a2a; color: white; border: 1px solid #555; cursor: pointer; }
    
    .progress-container { display: flex; align-items: center; gap: 8px; background: #222; padding: 8px; border-radius: 8px; border: 1px solid #333; }
    .time-text { font-size: 10px; font-family: monospace; color: #d4af37; min-width: 35px; text-align: center; }
    #progressBar { flex: 1; height: 5px; -webkit-appearance: none; background: #444; border-radius: 5px; cursor: pointer; }
    #progressBar::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: #00e5ff; border-radius: 50%; cursor: pointer; }
    .btn-record { width: 100%; padding: 15px; background: linear-gradient(135deg, #ff4444, #d32f2f); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; }
    
    #stopOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(220, 20, 60, 0.95); color: white; padding: 15px 30px; border-radius: 50px; z-index: 100; font-weight: bold; border: 3px solid white; cursor: pointer; }
    #countdownOverlay { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 100px; font-weight: bold; color: white; text-shadow: 0 0 20px rgba(0, 0, 0, 0.8); z-index: 100; }
    #statusBox { font-size: 12px; text-align: center; color: #00ffaa; margin-bottom: 2px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 5px; background: #111; border-radius: 6px; border: 1px solid #00ffaa; }
    
    .grid-2col { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; box-sizing: border-box; }
    .full-width { grid-column: span 2; }
    .layout-col { background: #222; padding: 10px 8px; border-radius: 8px; border: 1px solid #3c3c3c; display: flex; flex-direction: column; gap: 10px; box-sizing: border-box; overflow: hidden; }
    .layout-col > label { width: 100%; text-align: center; font-size: 11px; margin-bottom: 2px; font-weight: bold; letter-spacing: 0.5px; text-transform: uppercase; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 5px; width: 100%; box-sizing: border-box; }
    .row label { font-size: 9px; width: 45%; color: #ccc; font-weight: 600; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    input[type="range"], select { width: 55%; }
    input[type="range"] { height: 6px; background: transparent; -webkit-appearance: none; appearance: none; }
    input[type="range"]::-webkit-slider-runnable-track { width: 100%; height: 6px; background: #444; border-radius: 3px; border: 1px solid #222; }
    input[type="range"]::-webkit-slider-thumb { height: 18px; width: 18px; border-radius: 50%; background: #007bff; cursor: pointer; -webkit-appearance: none; margin-top: -6px; box-shadow: 0 0 5px rgba(0,0,0,0.5); }
    select { height: 32px; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 6px; font-size: 10px; padding: 0 5px; box-sizing: border-box; cursor: pointer; -webkit-appearance: none; appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="white" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>'); background-repeat: no-repeat; background-position: right 8px center; padding-right: 20px; }
    select.full-select { width: 100%; margin-bottom: 5px; font-size: 11px; }
    input[type="file"] { display: none; }
    optgroup { background: #111; color: #00e5ff; font-weight: bold; }
    hr.thin-line { border: 0; border-top: 1px solid #333; width: 100%; margin: 0; }
  </style>
</head>

<body>
  <div id="canvas-wrapper">
    <canvas id="canvas" width="1280" height="720"></canvas>
    <div id="countdownOverlay">3</div>
    <div id="stopOverlay" onclick="stopRecording()">⏹ STOP & SIMPAN</div>
  </div>

  <div class="zoom-toolbar">
    <label>🔍 Zoom Kanvas</label>
    <input type="range" id="canvasZoomSlider" min="1.0" max="3.0" step="0.1" value="1.0" style="width: 45%;">
    <div class="zoom-btn-group">
      <button class="btn-zoom active" id="zoomBtn1" onclick="setCanvasZoom(1.0)">1x</button>
      <button class="btn-zoom" id="zoomBtn2" onclick="setCanvasZoom(1.8)">1.8x</button>
      <button class="btn-zoom" id="zoomBtn3" onclick="setCanvasZoom(2.6)">2.6x</button>
    </div>
  </div>

  <div id="controls">
    <div id="statusBox">Siap. Mirror Final 1 (Bug Lilin Fixed!).</div>
    
    <div class="btn-group">
      <label for="bgInput" class="file-label" style="border-bottom: 3px solid #d4af37">1. FOTO LATAR</label>
      <label for="audioInput" class="file-label" style="border-bottom: 3px solid #00bcd4">2. MUSIK</label>
    </div>

    <div class="play-group">
      <button id="playBtn" onclick="togglePlay()">⚠ PUTAR MUSIK</button>
      <button id="nextBtn" onclick="playRandomSong(false)">⏭ NEXT</button>
    </div>

    <div class="progress-container">
      <span id="currTime" class="time-text">00:00</span>
      <input type="range" id="progressBar" value="0" min="0" step="0.1">
      <span id="durTime" class="time-text">00:00</span>
    </div>

    <input type="file" id="bgInput" accept="image/*">
    <input type="file" id="audioInput" accept="audio/*" multiple>

    <hr class="thin-line">

    <!-- GRID 1: VISUALIZER (3D PERSPECTIVE) FULL WIDTH -->
    <div class="layout-col full-width" style="margin-bottom: 8px;">
        <label style="color:#00d2ff;">VISUALIZER 3D</label>
        <div class="grid-2col">
            <select id="visType" class="full-select full-width">
                <optgroup label="=== SOLID BARS ===">
                    <option value="vintage_bars">📊 1. Vintage Solid Bars</option>
                    <option value="winamp_classic">📻 2. Winamp Peaks</option>
                    <option value="classic_eq">🎙️ 3. Classic Green-Red EQ</option>
                    <option value="step_eq">🧱 4. Step Block EQ</option>
                    <option value="thin_eq">📏 5. Thin Minimalist EQ</option>
                    <option value="thick_bars">⬛ 6. Bold Solid Bars</option>
                    <option value="hollow_bars">🔲 7. Hollow Outline Bars</option>
                    <option value="rounded_bars">💊 8. Rounded Tip Bars</option>
                    <option value="split_eq">⏸️ 9. Split Center EQ</option>
                    <option value="double_mirror">🪞 10. Dual Mirror Bars</option>
                </optgroup>
                <optgroup label="=== PEAKS & DOTS ===">
                    <option value="dotted_eq">⏺️ 11. Dotted Peak EQ</option>
                    <option value="led_matrix">🚥 12. LED Dot Matrix</option>
                    <option value="analog_vu">🎛️ 13. Analog VU Meter</option>
                    <option value="retro_oscilloscope">📺 14. CRT Oscilloscope</option>
                    <option value="peak_line">〰️ 15. Floating Peak Line</option>
                    <option value="peak_dots_only">⚪ 16. Floating Dots Peak</option>
                    <option value="dash_bars">➖ 17. Dashed Segment Bars</option>
                    <option value="meter_blocks">📶 18. Meter Blocks</option>
                    <option value="soft_glow_bars">🌟 19. Glowing Ambient Bars</option>
                    <option value="white_caps">🧢 20. Bars with White Cap</option>
                </optgroup>
                <optgroup label="=== MODERN GRADIENT ===">
                    <option value="liquid_bar" selected>💧 21. Liquid Glowing Cyan</option>
                    <option value="cyber_pulse">⚡ 22. Neon Pulse Bars</option>
                    <option value="mirror_bars">🪞 23. Mirrored Glass Bars</option>
                    <option value="gradient_blocks">🎛️ 24. Cyan-Blue Gradient</option>
                    <option value="sunset_bars">🌅 25. Warm Sunset Gradient</option>
                    <option value="emerald_bars">💎 26. Emerald Green Grad</option>
                    <option value="purple_haze">🟣 27. Purple-Pink Soft</option>
                    <option value="gold_classic">👑 28. Golden Elegant EQ</option>
                    <option value="monochrome_fade">🎞️ 29. Grayscale Fading</option>
                    <option value="dual_tone">🌗 30. Dual Tone Top-Bot</option>
                </optgroup>
                <optgroup label="=== WAVES & LINES ===">
                    <option value="modern_wave">🌊 31. Modern Smooth Wave</option>
                    <option value="filled_wave">🌊 32. Filled Ambient Wave</option>
                    <option value="double_wave">〰️ 33. Double Layer Wave</option>
                    <option value="thin_wave">✒️ 34. Ultra Thin Line</option>
                    <option value="shadow_wave">🌒 35. Wave with Shadow</option>
                    <option value="stereo_lines">⏸️ 36. Dual Parallel Lines</option>
                    <option value="smooth_curve">🔔 37. Bell Curve Wave</option>
                    <option value="ribbon_wave">🎀 38. Flowing Ribbon Wave</option>
                    <option value="minimal_line">➖ 39. Minimalist Baseline</option>
                    <option value="calm_horizon">🌅 40. Calm Horizon Glow</option>
                </optgroup>
                <optgroup label="=== MODERN & UNIQUE ===">
                    <option value="hologram_grid">🧊 41. Hologram 3D Grid</option>
                    <option value="digital_dna">🧬 42. Digital DNA Wave</option>
                    <option value="matrix_rain">🌧️ 43. Matrix Digital Rain</option>
                    <option value="cyber_laser">💥 44. Cyber Laser Beams</option>
                    <option value="neon_ripple">🔲 45. Neon Square Ripple</option>
                    <option value="aurora_borealis">🌌 46. Aurora Borealis Glow</option>
                    <option value="block_tower">🏙️ 47. Clean 3D EQ Blocks</option>
                    <option value="equalizer_3d">🛠️ 48. Cylinder Studio EQ</option>
                    <option value="floating_blocks">🧊 49. Floating Blocks</option>
                    <option value="classic_studio">🎙️ 50. Pro Studio Rack</option>
                </optgroup>
                <optgroup label="=== RETRO & CLASSIC ===">
                    <option value="classic_spectrum">🌈 51. Classic Spectrum Analyzer</option>
                    <option value="cassette_tape">📼 52. Spinning Cassette Tape</option>
                    <option value="vintage_vu_meter">🎛️ 53. Box Vintage VU Meter</option>
                    <option value="classic_vinyl">💿 54. Classic Vinyl Record</option>
                    <option value="retro_boombox_eq">📻 55. Retro Boombox LED EQ</option>
                </optgroup>
            </select>
            <div class="row"><label>TINGGI</label><input type="range" id="visHeight" min="30" max="600" value="150"></div>
            <div class="row"><label>LEBAR</label><input type="range" id="visWidth" min="100" max="1100" value="400"></div>
            <div class="row"><label style="color:#00e5ff;">SUDUT (PUTAR)</label><input type="range" id="visRot" min="-90" max="90" step="1" value="0"></div>
            <div class="row"><label>OPASITAS</label><input type="range" id="visOpacity" min="0.1" max="1.0" step="0.05" value="1.0"></div>
            <div class="row"><label style="color:#00e5ff;">SKEW X (K-K)</label><input type="range" id="visSkewX" min="-45" max="45" step="1" value="0"></div>
            <div class="row"><label style="color:#00e5ff;">SKEW Y (A-B)</label><input type="range" id="visSkewY" min="-45" max="45" step="1" value="0"></div>
            <div class="row"><label style="color:#00e5ff;">SKALA X</label><input type="range" id="visScaleX" min="0.1" max="3.0" step="0.05" value="1.0"></div>
            <div class="row"><label style="color:#00e5ff;">SKALA Y</label><input type="range" id="visScaleY" min="0.1" max="3.0" step="0.05" value="1.0"></div>
        </div>
    </div>

    <!-- GRID 2: SPEAKER FISIKA -->
    <div class="grid-2col">
      <div class="layout-col">
        <label style="color:#ffb300;">DAUN SPEAKER L</label>
        <div class="row"><label>SAKLAR</label><select id="speakerStyle"><option value="active">🟢 Nyala</option><option value="none">🔴 Mati</option></select></div>
        <div class="row"><label>UK. LUAR</label><input type="range" id="outSize1" min="20" max="300" value="120"></div>
        <div class="row"><label>UK. DALAM</label><input type="range" id="inRatio1" min="0.05" max="0.9" step="0.01" value="0.35"></div>
        <div class="row"><label>GESER X</label><input type="range" id="dustOffX1" min="-150" max="150" step="1" value="0"></div>
        <div class="row"><label>GESER Y</label><input type="range" id="dustOffY1" min="-150" max="150" step="1" value="0"></div>
      </div>
      <div class="layout-col">
        <label style="color:#ffb300;">DAUN SPEAKER R</label>
        <div class="row"><label>GARIS BANTU</label><select id="showGuides"><option value="yes">Nyala (Pause)</option><option value="no">Mati</option></select></div>
        <div class="row"><label>UK. LUAR</label><input type="range" id="outSize2" min="20" max="300" value="120"></div>
        <div class="row"><label>UK. DALAM</label><input type="range" id="inRatio2" min="0.05" max="0.9" step="0.01" value="0.35"></div>
        <div class="row"><label>GESER X</label><input type="range" id="dustOffX2" min="-150" max="150" step="1" value="0"></div>
        <div class="row"><label>GESER Y</label><input type="range" id="dustOffY2" min="-150" max="150" step="1" value="0"></div>
      </div>
    </div>
    
    <!-- GRID 2.1: TENAGA SPEAKER -->
    <div class="grid-2col" style="margin-top:8px;">
        <div class="layout-col full-width" style="flex-direction:row; padding:10px 8px;">
            <div class="row" style="background:transparent; padding:0;"><label style="color:#ff5252;">GETARAN X/Y</label><input type="range" id="speakerShake" min="0" max="40" value="10"></div>
            <div class="row" style="background:transparent; padding:0;"><label style="color:#ff5252;">DENTUMAN ZOOM</label><input type="range" id="speakerPump" min="0" max="3.0" step="0.1" value="1.0"></div>
        </div>
    </div>

    <!-- GRID 3: PERSPEKTIF OVAL (KIRI KANAN PISAH) -->
    <div class="grid-2col" style="margin-top:8px;">
      <div class="layout-col">
        <label style="color:#00bcd4;">PERSPEK. KIRI</label>
        <div class="row"><label>OVAL X</label><input type="range" id="spkOvalX1" min="0.1" max="2.0" step="0.05" value="1.0"></div>
        <div class="row"><label>OVAL Y</label><input type="range" id="spkOvalY1" min="0.1" max="2.0" step="0.05" value="1.0"></div>
        <div class="row"><label>SUDUT</label><input type="range" id="spkRot1" min="-90" max="90" step="1" value="0"></div>
      </div>
      <div class="layout-col">
        <label style="color:#00bcd4;">PERSPEK. KANAN</label>
        <div class="row"><label>OVAL X</label><input type="range" id="spkOvalX2" min="0.1" max="2.0" step="0.05" value="1.0"></div>
        <div class="row"><label>OVAL Y</label><input type="range" id="spkOvalY2" min="0.1" max="2.0" step="0.05" value="1.0"></div>
        <div class="row"><label>SUDUT</label><input type="range" id="spkRot2" min="-90" max="90" step="1" value="0"></div>
      </div>
    </div>

    <!-- GRID 4: PANTULAN -->
    <div class="grid-2col" style="margin-top:8px;">
      <div class="layout-col" style="border-color: #00bcd4;">
        <label style="color:#00bcd4;">SAKLAR KACA</label>
        <div class="row"><label>GRS MEJA</label><select id="showGlassLine"><option value="yes">Nyala</option><option value="no">Mati</option></select></div>
        <div class="row"><label>PANT. VIS</label><select id="showVisReflect"><option value="yes">Nyala</option><option value="no">Mati</option></select></div>
        <div class="row"><label>PANT. SPK</label><select id="showSpkReflect"><option value="yes">Nyala</option><option value="no">Mati</option></select></div>
        <div class="row"><label>PANT. LILIN</label><select id="showCandleReflect"><option value="yes">Nyala</option><option value="no">Mati</option></select></div>
      </div>
      <div class="layout-col" style="border-color: #00bcd4;">
        <label style="color:#00e5ff;">SETTING KACA</label>
        <div class="row"><label>POTONG SPK</label><input type="range" id="spkReflectCrop" min="10" max="100" value="100"></div>
        <div class="row"><label>OPASITAS</label><input type="range" id="spkReflectOpacity" min="0.1" max="1.0" step="0.05" value="0.45"></div>
        <div class="row"><label>UKURAN</label><input type="range" id="spkReflectSize" min="0.1" max="2.0" step="0.1" value="1.0"></div>
      </div>
    </div>

    <!-- GRID 5: ASAP VOLUMETRIC & LILIN -->
    <div class="grid-2col" style="margin-top:8px;">
      <div class="layout-col">
        <label style="color:#d7ccc8;">ASAP KOPI</label>
        <select id="coffeeStyle" class="full-select">
          <option value="none">🚫 Tanpa Asap</option>
          <option value="soft_steam">☕ 1. Soft Warm Steam</option>
          <option value="swirl_vapor">🌪️ 2. Swirling Vapor</option>
          <option value="thin_wisp">🌬️ 3. Thin Elegant</option>
          <option value="heavy_steam">☁️ 4. Heavy Morning</option>
          <option value="wind_steam">🍃 5. Breezy Coffee</option>
        </select>
        <div class="row"><label>UKURAN</label><input type="range" id="propSize" min="0.2" max="5.0" step="0.1" value="1.0"></div>
        <div class="row"><label style="color:#00e5ff;">TEBAL</label><input type="range" id="smokeOpacity" min="0.1" max="4.0" step="0.1" value="1.2"></div>
      </div>
      <div class="layout-col">
        <label style="color:#ff8a65;">API LILIN</label>
        <select id="candleStyle" class="full-select">
          <option value="none">🚫 Tanpa Lilin</option>
          <option value="calm_flame">🕯️ 1. Calm Warm</option>
          <option value="flicker_flame">🕯️ 2. Flickering</option>
          <option value="bright_glow">🌟 3. Bright Glowing</option>
          <option value="blue_base">🔵 4. Blue-Base Flame</option>
          <option value="wind_flame">🌬️ 5. Wind-blown</option>
        </select>
        <div class="row"><label>KCPTN</label><input type="range" id="propSpeed" min="0.1" max="5.0" step="0.1" value="1.0"></div>
      </div>
    </div>

    <!-- EFEK PARTIKEL LINGKUNGAN -->
    <div class="layout-col full-width" style="padding: 12px; margin-top:8px;">
        <label style="color:#00e5ff; text-align:left; margin-bottom:8px;">EFEK PARTIKEL LINGKUNGAN</label>
        <div class="grid-2col">
            <select id="type" class="full-select">
              <option value="none">🚫 Tanpa Partikel</option>
              <option value="dust_motes">✨ Butiran Debu Emas</option>
              <option value="magic_sparks">💫 Percikan Sihir</option>
              <option value="floating_embers">🔥 Bara Api Terbang</option>
              <option value="bokeh_orbs">🫧 Bokeh Sinematik</option>
              <option value="snow_dust">❄️ Debu Salju Halus</option>
              <option value="fairy_light">🧚 Cahaya Peri</option>
              <option value="ash_particles">🌪️ Abu Hitam</option>
              <option value="starlight_glint">🌟 Kilauan Bintang</option>
              <option value="deep_sea_motes">🌊 Partikel Air</option>
              <option value="golden_pollen">🌼 Serbuk Sari</option>
            </select>
            <select id="fxAngle" class="full-select">
              <option value="0">Lurus (Normal)</option>
              <option value="15">Miring Kanan 15°</option>
              <option value="30">Miring Kanan 30°</option>
              <option value="-15">Miring Kiri 15°</option>
              <option value="-30">Miring Kiri 30°</option>
            </select>
        </div>
        <div class="grid-2col">
            <div class="row"><label>KECEPATAN</label><input type="range" id="fxSpeed" min="0.1" max="5.0" step="0.1" value="1.0"></div>
            <div class="row"><label>JUMLAH</label><input type="range" id="count" min="0" max="400" value="100"></div>
        </div>
    </div>

    function drawSpeakerMagic(x, y, refY, R_out, R_in, pump, shakeX, shakeY, dOffX, dOffY, sx, sy, rot, isReflection) {

      const oldVid = document.getElementById('previewVid'); if(oldVid) oldVid.remove(); const oldBtn = document.getElementById('shareBtnDewa'); if(oldBtn) oldBtn.remove();
      const vid = document.createElement('video'); vid.id = 'previewVid'; vid.src = url; vid.controls = true; vid.setAttribute('controlsList', 'nodownload'); vid.style.width = "100%"; vid.style.marginTop = "20px"; vid.style.border = "3px solid #00d2ff"; vid.style.borderRadius = "8px";
      const saveBtn = document.createElement('button'); saveBtn.id = 'shareBtnDewa'; saveBtn.innerText = "📥 SIMPAN KE DOKUMEN (CAPACITOR)"; saveBtn.style.width = "100%"; saveBtn.style.padding = "15px"; saveBtn.style.marginTop = "10px"; saveBtn.style.background = "linear-gradient(135deg, #00ffaa, #00bcd4)"; saveBtn.style.color = "black"; saveBtn.style.border = "none"; saveBtn.style.borderRadius = "8px"; saveBtn.style.fontWeight = "bold"; saveBtn.style.fontSize = "14px"; saveBtn.style.cursor = "pointer";
      let isSaving = false;
      saveBtn.onclick = async () => {
        if (isSaving) return; isSaving = true; saveBtn.innerText = "⏳ MEMINTA IZIN & MENYIMPAN...";
        const downloadBrowser = () => { statusBox.innerText = "⏳ Mengunduh lewat Download Manager HP..."; const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `Mirror720p_${Date.now()}.webm`; document.body.appendChild(a); a.click(); setTimeout(() => { document.body.removeChild(a); }, 100); saveBtn.innerText = "✅ VIDEO SUKSES DIUNDUH!"; statusBox.innerText = `🎉 SUKSES! Video 720p berhasil diunduh ke perangkat Anda.`; };
        try {
          if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem) {
            const FS = window.Capacitor.Plugins.Filesystem; 
            try { let perm = await FS.checkPermissions(); if (perm.publicStorage !== 'granted' && perm.publicStorage !== 'authorized') await FS.requestPermissions(); } catch(e) {} 
            const fileName = `Mirror720p_${Date.now()}.webm`; 
            try {
                await FS.writeFile({ path: fileName, data: "", directory: 'DOCUMENTS' });
                const chunkSize = 1572864; const totalChunks = Math.ceil(finalBlob.size / chunkSize);
                for (let i = 0; i < totalChunks; i++) {
                  const start = i * chunkSize; const end = Math.min(start + chunkSize, finalBlob.size); const chunk = finalBlob.slice(start, end);
                  const base64Chunk = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(chunk); });
                  await FS.appendFile({ path: fileName, data: base64Chunk, directory: 'DOCUMENTS' });
                  const percent = Math.round(((i + 1) / totalChunks) * 100); statusBox.innerText = `⏳ Menulis ke memori HP... ${percent}%`; saveBtn.innerText = `⏳ MENYIMPAN... ${percent}%`;
                }
                saveBtn.innerText = "✅ TERSIMPAN DI FOLDER DOKUMEN!"; statusBox.innerText = `🎉 SUKSES! Video 720p tersimpan di folder Documents!`;
            } catch(fsError) { downloadBrowser(); }
          } else { downloadBrowser(); }
        } catch(e) { try { downloadBrowser(); } catch(err2) { saveBtn.innerText = "❌ GAGAL MENYIMPAN"; statusBox.innerText = "Terjadi Error: " + e.message; isSaving = false; } }
      };
      const controlsDiv = document.getElementById('controls'); controlsDiv.appendChild(vid); controlsDiv.appendChild(saveBtn); saveBtn.scrollIntoView({ behavior: 'smooth' }); setTimeout(() => { if(!isSaving && window.Capacitor) saveBtn.click(); }, 1500);
    }
